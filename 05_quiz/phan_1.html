<script>
const DATA = [{"slide": 5, "q": "Which of the following are commonly recognized design patterns in software development?", "opts": {"A": "Singleton Pattern", "B": "Factory Pattern", "C": "Decorator Pattern", "D": "Provisional Pattern", "E": "Exclusive Pattern"}, "ans": ["A", "B", "C"], "hook": "design patterns → Singleton, Factory, Decorator", "why": "Đây là ba mẫu thiết kế kinh điển và cực kỳ phổ biến trong nhóm Gang of Four (GoF) design patterns.", "trap": "D và E sai vì Provisional và Exclusive không phải là các mẫu thiết kế chuẩn trong công nghệ phần mềm."}, {"slide": 7, "q": "What are some ethical considerations when deploying AI systems?", "opts": {"A": "Bias in AI algorithms.", "B": "Privacy and data protection.", "C": "AI's inability to perform complex calculations.", "D": "Job displacement and economic impacts.", "E": "The color of the AI interface."}, "ans": ["A", "B", "D"], "hook": "ethical considerations → Bias, Privacy, Job displacement", "why": "Đạo đức trong triển khai AI liên quan trực tiếp đến sự thiên vị thuật toán, bảo mật dữ liệu người dùng và tác động mất việc làm của người lao động.", "trap": "C sai vì đây là giới hạn kỹ thuật của AI chứ không thuộc phạm trù đạo đức xã hội."}, {"slide": 8, "q": "What are the components of a decision tree?", "opts": {"A": "Nodes, which represent features or decisions.", "B": "Edges, which represent the outcome of a decision at a node.", "C": "Leaves, which represent final decisions or predictions.", "D": "Layers, which stack to increase the tree's height."}, "ans": ["A", "B", "C"], "hook": "decision tree components → Nodes, Edges, Leaves", "why": "Cấu trúc của một cây quyết định luôn bao gồm các nút để biểu diễn thuộc tính hoặc quyết định, các cạnh để chỉ ra kết quả lựa chọn và các lá để chứa kết quả dự đoán cuối cùng.", "trap": "D sai vì Layers là thành phần đặc trưng của mạng nơ-ron nhân tạo chứ không thuộc cấu trúc của cây quyết định."}, {"slide": 9, "q": "Which of the following are critical steps in evaluating the effectiveness of test cases in a software application?", "opts": {"A": "Assess code coverage to ensure comprehensive testing.", "B": "Review test case outcomes against expected results.", "C": "Increase the number of test cases irrespective of relevance.", "D": "Analyze test case execution time and resource usage.", "E": "Focus solely on the UI aspects of the application."}, "ans": ["A", "B", "D"], "hook": "test case effectiveness → code coverage, outcomes, execution time", "why": "Đánh giá hiệu quả test case cần xem xét mức độ bao phủ mã, kết quả thực tế so với mong đợi và hiệu suất chạy test.", "trap": "C sai vì tăng số lượng test case mà không quan tâm đến sự liên quan không đảm bảo hiệu quả, thậm chí có thể lãng phí tài nguyên."}, {"slide": 10, "q": "Which of the following are valid ways AI tools can enhance Java development workflows? Select 3 correct answers.", "opts": {"A": "Automating code refactoring tasks", "B": "Generating unit tests automatically", "C": "Completely replacing human developers", "D": "Providing intelligent code suggestions", "E": "Removing the need for code reviews"}, "ans": ["A", "B", "D"], "hook": "AI tools Java development → Automating, Generating, Providing", "why": "Các công cụ AI hiện nay chỉ đóng vai trò hỗ trợ tăng năng suất thông qua tự động hóa tái cấu trúc, sinh test case và gợi ý code chứ chưa thể thay thế hoàn toàn con người hay loại bỏ quy trình kiểm duyệt code.", "trap": "C và E sai vì AI hiện tại không thể thay thế hoàn toàn lập trình viên hay loại bỏ bước code review vốn cực kỳ quan trọng để đảm bảo chất lượng hệ thống."}, {"slide": 11, "q": "Which of the following statements about the Strategy Pattern are true?", "opts": {"A": "It provides a way to choose algorithms at runtime.", "B": "It encapsulates varying behaviors in classes.", "C": "It restricts the use of inheritance.", "D": "It keeps the algorithm implementation independent of client classes.", "E": "It forces all classes to implement the same interface."}, "ans": ["A", "B", "D"], "hook": "Strategy Pattern → choose runtime, encapsulate behaviors, independent client", "why": "Strategy Pattern cho phép thay đổi thuật toán linh hoạt lúc chạy bằng cách đóng gói các hành vi khác nhau vào các lớp riêng biệt, giúp thuật toán độc lập với lớp sử dụng nó.", "trap": "C sai vì Strategy Pattern thực tế khuyến khích sự kết hợp thay vì kế thừa nhưng nó không hề cấm đoán hay giới hạn việc sử dụng kế thừa trong toàn bộ hệ thống."}, {"slide": 12, "q": "Which metrics are commonly used to measure software quality?", "opts": {"A": "Defect density", "B": "Market share growth", "C": "Code churn rate", "D": "Employee satisfaction index", "E": "Mean time to failure"}, "ans": ["A", "C", "E"], "hook": "Software Quality → Defect, Churn, Failure", "why": "Các metric phổ biến đo chất lượng phần mềm bao gồm mật độ lỗi (Defect density), tốc độ thay đổi code (Code churn rate) và thời gian trung bình đến lỗi (Mean time to failure).", "trap": "B sai vì Market share growth đo lường sự phát triển thị trường, không phải chất lượng phần mềm; D sai vì Employee satisfaction index đo lường sự hài lòng của nhân viên, không phải chất lượng phần mềm."}, {"slide": 13, "q": "Which components are essential in constructing a comprehensive use-case model?", "opts": {"A": "Actors", "B": "Scenarios", "C": "System boundaries", "D": "Database schemas"}, "ans": ["A", "B", "C"], "hook": "comprehensive use-case model → Actors, Scenarios, System boundaries", "why": "Một mô hình use case toàn diện cần có tác nhân tương tác, các kịch bản luồng công việc và ranh giới xác định phạm vi của hệ thống.", "trap": "D sai vì Database schemas thuộc về mức thiết kế dữ liệu chi tiết ở tầng dưới chứ không nằm trong mô hình use case ở mức đặc tả yêu cầu."}, {"slide": 14, "q": "Select the correct elements necessary for constructing a state machine diagram for a checkout system in a movie shop.", "opts": {"A": "States", "B": "Transitions", "C": "Initial State", "D": "Cost analysis", "E": "Product categories"}, "ans": ["A", "B", "C"], "hook": "state machine diagram → States, Transitions, Initial State", "why": "Bản chất của biểu đồ trạng thái state machine diagram là mô tả các trạng thái của hệ thống cùng sự chuyển dịch giữa chúng nên bắt buộc phải có States, Transitions và điểm bắt đầu Initial State.", "trap": "D và E sai vì Cost analysis và Product categories là các khái niệm thuộc về phân tích kinh doanh và quản lý sản phẩm, không phải là phần tử cấu thành nên một biểu đồ kỹ thuật UML."}, {"slide": 15, "q": "Which of the following are commonly recognized design patterns in software development?", "opts": {"A": "Singleton Pattern", "B": "Factory Pattern", "C": "Decorator Pattern", "D": "Proprietary Pattern", "E": "Exclusive Pattern"}, "ans": ["A", "B", "C"], "hook": "design patterns → Singleton, Factory, Decorator", "why": "Singleton, Factory và Decorator là ba mẫu thiết kế kinh điển và cực kỳ phổ biến trong cuốn sách Gang of Four nổi tiếng.", "trap": "D và E sai vì Proprietary và Exclusive chỉ là các thuật ngữ mô tả tính chất độc quyền, hoàn toàn không phải là design patterns trong công nghệ phần mềm."}, {"slide": 16, "q": "Which of the following are steps to enhance chatbot development using Amazon Q Developer?", "opts": {"A": "Utilize pre-trained models for natural language understanding.", "B": "Integrate with cloud-based services for scalability.", "C": "Develop AI from scratch without using any existing frameworks.", "D": "Implement continuous learning for improved accuracy.", "E": "Focus solely on graphical user interface design."}, "ans": ["A", "B", "D"], "hook": "Amazon Q Developer → pre-trained, cloud, continuous learning", "why": "Amazon Q Developer là nền tảng của AWS, giúp tăng cường phát triển chatbot bằng cách tận dụng các mô hình đã huấn luyện, tích hợp dịch vụ đám mây và học hỏi liên tục.", "trap": "C sai vì Amazon Q Developer được thiết kế để tăng tốc phát triển AI, không phải để phát triển AI từ đầu mà không dùng framework nào."}, {"slide": 17, "q": "Which conditions should be considered when performing loop testing?", "opts": {"A": "Entry and exit conditions of the loop", "B": "Performance impact of the loop", "C": "Initialization of loop variables", "D": "User interface appearance during loop execution"}, "ans": ["A", "B", "C"], "hook": "Loop testing → Entry/exit, performance, init", "why": "Khi kiểm thử vòng lặp, cần xem xét các điều kiện vào/ra, hiệu suất và khởi tạo biến để đảm bảo vòng lặp hoạt động đúng và hiệu quả.", "trap": "D sai vì giao diện người dùng không phải là điều kiện kiểm thử vòng lặp mà là vấn đề của giao diện chung."}, {"slide": 18, "q": "Which of the following actions are part of implementing various types of software tests effectively?", "opts": {"A": "Defining clear test objectives", "B": "Choosing appropriate testing tools", "C": "Avoiding documentation of test cases", "D": "Conducting thorough test reviews", "E": "Emphasizing only positive test results"}, "ans": ["A", "B", "D"], "hook": "implementing software tests → Defining, Choosing, Conducting", "why": "Để triển khai kiểm thử phần mềm hiệu quả thì cần xác định rõ mục tiêu, chọn công cụ phù hợp và đánh giá kết quả kiểm thử kỹ lưỡng.", "trap": "C sai vì việc tránh tài liệu hóa test case là hoàn toàn sai nguyên tắc kiểm thử chuyên nghiệp."}, {"slide": 19, "q": "Which of the following elements can be part of a UML Class Diagram?", "opts": {"A": "Attributes", "B": "Methods", "C": "Actors", "D": "Nodes", "E": "Relationships"}, "ans": ["A", "B", "E"], "hook": "Class Diagram → Attributes, Methods, Relationships", "why": "UML Class Diagram biểu diễn cấu trúc tĩnh của hệ thống, bao gồm các lớp, thuộc tính, phương thức và mối quan hệ giữa chúng.", "trap": "C sai vì Actors là thành phần của Use Case Diagram, không phải Class Diagram. D sai vì Nodes là thành phần của Deployment Diagram, không phải Class Diagram."}, {"slide": 20, "q": "Which of the following conditions may cause an extension to occur in a use case? (Select THREE correct answers.)", "opts": {"A": "Condition-based extensions", "B": "Event-driven extensions", "C": "Exception-driven extensions", "D": "Time-based extensions", "E": "Actor-based extensions"}, "ans": ["A", "B", "C"], "hook": "use case extension → Condition, Event, Exception", "why": "Các extension trong use case thường được kích hoạt bởi một điều kiện cụ thể, một sự kiện xảy ra, hoặc một ngoại lệ cần xử lý.", "trap": "D sai vì Time-based extensions không phải là một loại extension tiêu chuẩn trong use case; E sai vì Actor-based extensions không phải là điều kiện gây extension mà actor chỉ là người thực hiện."}, {"slide": 21, "q": "When validating system requirements for completeness and consistency, which of the following actions should be taken?", "opts": {"A": "Conduct peer reviews", "B": "Perform traceability analysis", "C": "Only rely on initial client interviews", "D": "Ignore stakeholder feedback", "E": "Utilize automated tools for requirement validation"}, "ans": ["A", "B", "E"], "hook": "validating requirements → Peer review, Traceability, Automated tools", "why": "Để đảm bảo yêu cầu hệ thống đầy đủ và nhất quán, cần có nhiều phương pháp kiểm tra chéo và tự động hóa.", "trap": "C sai vì chỉ dựa vào phỏng vấn ban đầu là không đủ để xác thực yêu cầu, cần nhiều phương pháp khác; D sai vì bỏ qua phản hồi của các bên liên quan sẽ dẫn đến yêu cầu không chính xác hoặc thiếu sót."}, {"slide": 22, "q": "In the context of version control, which practices are recommended for maintaining code integrity?", "opts": {"A": "Frequent commits with clear messages", "B": "Ignoring merge conflicts", "C": "Branching for new features", "D": "Regular code reviews", "E": "Only updating code when absolutely necessary"}, "ans": ["A", "C", "D"], "hook": "version control integrity → commits, branching, reviews", "why": "Các thực hành tốt nhất để duy trì tính toàn vẹn của mã nguồn bao gồm việc lưu lại lịch sử thường xuyên, phân nhánh để phát triển tính năng mới độc lập và đánh giá mã nguồn để kiểm soát chất lượng trước khi gộp.", "trap": "B sai vì việc bỏ qua các xung đột khi gộp mã nguồn sẽ trực tiếp phá hỏng tính toàn vẹn và gây lỗi nghiêm trọng cho hệ thống."}, {"slide": 23, "q": "Select the techniques that are essential for ensuring project success by applying requirements.", "opts": {"A": "Prioritizing requirements", "B": "Validating requirements against objectives", "C": "Tracking requirement changes", "D": "Ignoring user feedback", "E": "Focusing only on technical specifications"}, "ans": ["A", "B", "C"], "hook": "ensuring project success by applying requirements → Prioritizing, Validating, Tracking", "why": "Để đảm bảo dự án thành công khi áp dụng yêu cầu thì cần phải ưu tiên hóa các yêu cầu, xác thực chúng dựa trên mục tiêu và theo dõi các thay đổi của chúng trong suốt vòng đời dự án.", "trap": "D và E sai vì bỏ qua phản hồi của người dùng và chỉ tập trung vào đặc tả kỹ thuật sẽ dẫn đến sản phẩm không đáp ứng đúng nhu cầu thực tế."}, {"slide": 24, "q": "Select the principles that should be considered when designing system architectures.", "opts": {"A": "Modularity", "B": "Scalability", "C": "Maintainability", "D": "Randomness", "E": "Redundancy"}, "ans": ["A", "B", "C"], "hook": "designing system architectures → Modularity, Scalability, Maintainability", "why": "Thiết kế kiến trúc hệ thống luôn hướng tới tính mô-đun hóa để dễ quản lý, khả năng mở rộng quy mô khi tải tăng và tính dễ bảo trì lâu dài.", "trap": "E sai vì Redundancy thường là kỹ thuật dự phòng trong thiết kế hệ thống tin cậy cao chứ không phải là một nguyên lý thiết kế kiến trúc cốt lõi mang tính tổng quát như ba yếu tố kia."}, {"slide": 25, "q": "Select all factors to consider when gathering project requirements using the Requirements Worksheet.", "opts": {"A": "Stakeholder needs and expectations", "B": "Compliance with legal and regulatory standards", "C": "Ignoring conflicting requirements", "D": "Feasibility of implementation", "E": "Assuming all requirements are non-negotiable"}, "ans": ["A", "B", "D"], "hook": "Requirements Worksheet → Stakeholder, Legal, Feasibility", "why": "Khi thu thập yêu cầu, cần xem xét các yếu tố bên ngoài (stakeholder, pháp lý) và yếu tố khả thi nội tại của dự án.", "trap": "C sai vì luôn phải giải quyết các yêu cầu mâu thuẫn chứ không phải bỏ qua; E sai vì không phải tất cả các yêu cầu đều không thể thương lượng."}, {"slide": 27, "q": "What is one of the advantages of using incremental development in software engineering?", "opts": {"A": "Allows for frequent feedback and adjustments", "B": "Ensures complete upfront knowledge of requirements", "C": "Guarantees minimal bugs in the final product", "D": "Reduces the need for design documentation"}, "ans": ["A"], "hook": "incremental development → frequent feedback", "why": "Phát triển tiệm tiến chia nhỏ dự án thành nhiều phần để bàn giao sớm, từ đó giúp khách hàng dễ dàng theo dõi và đưa ra phản hồi liên tục.", "trap": "B sai vì việc hiểu rõ toàn bộ yêu cầu ngay từ đầu là đặc trưng của mô hình Waterfall chứ không phải Incremental."}, {"slide": 28, "q": "What is the primary role of the Factory Pattern in applying the open-closed principle in software design?", "opts": {"A": "To allow software entities to be open for extension but closed for modification.", "B": "To ensure that a class has only one instance and provides a global point of access to it.", "C": "To provide a way to defer the instantiation of objects until necessary.", "D": "To simplify code readability by reducing the number of classes needed."}, "ans": ["A"], "hook": "Factory Pattern Open-Closed → Extension not Modification", "why": "Factory Pattern hỗ trợ nguyên lý Open-Closed bằng cách cho phép thêm loại đối tượng mới mà không cần sửa đổi code hiện có.", "trap": "C sai vì đó là vai trò của Lazy Initialization, không phải trọng tâm của Factory Pattern trong việc áp dụng Open-Closed Principle."}, {"slide": 29, "q": "What is the primary benefit of using the Factory Pattern in software design?", "opts": {"A": "It promotes code reusability by allowing the creation of objects without specifying the exact class.", "B": "It ensures a single instance of a class is created.", "C": "It simplifies the interface for object creation by using inheritance.", "D": "It provides a way to structure code with a strict hierarchy."}, "ans": ["A"], "hook": "Factory Pattern → creation without specifying exact class", "why": "Factory Pattern giúp che giấu logic khởi tạo phức tạp và tách biệt quá trình tạo đối tượng khỏi lớp sử dụng trực tiếp, giúp mã nguồn linh hoạt và dễ tái sử dụng hơn.", "trap": "B sai vì đảm bảo chỉ tạo một thực thể duy nhất của lớp là đặc trưng của Singleton Pattern chứ không phải Factory Pattern."}, {"slide": 30, "q": "What is the purpose of applying estimation techniques in project management?", "opts": {"A": "To establish project scope", "B": "To predict project size and duration", "C": "To identify project risks", "D": "To create a detailed project plan"}, "ans": ["B"], "hook": "estimation → predict size and duration", "why": "Kỹ thuật ước lượng trong quản lý dự án được sử dụng để dự đoán trước quy mô kích thước và khoảng thời gian cần thiết để hoàn thành dự án.", "trap": "D sai vì tạo kế hoạch chi tiết đòi hỏi nhiều bước lập lịch và phân bổ nguồn lực cụ thể chứ không chỉ dừng lại ở việc ước lượng."}, {"slide": 31, "q": "What is a primary difference between testing and debugging in software development?", "opts": {"A": "Testing identifies errors; debugging fixes them", "B": "Testing fixes errors; debugging identifies them", "C": "Testing happens after debugging", "D": "Testing doesn't involve any code analysis"}, "ans": ["A"], "hook": "testing vs debugging → testing identifies, debugging fixes", "why": "Testing là quá trình chạy chương trình để phát hiện và tìm ra lỗi, trong khi debugging là quá trình cô lập nguyên nhân và sửa chữa lỗi đó.", "trap": "B sai vì phương án này bị đảo ngược hoàn toàn vai trò của hai hoạt động."}, {"slide": 32, "q": "What is the key component of a software project plan that outlines the timeline and milestones?", "opts": {"A": "Schedule Management Plan", "B": "Quality Management Plan", "C": "Risk Management Plan", "D": "Communication Management Plan"}, "ans": ["A"], "hook": "timeline and milestones → Schedule Management Plan", "why": "Schedule Management Plan chịu trách nhiệm thiết lập lịch trình, xác định thời hạn và các mốc quan trọng của dự án phần mềm.", "trap": "C sai vì Risk Management Plan chỉ tập trung vào việc nhận diện và xử lý rủi ro chứ không quản lý mốc thời gian."}, {"slide": 33, "q": "What is the primary purpose of configuration management in software development?", "opts": {"A": "To maintain consistency of a product's performance and functionality", "B": "To enhance the user interface of the software", "C": "To increase the speed of software development", "D": "To automate software testing processes"}, "ans": ["A"], "hook": "configuration management → consistency", "why": "Quản lý cấu hình tập trung vào việc duy trì sự đồng nhất và kiểm soát các thay đổi đối với sản phẩm phần mềm trong suốt vòng đời của nó.", "trap": "C sai vì tốc độ phát triển phụ thuộc vào quy trình Agile hoặc công cụ hỗ trợ chứ không phải mục đích chính của quản lý cấu hình."}, {"slide": 34, "q": "What is the primary purpose of acceptance testing in a movie shop application?", "opts": {"A": "To ensure the application meets business requirements.", "B": "To identify syntax errors in the code.", "C": "To test the integration of different modules.", "D": "To assess the performance under load."}, "ans": ["A"], "hook": "acceptance testing → business requirements", "why": "Acceptance testing là kiểm thử chấp nhận nhằm xác định xem hệ thống đã đáp ứng đúng các yêu cầu nghiệp vụ và mong đợi của khách hàng hay chưa.", "trap": "C sai vì việc tích hợp các module là nhiệm vụ của integration testing chứ không phải acceptance testing."}, {"slide": 35, "q": "What is the primary objective of black box testing?", "opts": {"A": "To evaluate software functionality without examining internal code", "B": "To improve code readability and maintainability", "C": "To assess the scalability of the software architecture", "D": "To determine the software's compliance with coding standards"}, "ans": ["A"], "hook": "black box → functionality", "why": "Kiểm thử hộp đen tập trung vào việc xác minh chức năng của phần mềm từ góc độ người dùng, không cần biết cấu trúc bên trong.", "trap": "B sai vì đó là mục tiêu của refactoring hoặc clean code; C sai vì đó là mục tiêu của kiểm thử hiệu năng hoặc stress test; D sai vì đó là mục tiêu của kiểm thử tĩnh hoặc review code."}, {"slide": 36, "q": "What is a key requirement for project success in the context of use case development?", "opts": {"A": "Clear and detailed specifications that all stakeholders understand.", "B": "A fast-paced development cycle to outpace competitors.", "C": "A large team to handle diverse project aspects.", "D": "Frequent changes to adapt to new technologies."}, "ans": ["A"], "hook": "use case development → clear and detailed specifications", "why": "Để phát triển use case thành công thì yêu cầu cốt lõi là các bên liên quan phải hiểu rõ ràng và chi tiết các đặc tả yêu cầu hệ thống.", "trap": "B sai vì tốc độ phát triển nhanh chỉ là yếu tố phụ, nếu không hiểu rõ đặc tả từ đầu thì sản phẩm làm ra nhanh vẫn sẽ thất bại."}, {"slide": 37, "q": "What is the primary purpose of applying defensive programming techniques in software development?", "opts": {"A": "Enhance code reliability by handling unexpected inputs gracefully", "B": "Increase code execution speed through optimized algorithms", "C": "Reduce the overall size of the codebase by removing redundancies", "D": "Ensure compatibility with future versions of the programming language"}, "ans": ["A"], "hook": "defensive programming → unexpected inputs gracefully", "why": "Defensive programming hay lập trình phòng thủ là kỹ thuật viết mã nguồn sao cho chương trình vẫn hoạt động ổn định và tin cậy bằng cách lường trước và xử lý khéo léo các tình huống dữ liệu đầu vào bất thường.", "trap": "B sai vì lập trình phòng thủ thường làm tăng số lượng câu lệnh kiểm tra điều kiện nên không giúp tăng tốc độ thực thi mã nguồn."}, {"slide": 38, "q": "Which testing technique is most suitable for identifying independent paths in a flow graph?", "opts": {"A": "Basis path testing", "B": "Regression testing", "C": "Black box testing", "D": "White box testing"}, "ans": ["A"], "hook": "independent paths → Basis path", "why": "Basis path testing được thiết kế để tìm các đường độc lập trong biểu đồ luồng.", "trap": "D sai vì White box testing là một loại kiểm thử (bao gồm Basis path testing), không phải một kỹ thuật cụ thể để tìm đường độc lập."}, {"slide": 39, "q": "Which of the following is an example of multiplicity in a UML class diagram?", "opts": {"A": "One to many", "B": "Private", "C": "Abstract", "D": "Extends"}, "ans": ["A"], "hook": "multiplicity → One to many", "why": "Multiplicity trong biểu đồ lớp UML thể hiện bội số quan hệ giữa các thực thể, ví dụ như quan hệ một - nhiều hoặc một - một.", "trap": "D sai vì Extends là từ khóa thể hiện quan hệ kế thừa trong lập trình hoặc mối quan hệ giữa các use case chứ không phải bội số quan hệ."}, {"slide": 40, "q": "Which of the following is a crucial step to validate that system requirements are complete?", "opts": {"A": "Conducting a thorough requirements review", "B": "Assuming stakeholder agreement", "C": "Relying solely on automated tools", "D": "Skipping documentation for minor requirements"}, "ans": ["A"], "hook": "complete → review", "why": "Kiểm tra kỹ lưỡng các yêu cầu là bước quan trọng nhất để đảm bảo chúng đầy đủ và chính xác.", "trap": "B sai vì không thể giả định sự đồng thuận của các bên liên quan mà không có xác nhận."}, {"slide": 41, "q": "Which of the following best describes the purpose of Scrum in software development?", "opts": {"A": "Scrum is a framework for managing work with an emphasis on iterative progress.", "B": "Scrum is a programming language used in Agile development.", "C": "Scrum is a database management system for software projects.", "D": "Scrum is a tool for automating testing in software development."}, "ans": ["A"], "hook": "Scrum → framework iterative", "why": "Scrum là một khung làm việc linh hoạt, tập trung vào việc phát triển phần mềm theo các chu kỳ lặp đi lặp lại để đạt được tiến độ liên tục.", "trap": "B sai vì Scrum là một framework, không phải ngôn ngữ lập trình."}, {"slide": 42, "q": "Which of the following is a major activity involved in capturing system requirements in software development?", "opts": {"A": "Defining user interactions", "B": "Implementing code", "C": "Testing software", "D": "Deploying applications"}, "ans": ["A"], "hook": "capturing requirements → user interactions", "why": "Xác định yêu cầu hệ thống thực chất là tìm hiểu người dùng sẽ tương tác với phần mềm như thế nào để giải quyết vấn đề của họ.", "trap": "B sai vì việc viết mã thuộc giai đoạn Implementation chứ không phải Capture Requirements."}, {"slide": 43, "q": "Which UML diagram would be most suitable to represent the structure of a banking application, focusing on the relationships between account holders, accounts, and transactions?", "opts": {"A": "Class Diagram", "B": "Sequence Diagram", "C": "Activity Diagram", "D": "State Diagram"}, "ans": ["A"], "hook": "Banking structure → Class Diagram", "why": "Class Diagram biểu diễn cấu trúc tĩnh của hệ thống, bao gồm các lớp, thuộc tính, phương thức và mối quan hệ giữa chúng, rất phù hợp để mô tả các đối tượng như người giữ tài khoản, tài khoản và giao dịch.", "trap": "Sequence Diagram sai vì nó tập trung vào luồng tương tác giữa các đối tượng theo thời gian, không phải cấu trúc tĩnh."}, {"slide": 44, "q": "Which factor best indicates the impact of a risk on a software development project?", "opts": {"A": "Potential consequences on project milestones", "B": "The number of team members affected", "C": "Availability of risk mitigation strategies", "D": "Compliance with industry standards"}, "ans": ["A"], "hook": "risk impact → consequences on milestones", "why": "Tác động của rủi ro thường được đánh giá qua những hậu quả mà nó gây ra cho các mục tiêu quan trọng của dự án, đặc biệt là các mốc thời gian.", "trap": "B sai vì số lượng thành viên bị ảnh hưởng không phải là thước đo chính xác nhất về tác động tổng thể của rủi ro lên dự án."}, {"slide": 45, "q": "Which of the following best captures the concept of a 'user story' in Agile development?", "opts": {"A": "A detailed technical specification of a feature", "B": "A simple description of a feature from an end-user perspective", "C": "A contract between developers and stakeholders", "D": "A timeline for project delivery"}, "ans": ["B"], "hook": "user story → end-user perspective", "why": "User story bản chất là mô tả ngắn gọn và đơn giản về một tính năng dưới góc nhìn của người dùng cuối thay vì mang tính kỹ thuật.", "trap": "A sai vì user story không bao giờ là một tài liệu đặc tả kỹ thuật chi tiết."}, {"slide": 46, "q": "Which approach in software modeling starts with the overall system design and then progressively breaks it down into smaller components or modules?", "opts": {"A": "Sequential approach", "B": "Iterative approach", "C": "Top-down approach", "D": "Bottom-up approach"}, "ans": ["C"], "hook": "overall system design → Top-down approach", "why": "Phương pháp tiếp cận top-down bắt đầu từ bức tranh tổng thể của hệ thống rồi mới phân rã chi tiết thành các thành phần nhỏ hơn.", "trap": "D sai vì Bottom-up đi từ các thành phần nhỏ, chi tiết rồi mới ghép thành hệ thống lớn, hoàn toàn ngược lại với đề bài."}, {"slide": 47, "q": "Which of the following best describes the concept of 'abstraction' in use case analysis?", "opts": {"A": "Simplifying complex systems by focusing on essential features only", "B": "Eliminating non-functional requirements from system design", "C": "Ensuring all software components are reusable", "D": "Maximizing data redundancy to improve performance"}, "ans": ["A"], "hook": "abstraction use case → essential features", "why": "Abstraction là quá trình đơn giản hóa hệ thống bằng cách chỉ tập trung vào các đặc điểm cốt lõi.", "trap": "B sai vì abstraction không phải là loại bỏ non-functional requirements mà là tập trung vào các tính năng chính."}, {"slide": 48, "q": "How does modularity help in managing the complexity of software systems?", "opts": {"A": "By breaking down systems into smaller, manageable components", "B": "By increasing the overall size of the codebase", "C": "By eliminating the need for design patterns", "D": "By reducing the need for programming languages"}, "ans": ["A"], "hook": "modularity → smaller manageable components", "why": "Chia nhỏ hệ thống thành các module giúp giảm tải nhận thức và dễ dàng quản lý từng phần riêng biệt.", "trap": "B sai vì modularity giúp tổ chức code tốt hơn chứ không phải làm tăng kích thước mã nguồn."}, {"slide": 49, "q": "How do standards and metrics contribute to maintaining consistent software quality in quality assurance?", "opts": {"A": "They provide benchmarks and measurements to maintain consistent software quality.", "B": "They outline the software development lifecycle stages.", "C": "They focus primarily on code optimization techniques.", "D": "They dictate the programming languages and design pattern used in development."}, "ans": ["A"], "hook": "Standards, metrics → Benchmarks, measurements", "why": "Tiêu chuẩn và số đo đóng vai trò là các mốc chuẩn và thước đo định lượng để đảm bảo chất lượng phần mềm đồng nhất.", "trap": "C sai vì tối ưu mã nguồn chỉ là một phần nhỏ của kỹ thuật chứ không đại diện cho toàn bộ quy trình đảm bảo chất lượng."}, {"slide": 50, "q": "How does Amazon Q Developer assist in generating Java documentation?", "opts": {"A": "By analyzing code semantics and auto-generating documentation based on it", "B": "By converting comments into structured documentation", "C": "By using machine learning to predict documentation needs", "D": "By following pre-written templates for common Java classes"}, "ans": ["A"], "hook": "Amazon Q Developer → Analyzing code semantics", "why": "Công cụ này sử dụng AI để hiểu ngữ nghĩa của mã nguồn và tự động tạo ra tài liệu mô tả chính xác chức năng của code đó.", "trap": "B sai vì việc chuyển đổi comment có sẵn chỉ là một kỹ thuật cũ, Amazon Q có khả năng tự phân tích logic code để viết tài liệu mới."}, {"slide": 51, "q": "How do UML diagrams aid in understanding system design?", "opts": {"A": "By visually representing system components and their relationships.", "B": "By detailing the exact code implementation.", "C": "By ensuring systems run without errors.", "D": "By replacing the need for technical documentation."}, "ans": ["A"], "hook": "UML diagrams → visually representing", "why": "UML là ngôn ngữ mô hình hóa trực quan giúp lập trình viên hình dung cấu trúc và mối quan hệ giữa các thành phần trong hệ thống mà không cần đọc code chi tiết.", "trap": "B sai vì UML tập trung vào thiết kế mức cao chứ không mô tả chi tiết mã nguồn triển khai."}, {"slide": 52, "q": "During requirements analysis, what is an essential activity to ensure comprehensive understanding of the system requirements?", "opts": {"A": "Engaging with end users to gather detailed requirements", "B": "Immediately starting code development to test assumptions", "C": "Focusing solely on technical specifications", "D": "Skipping documentation to save time"}, "ans": ["A"], "hook": "requirements analysis → engaging end users", "why": "Phân tích yêu cầu cần sự tương tác trực tiếp với người dùng cuối để hiểu rõ nhu cầu thực tế và mục tiêu của hệ thống.", "trap": "C sai vì chỉ tập trung vào thông số kỹ thuật là chưa đủ để hiểu toàn diện yêu cầu nghiệp vụ."}, {"slide": 53, "q": "In the context of a movie shop, which analysis method is most suitable for understanding customer behavior and preferences?", "opts": {"A": "Regression analysis", "B": "Customer segmentation analysis", "C": "Inventory turnover analysis", "D": "SWOT analysis"}, "ans": ["B"], "hook": "customer behavior → customer segmentation", "why": "Phân đoạn khách hàng là phương pháp tốt nhất để phân loại và hiểu rõ hành vi cũng như sở thích riêng biệt của từng nhóm người dùng.", "trap": "A sai vì Regression analysis thường dùng để dự báo xu hướng hoặc mối quan hệ giữa các biến số hơn là hiểu đặc điểm hành vi."}, {"slide": 54, "q": "In a neural network, what is the main role of the hidden layer?", "opts": {"A": "To process inputs and pass the transformation to the output layer.", "B": "To initialize weights for the input layer.", "C": "To directly compare the output with expected results.", "D": "To store static data for future input processing."}, "ans": ["A"], "hook": "hidden layer → process inputs", "why": "Lớp ẩn có nhiệm vụ chính là biến đổi và xử lý dữ liệu đầu vào trước khi chuyển đến lớp đầu ra.", "trap": "C sai vì việc so sánh trực tiếp output với kết quả mong đợi là vai trò của hàm mất mát (loss function) hoặc các thuật toán huấn luyện, không phải của lớp ẩn."}, {"slide": 55, "q": "In the context of software development, what is a critical consideration when applying implementation strategies to real-world scenarios?", "opts": {"A": "Ensuring scalability to handle increased load", "B": "Focusing solely on code aesthetics", "C": "Avoiding the use of any third-party libraries", "D": "Minimizing initial development time at any cost"}, "ans": ["A"], "hook": "real-world scenarios → scalability", "why": "Khi áp dụng các chiến lược triển khai vào thực tế, hệ thống bắt buộc phải có khả năng mở rộng để đáp ứng lượng tải thực tế ngày càng tăng từ người dùng.", "trap": "D sai vì việc giảm tối đa thời gian phát triển bằng mọi giá sẽ dẫn đến nợ kỹ thuật nghiêm trọng và sản phẩm không thể sử dụng lâu dài."}, {"slide": 56, "q": "Identify important aspects of the quality assurance process.", "opts": {"A": "Regular audits to ensure compliance with standards.", "B": "Training programs to enhance team skills and knowledge.", "C": "Marketing strategies to improve software visibility.", "D": "User interface design to enhance user experience."}, "ans": ["A"], "hook": "quality assurance → Regular audits", "why": "Đảm bảo chất lượng phần mềm đòi hỏi việc kiểm tra và đánh giá định kỳ để chắc chắn rằng quy trình phát triển luôn tuân thủ các tiêu chuẩn chất lượng đã đề ra.", "trap": "B sai vì việc đào tạo nâng cao kỹ năng đội ngũ thuộc về quản lý nhân sự hơn là một hoạt động kiểm soát trực tiếp trong quy trình đảm bảo chất lượng."}];
const KEY = 'swe202c_quiz_v2_p1';
const BUILD = '23:00 11/08';
// localStorage ném SecurityError ở một số origin (file://, khung sandbox, cửa sổ ẩn danh).
// Không được để nó làm chết cả script — hỏng chỗ lưu tiến độ thì vẫn phải làm bài được.
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){ /* chạy không lưu */ } }
};
let saveWorks = true;
const def = () => ({i:0, order:DATA.map((_,i)=>i), res:{}, repeat:true});
let st = def();
try { st = Object.assign(def(), JSON.parse(store.get(KEY) || '{}')); }
catch(e){ st = def(); }
try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); }
catch(e){ saveWorks = false; }
let picked = new Set(), revealed = false, peek = false;

const save = () => store.set(KEY, JSON.stringify(st));
const cur = () => DATA[st.order[st.i]];
const same = (a,b) => a.length===b.length && a.every(x=>b.includes(x));
const esc = s => (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// Nạp trạng thái của câu hiện tại. CHỈ gọi khi đổi câu — không gọi trong render(),
// nếu không mỗi lần vẽ lại sẽ xoá mất lựa chọn người dùng vừa bấm.
function sync(){
  const prev = st.res[st.order[st.i]];
  revealed = !!prev;
  picked = new Set(revealed ? prev.picked : []);
  peek = false;
}

function render(){
  const q = cur(), keys = Object.keys(q.opts).sort(), multi = q.ans.length>1;
  const done = Object.keys(st.res).length, right = Object.values(st.res).filter(r=>r.ok).length;
  document.getElementById('sub').textContent =
    DATA.length + ' câu · đã làm ' + done + ' · đúng ' + right +
    (done ? ' (' + Math.round(right/done*100) + '%)' : '') +
    ' · bản ' + BUILD + (saveWorks ? '' : ' · ⚠️ không lưu được tiến độ ở chế độ xem này');
  document.getElementById('pbar').style.width = (done/DATA.length*100) + '%';
  document.getElementById('stat').textContent = 'Câu ' + (st.i+1) + '/' + st.order.length;

  let h = '<div class="meta"><span>Câu ' + (st.i+1) + ' / ' + st.order.length + '</span>' +
          '<span>slide ' + q.slide + ' · ' + (multi ? 'chọn ' + q.ans.length + ' đáp án' : 'chọn 1 đáp án') +
          '</span></div><div class="q">' + esc(q.q) + '</div>';
  keys.forEach(k => {
    let cls = 'opt' + (revealed ? ' done' : '');
    if(revealed){ if(q.ans.includes(k)) cls += ' ok'; else if(picked.has(k)) cls += ' no'; }
    else if(picked.has(k)) cls += ' sel';
    const mark = (revealed && q.ans.includes(k)) ? '✓'
               : (revealed && picked.has(k)) ? '✕'
               : (picked.has(k) ? (multi ? '✓' : '●') : '');
    h += '<div class="' + cls + '" data-k="' + k + '">' +
         '<span class="box ' + (multi ? 'sq' : 'ci') + '">' + mark + '</span>' +
         '<span class="k">' + k + '.</span><span>' + esc(q.opts[k]) + '</span></div>';
  });
  if(revealed){
    const ok = same([...picked].sort(), [...q.ans].sort());
    h += '<div class="fb ' + (ok ? 'ok' : 'no') + '">' +
         (ok ? '✅ Chính xác!' : '❌ Sai — đáp án đúng: ' + q.ans.join(', ')) + '</div>';
  }
  if((revealed || peek) && (q.hook || q.why || q.trap)){
    h += '<div class="tip"><h4>💡 Mẹo nhớ</h4>';
    if(q.hook) h += '<div class="hook">' + esc(q.hook) + '</div>';
    if(revealed && q.why)  h += '<p>' + esc(q.why) + '</p>';
    if(revealed && q.trap) h += '<p class="trap">⚠️ ' + esc(q.trap) + '</p>';
    if(!revealed) h += '<p style="color:var(--muted)">Trả lời xong sẽ hiện đầy đủ lý do và bẫy.</p>';
    h += '</div>';
  }
  document.getElementById('card').innerHTML = h;
  document.getElementById('check').disabled = revealed || picked.size === 0;
  document.getElementById('tipBtn').disabled = revealed || !(q.hook||q.why||q.trap);
  document.getElementById('prev').disabled = st.i === 0;
  document.getElementById('next').disabled = st.i >= st.order.length - 1;
  document.getElementById('repeat').classList.toggle('on', st.repeat);
  document.getElementById('repeat').textContent = 'Lặp câu sai: ' + (st.repeat ? 'BẬT' : 'TẮT');
}

function toggle(k){
  if(revealed) return;
  const q = cur();
  if(q.ans.length > 1){ picked.has(k) ? picked.delete(k) : picked.add(k); }
  else { picked.clear(); picked.add(k); }
  render();
}

// Một listener duy nhất, uỷ quyền từ thẻ cha — click một lần là một lần.
document.getElementById('card').addEventListener('click', e => {
  const el = e.target.closest('.opt');
  if(el && el.dataset.k) toggle(el.dataset.k);
});

function check(){
  if(revealed || !picked.size) return;
  const q = cur(), idx = st.order[st.i];
  const ok = same([...picked].sort(), [...q.ans].sort());
  st.res[idx] = {picked:[...picked], ok};
  if(!ok && st.repeat && !st.order.slice(st.i+1).includes(idx))
    st.order.splice(Math.min(st.i + 5, st.order.length), 0, idx);
  save(); sync(); render();
}
function go(d){
  const n = st.i + d;
  if(n < 0 || n >= st.order.length) return;
  st.i = n; save(); sync(); render();
}

document.getElementById('check').onclick = check;
document.getElementById('next').onclick = () => go(1);
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('tipBtn').onclick = () => { peek = true; render(); };
document.getElementById('repeat').onclick = () => { st.repeat = !st.repeat; save(); render(); };
document.getElementById('shuffle').onclick = () => {
  for(let i=st.order.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0;
    [st.order[i],st.order[j]]=[st.order[j],st.order[i]]; }
  st.i = 0; save(); sync(); render();
};
document.getElementById('wrongOnly').onclick = () => {
  const w = Object.keys(st.res).filter(k => !st.res[k].ok).map(Number);
  if(!w.length){ alert('Chưa có câu nào sai. Cứ làm tiếp đã!'); return; }
  w.forEach(k => delete st.res[k]);
  st.order = w; st.i = 0; save(); sync(); render();
};
document.getElementById('reset').onclick = () => {
  if(!confirm('Xoá toàn bộ tiến độ và làm lại từ đầu?')) return;
  st = def(); save(); sync(); render();
};
document.addEventListener('keydown', e => {
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toUpperCase();
  if(/^[A-H]$/.test(k) && cur().opts[k]){ e.preventDefault(); toggle(k); return; }
  if(e.key === 'Enter'){ e.preventDefault(); revealed ? go(1) : check(); }
  if(e.key === 'ArrowRight') go(1);
  if(e.key === 'ArrowLeft') go(-1);
  if(k === 'H' && !revealed){ peek = true; render(); }
});
if(st.i >= st.order.length) st.i = 0;
sync();
render();
</script></body></html>
