<script>
const DATA = [{"slide": 215, "q": "In the context of digital transformation, organizations increasingly rely on AI to enhance operations. Which of the following best describes AI's contribution to this transformation?", "opts": {"A": "Replacing all human roles in an organization", "B": "Reducing the importance of change management", "C": "Automating processes to improve efficiency", "D": "Eliminating the need for data in decision-making"}, "ans": ["C"], "hook": "AI contribution → Automating processes", "why": "AI đóng vai trò cốt lõi trong chuyển đổi số bằng cách tự động hóa các quy trình lặp đi lặp lại để tối ưu hóa hiệu suất vận hành của tổ chức.", "trap": "A sai vì AI chỉ hỗ trợ hoặc thay thế một phần chứ không thể thay thế hoàn toàn mọi vai trò của con người."}, {"slide": 216, "q": "In software engineering, we build models of a software system to:", "opts": {"A": "reduce the workload of the project team.", "B": "help us deal with the complexity of a problem.", "C": "reduce the amount of communication with users.", "D": "know which people to hire into the project team.", "E": "know which language to use for implementation."}, "ans": ["B"], "hook": "Software modeling → deal with complexity", "why": "Mô hình hóa giúp đơn giản hóa hệ thống phức tạp để con người dễ hiểu và quản lý hơn.", "trap": "A sai vì mô hình hóa không trực tiếp giảm khối lượng công việc cho đội dự án."}, {"slide": 217, "q": "In the Model-View-Controller (MVC) architectural pattern, the Model represents", "opts": {"A": "the objects used to render data in the user interface.", "B": "the process control mechanism used by the system.", "C": "the controls with which the user interacts.", "D": "the data viewed and manipulated by the user.", "E": "the business logic of the application."}, "ans": ["D"], "hook": "Model → data", "why": "Model đóng vai trò là nơi lưu trữ dữ liệu và các quy tắc nghiệp vụ liên quan đến dữ liệu đó.", "trap": "E sai vì business logic thường là phần xử lý nằm giữa Model và Controller trong các kiến trúc phức tạp hơn."}, {"slide": 218, "q": "Integration testing focuses on", "opts": {"A": "the flow of control in a component.", "B": "the logical conditions in a component.", "C": "validating user requirements.", "D": "the interaction among the components.", "E": "integrating a database with the software system."}, "ans": ["D"], "hook": "Integration → interaction among components", "why": "Kiểm thử tích hợp tập trung vào việc kiểm tra cách các thành phần riêng lẻ phối hợp và tương tác với nhau khi được ghép nối.", "trap": "C sai vì validating user requirements là mục tiêu của Acceptance testing chứ không phải Integration testing."}, {"slide": 219, "q": "One purpose of system analysis and design is to", "opts": {"A": "determine the cost of developing the system.", "B": "determine the time required to implement the system.", "C": "capture the system's nonfunctional requirements.", "D": "adapt the requirements to the implementation environment.", "E": "obtain the client's approval for developing the system."}, "ans": ["D"], "hook": "System analysis → adapt requirements", "why": "Mục tiêu của phân tích thiết kế là điều chỉnh các yêu cầu nghiệp vụ sao cho phù hợp với môi trường kỹ thuật và công nghệ thực tế.", "trap": "A sai vì xác định chi phí thuộc về quản lý dự án, không phải mục đích cốt lõi của việc thiết kế hệ thống."}, {"slide": 220, "q": "The primary purpose of refactoring code is to", "opts": {"A": "reduce the number of input parameters.", "B": "isolate bugs by rewriting the code.", "C": "add assertions to the code.", "D": "improve the internal structure of the code.", "E": "improve the interaction among components."}, "ans": ["D"], "hook": "Refactoring → Improve internal structure", "why": "Refactoring tập trung vào việc cải thiện cấu trúc mã nguồn mà không làm thay đổi hành vi bên ngoài của hệ thống.", "trap": "B sai vì việc sửa code để tìm lỗi là debugging chứ không phải refactoring."}, {"slide": 221, "q": "The purpose of software testing is to show that", "opts": {"A": "the software has no defects (bugs).", "B": "the program code is well structured.", "C": "the software has a good architecture.", "D": "the software is of good quality.", "E": "the software has defects (bugs)."}, "ans": ["E"], "hook": "purpose of testing → has defects", "why": "Kiểm thử phần mềm được thiết kế để tìm ra lỗi thay vì chứng minh sự vắng mặt của lỗi.", "trap": "A sai vì không có quá trình kiểm thử nào có thể khẳng định phần mềm hoàn toàn sạch lỗi."}, {"slide": 222, "q": "The purpose of data flow testing is to ensure the correctness of values", "opts": {"A": "stored by a program into a database.", "B": "that move into and out of a database.", "C": "that pass through a user interface.", "D": "of program variables.", "E": "output by a program."}, "ans": ["D"], "hook": "Data flow testing → Program variables", "why": "Data flow testing tập trung kiểm soát vòng đời và giá trị của các biến từ lúc khởi tạo đến khi sử dụng trong mã nguồn.", "trap": "A sai vì kiểm thử luồng dữ liệu không giới hạn phạm vi vào cơ sở dữ liệu mà tập trung vào logic tính toán bên trong chương trình."}, {"slide": 223, "q": "The cyclomatic complexity of a program can tell us something about which of the following external attributes (design goals) of software quality?", "opts": {"A": "usability - how easy it is to use", "B": "learnability - how easy it is to learn how to use", "C": "safety - how likely it is to be error free", "D": "integrity - how well it prevents unauthorized access", "E": "installability - how easy it is to install"}, "ans": ["C"], "hook": "cyclomatic complexity → safety, error free", "why": "Độ phức tạp chương trình càng cao thì khả năng phát sinh lỗi càng lớn, ảnh hưởng trực tiếp đến tính an toàn của phần mềm.", "trap": "A sai vì usability phụ thuộc vào giao diện người dùng chứ không phải độ phức tạp logic bên trong code."}, {"slide": 224, "q": "The Mediator design pattern is used to", "opts": {"A": "provide a unified interface to a subsystem.", "B": "provide a placeholder for another object.", "C": "decouple an abstraction from its implementation.", "D": "restrict a class to have only one instance.", "E": "encapsulate how a set of objects interact."}, "ans": ["E"], "hook": "Mediator → encapsulate interaction", "why": "Mediator đóng vai trò trung gian giúp các đối tượng không cần gọi trực tiếp nhau mà thông qua một bộ điều phối tập trung.", "trap": "A sai vì mô tả chức năng của Facade pattern nhằm cung cấp giao diện thống nhất cho hệ thống con."}, {"slide": 225, "q": "The Strategy design pattern is used to", "opts": {"A": "defer instantiation of a class to its subclasses.", "B": "provide a placeholder for another object.", "C": "decouple an abstraction from its implementation.", "D": "restrict a class to have only one instance.", "E": "encapsulate an interchangeable family of algorithms"}, "ans": ["E"], "hook": "Strategy → family of algorithms", "why": "Strategy cho phép đóng gói một nhóm các thuật toán có thể thay thế lẫn nhau để thay đổi hành vi tại thời điểm thực thi.", "trap": "C sai vì decouple abstraction và implementation là định nghĩa của Bridge pattern."}, {"slide": 226, "q": "The Observer design pattern is used to", "opts": {"A": "defer instantiation of a class to its subclasses.", "B": "provide a placeholder for another object.", "C": "notify other objects about updates.", "D": "encapsulate how a set of objects interact.", "E": "decouple an abstraction from its implementation."}, "ans": ["C"], "hook": "Observer → notify updates", "why": "Design pattern Observer được thiết kế để định nghĩa mối quan hệ một-nhiều giữa các đối tượng sao cho khi một đối tượng thay đổi trạng thái thì tất cả các đối tượng phụ thuộc của nó đều được thông báo và tự động cập nhật.", "trap": "D sai vì encapsulate how a set of objects interact là định nghĩa của Mediator pattern chứ không phải Observer."}, {"slide": 227, "q": "Testing every statement in a program guarantees that all defects (bugs) will be found.", "opts": {"A": "Yes, definitely!", "B": "Yes, but only for simple programs.", "C": "Yes, but only for programs using object-oriented languages.", "D": "No, no way!!", "E": "Gee, I don't know??"}, "ans": ["D"], "hook": "statement coverage → No, no way!! (D)", "why": "Việc thực thi mọi câu lệnh không thể phát hiện các lỗi logic tiềm ẩn hoặc các trường hợp dữ liệu chưa được kiểm thử.", "trap": "A sai vì testing không bao giờ tìm được 100% mọi lỗi (exhaustively testing)."}, {"slide": 229, "q": "What is the primary role of data in digital transformation?", "opts": {"A": "To analyze only historical trends without real-time processing.", "B": "To store large volumes of information in physical hard drives.", "C": "To replace traditional IT systems with cloud solutions.", "D": "To provide insights that drive informed decision-making and improve efficiency."}, "ans": ["D"], "hook": "Digital transformation → insights drive decisions", "why": "Dữ liệu là tài sản chiến lược giúp doanh nghiệp hiểu rõ tình hình thực tế để đưa ra các quyết định chính xác và tối ưu quy trình.", "trap": "A sai vì chuyển đổi số đòi hỏi khả năng xử lý dữ liệu thời gian thực thay vì chỉ nhìn vào quá khứ."}, {"slide": 230, "q": "What is one of the key benefits of using AI tools like Amazon Q Developer in software development?", "opts": {"A": "AI completely eliminates the need for human input in coding.", "B": "AI ensures code will never have bugs or need refactoring.", "C": "AI tools can independently decide and implement architectural designs.", "D": "AI tools provide instant code explanations and suggest optimizations."}, "ans": ["D"], "hook": "AI tools → code explanations and optimizations", "why": "Công cụ AI hỗ trợ lập trình viên bằng cách phân tích mã nguồn và đưa ra các gợi ý cải tiến hiệu quả.", "trap": "A sai vì AI chỉ là công cụ hỗ trợ chứ không thay thế hoàn toàn tư duy của con người."}, {"slide": 231, "q": "What is the best way to refactor the following verbose switch statement to improve code readability and maintainability?\n\nswitch(day) {\n    case \"Monday\":\n        System.out.println(\"Start of the week\");\n        break;\n    case \"Friday\":\n        System.out.println(\"End of the workweek\");\n        break;\n    default:\n        System.out.println(\"Midweek\");\n}", "opts": {"A": "Replace the switch statement with an enum and method call.", "B": "Convert it into nested if-else statements.", "C": "Leave it as is since switch statements are always optimal.", "D": "Add more case statements for all days of the week."}, "ans": ["A"], "hook": "verbose switch → replace with enum", "why": "Sử dụng Enum kết hợp đa hình giúp loại bỏ switch, giúp mã nguồn sạch hơn và dễ mở rộng khi thêm ngày mới.", "trap": "B sai vì nested if-else khiến code trở nên rối rắm và khó bảo trì hơn so với switch ban đầu."}, {"slide": 232, "q": "What is the most apparent issue in the following Java code snippet that could be optimized to improve efficiency?\n\npublic void processOrder() {\n    synchronized(this) {\n        System.out.println(\"Processing Order\");\n    }\n    synchronized(this) {\n        System.out.println(\"Finalizing Order\");\n    }\n}", "opts": {"A": "Incorrect use of the 'this' keyword", "B": "Missing exception handling", "C": "Redundant synchronization blocks", "D": "Uninitialized variables"}, "ans": ["C"], "hook": "synchronized blocks → redundant synchronization", "why": "Việc dùng nhiều khối đồng bộ hóa liên tiếp trên cùng một đối tượng gây lãng phí tài nguyên và làm giảm hiệu năng thực thi.", "trap": "A sai vì từ khóa this được dùng đúng mục đích tham chiếu đến đối tượng hiện tại."}, {"slide": 233, "q": "What is the primary purpose of using AI for Java documentation?", "opts": {"A": "To automatically generate and maintain up-to-date technical documentation from code.", "B": "To assist developers in generating comprehensive documentation without manual effort.", "C": "To ensure code quality by reviewing and identifying potential errors.", "D": "To replace developers in writing project documentation entirely."}, "ans": ["A"], "hook": "AI documentation → auto-generate and maintain docs", "why": "Mục đích cốt lõi của AI trong tài liệu là duy trì sự đồng bộ giữa mã nguồn và tài liệu kỹ thuật một cách tự động.", "trap": "B sai vì việc hỗ trợ con người chỉ là phương tiện, không phải mục tiêu chính về tính đồng bộ kỹ thuật."}, {"slide": 234, "q": "What is the primary impact of using Generative AI in automating code reviews?", "opts": {"A": "To identify potential errors and suggest improving code quality.", "B": "To fully replace developers in the code review process.", "C": "To generate automated unit tests for code.", "D": "To eliminate the need for manual testing in development workflows."}, "ans": ["A"], "hook": "GenAI code review → identify errors, improve quality", "why": "Công cụ AI đóng vai trò hỗ trợ con người trong việc phát hiện lỗi và tối ưu chất lượng mã nguồn thay vì thay thế hoàn toàn.", "trap": "B sai vì AI chỉ hỗ trợ chứ không thể thay thế hoàn toàn tư duy và trách nhiệm của lập trình viên."}, {"slide": 235, "q": "What is a key ethical concern when using Generative AI tools like Amazon Q Developer for software development?", "opts": {"A": "AI-generated code is always free from logical errors.", "B": "AI tools are incapable of improving productivity.", "C": "AI eliminates the need for developer oversight.", "D": "AI tools may generate code resembling copyrighted or proprietary material."}, "ans": ["D"], "hook": "Generative AI → copyrighted material", "why": "AI tạo mã nguồn dựa trên dữ liệu huấn luyện có sẵn nên có nguy cơ vi phạm bản quyền hoặc sao chép tài sản trí tuệ của bên khác.", "trap": "C sai vì AI chỉ hỗ trợ chứ không bao giờ thay thế được sự giám sát của lập trình viên để đảm bảo an toàn và logic."}, {"slide": 236, "q": "What is a significant risk associated with deepfake video technology?", "opts": {"A": "It can create realistic but false videos, potentially leading to fraud or misinformation.", "B": "It can crash a financial system.", "C": "The creation of a deepfake places significant strain on computer hardware, which may pose a risk of system damage.", "D": "It can corrupt the data integrity in artificial intelligence models."}, "ans": ["A"], "hook": "deepfake → fraud, misinformation", "why": "Công nghệ này tạo ra video giả mạo giống thật để đánh lừa người xem và lan truyền tin tức giả.", "trap": "B sai vì deepfake tác động đến nhận thức con người chứ không trực tiếp làm sập hệ thống tài chính."}, {"slide": 237, "q": "What is the primary difference between Generative AI and Discriminative AI?", "opts": {"A": "Both Generative and Discriminative AI focus only on data classification.", "B": "Generative AI predicts outcomes, while Discriminative AI generates new content.", "C": "Discriminative AI is faster than Generative AI in creating content.", "D": "Generative AI creates new data, while Discriminative AI predicts or classifies existing data."}, "ans": ["D"], "hook": "Generative vs Discriminative → creates new vs classifies existing", "why": "Generative tập trung tạo ra dữ liệu mới từ phân phối xác suất còn Discriminative tập trung phân biệt ranh giới giữa các lớp dữ liệu.", "trap": "B sai vì đảo ngược chức năng giữa hai mô hình tạo nội dung và dự đoán kết quả."}, {"slide": 238, "q": "What is one key feature of GitHub Copilot that enhances Java development in IntelliJ?", "opts": {"A": "Automatically generating production-ready Java applications without any input.", "B": "Writing comprehensive test cases without developer intervention.", "C": "Automatically deploying Java applications to production.", "D": "Managing deployment pipelines directly from IntelliJ."}, "ans": ["A"], "hook": "GitHub Copilot → auto-generating Java code", "why": "Copilot hỗ trợ lập trình viên bằng cách gợi ý và tạo mã nguồn dựa trên ngữ cảnh công việc.", "trap": "B sai vì Copilot không thể tự viết toàn bộ test case mà không cần sự điều chỉnh từ người dùng."}, {"slide": 239, "q": "What is a \"contextual prompt\" in Generative AI tools?", "opts": {"A": "A debugging technique for code reviews.", "B": "A prompt that uses minimal input to guess the context.", "C": "A prompt that includes background information to help the AI provide accurate answers.", "D": "A repetitive command used to train the AI further."}, "ans": ["C"], "hook": "contextual prompt → includes background information", "why": "Contextual prompt là kỹ thuật cung cấp ngữ cảnh chi tiết giúp AI hiểu rõ yêu cầu và phản hồi chính xác hơn.", "trap": "B sai vì đó là cách tiếp cận tối giản (minimal), ngược lại hoàn toàn với việc cung cấp đầy đủ ngữ cảnh."}, {"slide": 240, "q": "What is the primary goal of digital transformation in businesses?", "opts": {"A": "To integrate digital technologies to improve efficiency and deliver value.", "B": "To use digital tools for marketing purposes.", "C": "To focus on the creation of a digital virtual reality space for businesses.", "D": "To focus solely on creating new software applications."}, "ans": ["A"], "hook": "Digital transformation → efficiency and value", "why": "Chuyển đổi số là quá trình áp dụng công nghệ vào mọi khía cạnh doanh nghiệp nhằm tối ưu vận hành và gia tăng giá trị cho khách hàng.", "trap": "D sai vì chuyển đổi số là sự thay đổi toàn diện mô hình kinh doanh chứ không chỉ là việc viết thêm phần mềm."}, {"slide": 241, "q": "What is the primary purpose of a neural network in machine learning?", "opts": {"A": "To process inputs and learn patterns for making predictions or decisions.", "B": "To make decisions based on rules put in the programming, resulting in a leaf node.", "C": "To teach new information to humans using videos and the internet.", "D": "To combine the results of multiple trees into an averaged result."}, "ans": ["A"], "hook": "Neural network → learn patterns for predictions", "why": "Neural network mô phỏng mạng thần kinh để học các mẫu phức tạp từ dữ liệu nhằm đưa ra dự đoán.", "trap": "B sai vì đó là đặc điểm của Decision Tree, không phải Neural network."}, {"slide": 242, "q": "What is the key advantage of using random forests over a single decision tree?", "opts": {"A": "Random forests reduce overfitting by combining multiple decision trees.", "B": "Random forests are simpler to interpret than decision trees.", "C": "Random forests require no data to make predictions.", "D": "Random forests always generate a single, static model."}, "ans": ["A"], "hook": "random forests → reduce overfitting, combining multiple trees", "why": "Kỹ thuật ensemble của nhiều cây giúp trung hòa sai số và tăng tính tổng quát cho mô hình.", "trap": "B sai vì Random forest phức tạp và khó giải thích hơn nhiều so với một cây đơn lẻ."}, {"slide": 243, "q": "What is the primary function of a decision tree in Machine Learning?", "opts": {"A": "To replicate the neural structure of a human brain.", "B": "To store data for future analysis.", "C": "To split data into branches based on feature values to make decisions.", "D": "To predict random outcomes without patterns."}, "ans": ["C"], "hook": "Decision tree → split data into branches", "why": "Cấu trúc cây quyết định hoạt động bằng cách phân tách tập dữ liệu thành các nhánh nhỏ dựa trên các giá trị đặc trưng để đưa ra kết luận.", "trap": "A sai vì mô tả cơ chế của Neural Networks chứ không phải Decision tree."}, {"slide": 244, "q": "What is the primary relationship between AI and Machine Learning (ML)?", "opts": {"A": "ML is another term for AI, and they mean the same thing.", "B": "AI is a subset of ML.", "C": "ML is a subset of AI that enables computers to learn from data.", "D": "AI and ML are independent technologies with no relationship."}, "ans": ["C"], "hook": "AI → ML subset → Learn from data", "why": "Machine Learning là một lĩnh vực con của trí tuệ nhân tạo tập trung vào việc huấn luyện hệ thống tự học từ dữ liệu thay vì lập trình cứng.", "trap": "B sai vì bị ngược phân cấp khi khẳng định AI nằm trong ML."}, {"slide": 245, "q": "What are the key benefits of using GitHub Copilot for Java development? (Select all that apply)", "opts": {"A": "Replaces the need for learning Java syntax and best practices.", "B": "Helps generate code based on comments or descriptions.", "C": "Assists with debugging by recommending fixes for errors.", "D": "Accelerates coding by suggesting entire functions and methods."}, "ans": ["B", "C", "D"], "hook": "GitHub Copilot → generate code, debugging fixes, suggest functions", "why": "Công cụ này hỗ trợ lập trình viên thông qua việc tự động tạo code, đề xuất sửa lỗi và hoàn thiện các hàm phức tạp.", "trap": "A sai vì AI chỉ hỗ trợ chứ không thay thế hoàn toàn việc học cú pháp và kiến thức nền tảng của lập trình viên."}, {"slide": 246, "q": "What are the benefits of using Generative AI tools like Amazon Q Developer in Java development?\n(Select all that apply)", "opts": {"A": "Complete elimination of manual coding.", "B": "Early error detection and suggestions for fixes.", "C": "Increased coding efficiency through the automation of repetitive tasks.", "D": "Learning support for beginner developers."}, "ans": ["B", "C", "D"], "hook": "AI tool benefits → early, efficiency, learning", "why": "Công cụ Generative AI hỗ trợ lập trình viên tối ưu hóa quy trình làm việc thông qua việc tự động hóa, sửa lỗi và cung cấp tài liệu học tập thay vì thay thế hoàn toàn con người.", "trap": "A sai vì AI hiện tại chỉ hỗ trợ (assist) chứ chưa thể thay thế hoàn toàn việc viết mã thủ công (complete elimination)."}, {"slide": 247, "q": "Which of the following is not likely to contribute to the complexity of software development?", "opts": {"A": "The vocabulary of the application domain", "B": "The number and size of the programs that need to be implemented", "C": "The nature of the application domain", "D": "A large development team", "E": "Insufficient hardware resources"}, "ans": ["E"], "hook": "software complexity NOT → insufficient hardware (E)", "why": "Độ phức tạp phần mềm được định nghĩa bởi các yếu tố nội tại của hệ thống như yêu cầu, dữ liệu và quy trình, trong khi tài nguyên phần cứng chỉ là môi trường vận hành bên ngoài.", "trap": "D sai vì quy mô đội ngũ lớn thường làm tăng độ phức tạp trong quản lý và giao tiếp dự án."}, {"slide": 248, "q": "Which of the following best explains the difference between Artificial Intelligence (AI) and Machine Learning (ML)?", "opts": {"A": "AI is a subset of ML, where AI focuses on making predictions while ML focuses on decision-making.", "B": "AI and ML are unrelated technologies that solve different problems.", "C": "ML is a subset of AI, where ML helps computers learn from data to make decisions or predictions.", "D": "AI refers to the technology used only to create robots that look like humans."}, "ans": ["C"], "hook": "AI vs ML → ML is a subset of AI", "why": "Machine Learning là một nhánh kỹ thuật nằm trong phạm vi rộng lớn hơn của trí tuệ nhân tạo nhằm tối ưu hóa học máy từ dữ liệu.", "trap": "A sai vì AI là tập mẹ chứa ML chứ không phải ngược lại."}, {"slide": 249, "q": "Which of the following is a benefit of the Waterfall software development process?", "opts": {"A": "It is easier to deal with vague user requirements.", "B": "It develops the system incrementally.", "C": "It is easier to find people with the required development skills.", "D": "It makes the software development process more disciplined.", "E": "It makes it easier to get user feedback early in the project development."}, "ans": ["D"], "hook": "Waterfall → disciplined", "why": "Mô hình Waterfall yêu cầu quy trình nghiêm ngặt theo từng giai đoạn cố định và có hệ thống tài liệu rõ ràng nên tính kỷ luật rất cao.", "trap": "B sai vì Waterfall phát triển theo dạng tuần tự chứ không phải tăng trưởng theo từng phần như Incremental."}, {"slide": 250, "q": "Which of the following is a key ethical concern associated with generative AI?", "opts": {"A": "The risk of diminishing human creativity, such as singing, due to AI's ability to compose songs.", "B": "The potential for bias in AI-generated content.", "C": "The concern about developers profiting significantly from users of GenAI.", "D": "Its inability to automate tasks without human input."}, "ans": ["B"], "hook": "Generative AI → bias in content", "why": "Dữ liệu huấn luyện bị định kiến khiến mô hình tạo ra các kết quả sai lệch hoặc phân biệt đối xử.", "trap": "A sai vì sự sáng tạo của con người là lo ngại về văn hóa thay vì là một vấn đề đạo đức kỹ thuật cốt lõi."}, {"slide": 251, "q": "Which of the following best describes the role of AI in automating Java code refactoring?", "opts": {"A": "Improves code readability and performance by suggesting cleaner implementations.", "B": "Rewrite the entire application in a different programming language.", "C": "Automatically generates test cases for the codebase.", "D": "Identifies bugs and fixes them in the code."}, "ans": ["A"], "hook": "Refactoring AI → Clean code readability", "why": "Mục tiêu chính của refactoring là cải thiện cấu trúc và khả năng đọc hiểu của mã nguồn mà không làm thay đổi hành vi bên ngoài.", "trap": "C sai vì tạo test cases là nhiệm vụ của automated testing chứ không phải quá trình refactoring."}, {"slide": 252, "q": "Which of the following scenarios best describes how a neural network adjusts its weights during training?", "opts": {"A": "The network adjusts weights randomly to improve accuracy.", "B": "Weights are fixed during training to avoid instability.", "C": "Weights are updated based on feedback from the error rate or prediction error.", "D": "The output layer directly updates all weights in the network."}, "ans": ["C"], "hook": "Training weights → Error feedback update", "why": "Quá trình huấn luyện sử dụng thuật toán lan truyền ngược để điều chỉnh trọng số nhằm giảm thiểu sai số dự đoán.", "trap": "A sai vì trọng số được cập nhật dựa trên toán học tối ưu hóa chứ không phải thay đổi ngẫu nhiên."}, {"slide": 253, "q": "Which of the following is a benefit of having a software development process?", "opts": {"A": "It is not necessary to train the developers.", "B": "We have to gather fewer requirements from users.", "C": "It is easier to divide up the work among development team members.", "D": "It is not necessary to maintain the system.", "E": "There is less need for the development team to communicate with the users."}, "ans": ["C"], "hook": "software process → easier to divide work among team", "why": "Quy trình chuẩn giúp phân chia nhiệm vụ rõ ràng và quản lý công việc hiệu quả hơn giữa các thành viên.", "trap": "A sai vì quy trình không thay thế được việc đào tạo nhân sự."}, {"slide": 254, "q": "Which of the following is a key way AI tools can assist in designing software architecture?", "opts": {"A": "Automatically generating boilerplate code and suggesting design patterns.", "B": "Writing and maintaining all the business logic of the application.", "C": "Completely replacing developers in the software design process.", "D": "Ensuring that the software will never require refactoring."}, "ans": ["A"], "hook": "AI software design → boilerplate code, suggest design patterns", "why": "AI đóng vai trò hỗ trợ đắc lực bằng cách tự động hóa các tác vụ lặp lại và đề xuất cấu trúc tối ưu cho kiến trúc phần mềm.", "trap": "C sai vì AI chỉ là công cụ hỗ trợ, không thể thay thế hoàn toàn vai trò tư duy và quyết định của kiến trúc sư phần mềm."}, {"slide": 255, "q": "Which of the following statements is not true about an association relationship?", "opts": {"A": "It is inherently bi-directional.", "B": "It can be restricted to be only unidirectional.", "C": "It represents an instance of the relationship.", "D": "It can normally only be read meaningfully in one direction.", "E": "It is a description of a group of instances of the relationship."}, "ans": ["C"], "hook": "association NOT true → an instance of relationship (C)", "why": "Association là một mô tả tổng quát về mối quan hệ giữa các lớp, không phải là một instance cụ thể.", "trap": "A sai vì association mặc định là hai chiều nhưng có thể giới hạn thành một chiều."}, {"slide": 256, "q": "Which of the following statement about early test design is false?", "opts": {"A": "Faults found during early test design are less expensive to fix.", "B": "Early test design can prevent fault multiplication.", "C": "Early test design can find faults.", "D": "Early test design takes more effort.", "E": "Early test design can cause changes to the requirements."}, "ans": ["D"], "hook": "early test design FALSE → takes more effort (D)", "why": "Thiết kế test sớm giúp phát hiện lỗi sớm nên thực tế tiết kiệm thời gian và công sức tổng thể thay vì làm tăng chúng.", "trap": "A sai vì sửa lỗi sớm luôn rẻ hơn so với sửa ở giai đoạn sau."}, {"slide": 257, "q": "Why is interpretability important in AI systems?", "opts": {"A": "It allows users to understand how decisions are made, especially in critical applications.", "B": "It guarantees that AI systems will always produce 100% accurate results.", "C": "It eliminates the need for data-driven decision-making.", "D": "It ensures that AI systems function without requiring human oversight."}, "ans": ["A"], "hook": "Interpretability → understand decisions", "why": "Tính giải thích giúp con người hiểu được logic và lý do đằng sau các quyết định của hệ thống AI.", "trap": "B sai vì không có công nghệ nào đảm bảo độ chính xác tuyệt đối 100%."}, {"slide": 258, "q": "How does Generative AI enhance the process of detecting bugs in Java code?", "opts": {"A": "By rewriting the buggy code with optimized solutions.", "B": "By completely automating the debugging process.", "C": "By identifying errors through the analysis of code patterns and anomalies.", "D": "By providing a guarantee of error-free Java applications."}, "ans": ["C"], "hook": "GenAI bug detection → code patterns and anomalies", "why": "AI hoạt động bằng cách phân tích cấu trúc mã nguồn để tìm ra các điểm bất thường so với mẫu chuẩn.", "trap": "B sai vì AI chỉ hỗ trợ chứ không thể thay thế hoàn toàn con người trong mọi quy trình debug."}, {"slide": 259, "q": "A developer is using Amazon Q Developer to work on a Java project. The tool suggests code for connecting to a database and identifies a syntax error in a query. Which of the following describes how Amazon Q Developer enhances productivity in this scenario?", "opts": {"A": "It replaces the developer's need to understand the programming language.", "B": "It suggests corrections for syntax errors and provides relevant code snippets.", "C": "It removes the entire code and writes a new program.", "D": "It replaces the developer's need to understand database connections."}, "ans": ["B"], "hook": "Amazon Q Developer → syntax error corrections, code snippets", "why": "Công cụ này hỗ trợ lập trình viên bằng cách cung cấp các đoạn mã phù hợp và phát hiện lỗi sai trực tiếp trong quá trình viết code.", "trap": "A sai vì AI chỉ hỗ trợ chứ không thay thế hoàn toàn kiến thức lập trình của con người."}, {"slide": 260, "q": "A company uses AI for targeted advertising campaigns based on user data. What steps should it prioritize to comply with GDPR and ensure ethical practices?", "opts": {"A": "Using AI to bypass user consent requirements.", "B": "Ensuring that users provide informed consent for data collection and usage.", "C": "Ensuring AI algorithms remain confidential and avoid transparency with regulators.", "D": "Avoiding all forms of data storage to comply with GDPR."}, "ans": ["B"], "hook": "GDPR, AI → Informed consent", "why": "GDPR yêu cầu sự minh bạch và quyền kiểm soát của người dùng thông qua việc đồng ý tham gia thu thập dữ liệu.", "trap": "A sai vì GDPR nghiêm cấm hành vi bỏ qua sự đồng ý của người dùng."}, {"slide": 261, "q": "A healthcare provider adopts an AI tool to predict risks for critical conditions. Doctors express concern about how the AI reaches conclusions, specifically when recommending treatments. Why is it critical for the AI model to provide interpretable results?", "opts": {"A": "To allow stakeholders to understand and trust the AI's decision-making process.", "B": "To ensure users can easily modify the AI model's decisions directly.", "C": "To completely eliminate the need for human oversight in treatment planning.", "D": "To make AI models faster by simplifying algorithms."}, "ans": ["A"], "hook": "AI interpretable → trust stakeholders", "why": "Tính minh bạch giúp bác sĩ hiểu rõ cơ sở logic để tin tưởng và chịu trách nhiệm cho các quyết định y tế.", "trap": "B sai vì mục tiêu là giải thích kết quả chứ không phải cho phép người dùng can thiệp trực tiếp vào thuật toán."}, {"slide": 262, "q": "A financial institution uses an AI model to predict the risk of loan defaults based on customer data, including credit scores, income, and spending patterns. A customer is denied a loan and asks why the AI made this decision. How should the institution provide clarity on the AI's decision?", "opts": {"A": "Avoid using interpretability techniques and simply provide the customer with the raw decision.", "B": "Simplify the AI model by removing features that are hard to interpret.", "C": "Use SHapley Additive exPlanations (SHAP) to calculate and explain each feature's contribution to the decision.", "D": "Use Local Interpretable Model-agnostic Explanations (LIME) to highlight the features that contributed most to the decision."}, "ans": ["C"], "hook": "AI explain decisions → SHAP feature contribution", "why": "SHAP dựa trên lý thuyết trò chơi để phân bổ đóng góp của từng đặc trưng một cách chính xác và công bằng cho kết quả dự đoán.", "trap": "D sai vì LIME chỉ xấp xỉ cục bộ quanh một điểm dữ liệu, không cung cấp độ tin cậy và chính xác về đóng góp tổng thể như SHAP."}, {"slide": 263, "q": "An online bookstore is struggling to compete due to poor customer experiences, delivery delays, and a lack of personalized recommendations. Which strategy best incorporates the four domains of digital transformation to address these issues?", "opts": {"A": "Use customer behavior data to personalize recommendations, implement automated inventory systems, and train employees on digital tools.", "B": "Focus solely on redesigning the website and adding a wish list feature.", "C": "Offer flat discounts to increase sales and collaborate with coffee shops for hybrid events.", "D": "Outsource delivery services and add more staff for manual inventory tracking."}, "ans": ["A"], "hook": "digital transformation → data personalization, automation, training", "why": "Đáp án A bao phủ toàn diện bốn trụ cột chuyển đổi số gồm trải nghiệm khách hàng, quy trình vận hành, công nghệ và năng lực nhân sự.", "trap": "B sai vì chỉ tập trung vào giao diện website mà thiếu đi sự thay đổi về quy trình vận hành và dữ liệu nội bộ."}, {"slide": 264, "q": "An exclusive or (XOR) constraint states that", "opts": {"A": "an attribute cannot have null values.", "B": "an attribute must either be null or can only have one of two values.", "C": "instances of the same class cannot be related to each other.", "D": "instances of only one of two classes can be related to instances of another class.", "E": "two classes cannot be related by an association class."}, "ans": ["D"], "hook": "XOR constraint → only one of two classes", "why": "Ràng buộc XOR đảm bảo rằng tại một thời điểm, một thực thể chỉ có thể tham gia vào đúng một trong các mối quan hệ được chỉ định.", "trap": "B sai vì mô tả về giá trị thuộc tính chứ không phải mối quan hệ giữa các lớp."}, {"slide": 265, "q": "In the UML, the concept of generalization", "opts": {"A": "relates two different classes by an association relationship.", "B": "allows a class to remove attributes and operations from its subclasses.", "C": "supports the concept of stereotype.", "D": "allows a class to specialize its attributes and operations.", "E": "links instances of different classes together."}, "ans": ["D"], "hook": "Generalization → specialize attributes operations", "why": "Generalization thiết lập quan hệ kế thừa, cho phép lớp con kế thừa và chuyên biệt hóa các thuộc tính cùng phương thức từ lớp cha.", "trap": "A sai vì association là quan hệ liên kết ngang, không phải quan hệ cha-con (generalization)."}, {"slide": 266, "q": "In system analysis and design, an entity class represents", "opts": {"A": "information about a user of the system.", "B": "information that is persistent.", "C": "system dependencies on actors.", "D": "information that is transient.", "E": "coordination, sequencing, transactions and control of other objects."}, "ans": ["B"], "hook": "entity class → persistent information", "why": "Entity class dùng để lưu trữ dữ liệu lâu dài trong hệ thống thay vì dữ liệu tạm thời.", "trap": "D sai vì transient chỉ thông tin tạm thời, còn entity class phải là dữ liệu cần lưu trữ lâu dài."}, {"slide": 267, "q": "The incomplete coverage constraint for a generalization relationship means that:", "opts": {"A": "A. a superclass instance can be a member of one or more of the subclasses. [overlapping]", "B": "B. some subclass instance is not a member of any superclass. [not possible]", "C": "C. a superclass instance can be a member of at most one of the subclasses. [disjoint]", "D": "D. each superclass instance is a member of some subclass. [complete]", "E": "E. some superclass instance is not a member of any subclass."}, "ans": ["E"], "hook": "incomplete coverage → superclass not member of any subclass", "why": "Incomplete nghĩa là không đầy đủ, tức là tồn tại đối tượng của superclass không thuộc bất kỳ subclass nào.", "trap": "D sai vì đó là định nghĩa của constraint Complete, yêu cầu mọi superclass instance phải thuộc ít nhất một subclass."}, {"slide": 268, "q": "The best way to conduct a requirements validation review is to", "opts": {"A": "examine the system model for errors", "B": "have the customer look over the requirements", "C": "send them to the system design team and see if they have any concerns", "D": "use a checklist of questions to examine each requirement", "E": "categorize the requirements into functional and nonfunctional"}, "ans": ["D"], "hook": "requirements validation → use a checklist", "why": "Sử dụng bảng kiểm giúp đảm bảo mọi yêu cầu được rà soát một cách hệ thống, đầy đủ và khách quan nhất.", "trap": "B sai vì khách hàng thường không có chuyên môn kỹ thuật để phát hiện các lỗi mâu thuẫn hoặc thiếu sót trong đặc tả yêu cầu."}, {"slide": 269, "q": "The cost of fixing a fault", "opts": {"A": "can never be more than 5% of the total development cost.", "B": "is more expensive if found in requirements than functional design.", "C": "can be estimated by performing a SWOT analysis.", "D": "increases as we move the product towards live use.", "E": "decreases as we move the product towards live use."}, "ans": ["D"], "hook": "cost of fixing fault → increases towards live use", "why": "Lỗi càng để lâu đến giai đoạn vận hành mới sửa thì chi phí khắc phục càng tốn kém do phải thay đổi cấu trúc hệ thống đã hoàn thiện.", "trap": "B sai vì lỗi ở giai đoạn yêu cầu thường dễ sửa và ít tốn kém nhất so với các giai đoạn sau."}, {"slide": 270, "q": "The purpose of an acceptance test plan is to", "opts": {"A": "verify the acceptability of the code structure.", "B": "specify the criteria for determining whether the system is finished.", "C": "list all the requirements for the system.", "D": "define the scope of the system development.", "E": "define the goals of the system."}, "ans": ["B"], "hook": "Acceptance test → criteria system finished", "why": "Acceptance test tập trung xác nhận hệ thống đã đáp ứng đầy đủ yêu cầu để nghiệm thu và bàn giao cho khách hàng.", "trap": "A sai vì code structure là mối quan tâm của unit test hoặc code review chứ không phải acceptance test."}, {"slide": 271, "q": "The Bridge design pattern is used to", "opts": {"A": "provide a unified interface to a subsystem.", "B": "decouple an abstraction from its implementation.provide a placeholder for another object.", "C": "decouple an abstraction from its implementation.", "D": "restrict a class to have only one instance.", "E": "defer instantiation of a class to its subclasses"}, "ans": ["C"], "hook": "Bridge pattern → decouple abstraction from implementation", "why": "Bridge tách biệt phần trừu tượng và hiện thực để chúng có thể thay đổi độc lập.", "trap": "A sai vì mô tả chức năng của Facade pattern."}, {"slide": 272, "q": "Suppose you have a list of students with their study hours and attendance. You are using this list to create a decision tree that predicts whether a student will Pass or Fail based on how many hours they have studied and their attendance. Now, if you use the following dataset to train a decision tree to classify \"Pass\" or \"Fail\" based on study hours and attendance:\n\nStudy Hours | Attendance | Result\ngreater than 8 | greater than 90% | Pass\ngreater than 4 | greater than 70% | Pass\n\nAll other paths should result in a Fail. The decision tree predicts the result for a new student who studied for 6 hours and attended 80% of the classes. What is the most likely output if study hours is evaluated first followed by attendance?", "opts": {"A": "Pass", "B": "The decision tree becomes stuck and cannot proceed to a leaf node because there is insufficient data to complete the decision flow.", "C": "Fail", "D": "Cannot determine"}, "ans": ["A"], "hook": "6 hours, 80% attendance → Pass", "why": "Vì 6 giờ lớn hơn 4 và 80% lớn hơn 70%, thoả mãn điều kiện nhánh thứ hai của cây quyết định.", "trap": "C sai vì dữ liệu đầu vào đã thoả mãn điều kiện của nhánh thứ hai nên kết quả là Pass."}, {"slide": 273, "q": "System analysis and design deals with the implementation environment by", "opts": {"A": "incorporating it into application classes.", "B": "ignoring it (i.e., not taking it into account).", "C": "re-engineering it to fit the design.", "D": "delaying consideration of it until implementation.", "E": "encapsulating it so as to isolate it from application classes."}, "ans": ["E"], "hook": "System analysis → Encapsulating implementation details", "why": "Trong giai đoạn phân tích, ta cần cách ly các chi tiết môi trường thực thi để thiết kế tập trung vào logic nghiệp vụ.", "trap": "A sai vì đưa chi tiết thực thi vào class ứng dụng sẽ làm mất tính độc lập của thiết kế."}, {"slide": 274, "q": "System analysis and design distributes the functionality of a use case into boundary, entity and control classes because", "opts": {"A": "these are the only kinds of classes available to us.", "B": "these classes are easier to test.", "C": "we want to isolate specific types of changes to specific types of classes.", "D": "state machine diagrams use these classes.", "E": "object interaction is more easily described using these classes."}, "ans": ["C"], "hook": "use case class distribution → isolate changes to specific classes", "why": "Việc phân tách chức năng thành ba loại class giúp giới hạn phạm vi ảnh hưởng khi yêu cầu hệ thống thay đổi.", "trap": "E sai vì mục đích chính của mô hình hóa là quản lý sự thay đổi chứ không chỉ để mô tả tương tác dễ hơn."}, {"slide": 275, "q": "You are working on a Java project where you need to quickly set up boilerplate code for a RESTful API. You decide to use Amazon Q Developer for this task. How can Amazon Q Developer assist in generating the boilerplate code?", "opts": {"A": "By analyzing your project structure and generating controller, service, and repository templates.", "B": "By auto-generating entire applications without review.", "C": "By only providing syntax but no context.", "D": "By guessing what the user might need without input."}, "ans": ["A"], "hook": "Amazon Q Developer boilerplate → analyzing project structure", "why": "Công cụ này hiểu ngữ cảnh dự án hiện tại để tạo ra các thành phần Controller, Service và Repository phù hợp với kiến trúc có sẵn.", "trap": "B sai vì Amazon Q Developer không tự động tạo toàn bộ ứng dụng mà không cần con người kiểm tra lại."}];
const KEY = 'swe202c_quiz_v2_p5';
const BUILD = '23:00 11/08';
// localStorage ném SecurityError ở một số origin (file://, khung sandbox, cửa sổ ẩn danh).
// Không được để nó làm chết cả script — hỏng chỗ lưu tiến độ thì vẫn phải làm bài được.
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){ /* chạy không lưu */ } }
};
let saveWorks = true;
const def = () => ({i:0, order:DATA.map((_,i)=>i), res:{}, repeat:true});
let st = def();
try { st = Object.assign(def(), JSON.parse(store.get(KEY) || '{}')); }
catch(e){ st = def(); }
try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); }
catch(e){ saveWorks = false; }
let picked = new Set(), revealed = false, peek = false;

const save = () => store.set(KEY, JSON.stringify(st));
const cur = () => DATA[st.order[st.i]];
const same = (a,b) => a.length===b.length && a.every(x=>b.includes(x));
const esc = s => (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// Nạp trạng thái của câu hiện tại. CHỈ gọi khi đổi câu — không gọi trong render(),
// nếu không mỗi lần vẽ lại sẽ xoá mất lựa chọn người dùng vừa bấm.
function sync(){
  const prev = st.res[st.order[st.i]];
  revealed = !!prev;
  picked = new Set(revealed ? prev.picked : []);
  peek = false;
}

function render(){
  const q = cur(), keys = Object.keys(q.opts).sort(), multi = q.ans.length>1;
  const done = Object.keys(st.res).length, right = Object.values(st.res).filter(r=>r.ok).length;
  document.getElementById('sub').textContent =
    DATA.length + ' câu · đã làm ' + done + ' · đúng ' + right +
    (done ? ' (' + Math.round(right/done*100) + '%)' : '') +
    ' · bản ' + BUILD + (saveWorks ? '' : ' · ⚠️ không lưu được tiến độ ở chế độ xem này');
  document.getElementById('pbar').style.width = (done/DATA.length*100) + '%';
  document.getElementById('stat').textContent = 'Câu ' + (st.i+1) + '/' + st.order.length;

  let h = '<div class="meta"><span>Câu ' + (st.i+1) + ' / ' + st.order.length + '</span>' +
          '<span>slide ' + q.slide + ' · ' + (multi ? 'chọn ' + q.ans.length + ' đáp án' : 'chọn 1 đáp án') +
          '</span></div><div class="q">' + esc(q.q) + '</div>';
  keys.forEach(k => {
    let cls = 'opt' + (revealed ? ' done' : '');
    if(revealed){ if(q.ans.includes(k)) cls += ' ok'; else if(picked.has(k)) cls += ' no'; }
    else if(picked.has(k)) cls += ' sel';
    const mark = (revealed && q.ans.includes(k)) ? '✓'
               : (revealed && picked.has(k)) ? '✕'
               : (picked.has(k) ? (multi ? '✓' : '●') : '');
    h += '<div class="' + cls + '" data-k="' + k + '">' +
         '<span class="box ' + (multi ? 'sq' : 'ci') + '">' + mark + '</span>' +
         '<span class="k">' + k + '.</span><span>' + esc(q.opts[k]) + '</span></div>';
  });
  if(revealed){
    const ok = same([...picked].sort(), [...q.ans].sort());
    h += '<div class="fb ' + (ok ? 'ok' : 'no') + '">' +
         (ok ? '✅ Chính xác!' : '❌ Sai — đáp án đúng: ' + q.ans.join(', ')) + '</div>';
  }
  if((revealed || peek) && (q.hook || q.why || q.trap)){
    h += '<div class="tip"><h4>💡 Mẹo nhớ</h4>';
    if(q.hook) h += '<div class="hook">' + esc(q.hook) + '</div>';
    if(revealed && q.why)  h += '<p>' + esc(q.why) + '</p>';
    if(revealed && q.trap) h += '<p class="trap">⚠️ ' + esc(q.trap) + '</p>';
    if(!revealed) h += '<p style="color:var(--muted)">Trả lời xong sẽ hiện đầy đủ lý do và bẫy.</p>';
    h += '</div>';
  }
  document.getElementById('card').innerHTML = h;
  document.getElementById('check').disabled = revealed || picked.size === 0;
  document.getElementById('tipBtn').disabled = revealed || !(q.hook||q.why||q.trap);
  document.getElementById('prev').disabled = st.i === 0;
  document.getElementById('next').disabled = st.i >= st.order.length - 1;
  document.getElementById('repeat').classList.toggle('on', st.repeat);
  document.getElementById('repeat').textContent = 'Lặp câu sai: ' + (st.repeat ? 'BẬT' : 'TẮT');
}

function toggle(k){
  if(revealed) return;
  const q = cur();
  if(q.ans.length > 1){ picked.has(k) ? picked.delete(k) : picked.add(k); }
  else { picked.clear(); picked.add(k); }
  render();
}

// Một listener duy nhất, uỷ quyền từ thẻ cha — click một lần là một lần.
document.getElementById('card').addEventListener('click', e => {
  const el = e.target.closest('.opt');
  if(el && el.dataset.k) toggle(el.dataset.k);
});

function check(){
  if(revealed || !picked.size) return;
  const q = cur(), idx = st.order[st.i];
  const ok = same([...picked].sort(), [...q.ans].sort());
  st.res[idx] = {picked:[...picked], ok};
  if(!ok && st.repeat && !st.order.slice(st.i+1).includes(idx))
    st.order.splice(Math.min(st.i + 5, st.order.length), 0, idx);
  save(); sync(); render();
}
function go(d){
  const n = st.i + d;
  if(n < 0 || n >= st.order.length) return;
  st.i = n; save(); sync(); render();
}

document.getElementById('check').onclick = check;
document.getElementById('next').onclick = () => go(1);
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('tipBtn').onclick = () => { peek = true; render(); };
document.getElementById('repeat').onclick = () => { st.repeat = !st.repeat; save(); render(); };
document.getElementById('shuffle').onclick = () => {
  for(let i=st.order.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0;
    [st.order[i],st.order[j]]=[st.order[j],st.order[i]]; }
  st.i = 0; save(); sync(); render();
};
document.getElementById('wrongOnly').onclick = () => {
  const w = Object.keys(st.res).filter(k => !st.res[k].ok).map(Number);
  if(!w.length){ alert('Chưa có câu nào sai. Cứ làm tiếp đã!'); return; }
  w.forEach(k => delete st.res[k]);
  st.order = w; st.i = 0; save(); sync(); render();
};
document.getElementById('reset').onclick = () => {
  if(!confirm('Xoá toàn bộ tiến độ và làm lại từ đầu?')) return;
  st = def(); save(); sync(); render();
};
document.addEventListener('keydown', e => {
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toUpperCase();
  if(/^[A-H]$/.test(k) && cur().opts[k]){ e.preventDefault(); toggle(k); return; }
  if(e.key === 'Enter'){ e.preventDefault(); revealed ? go(1) : check(); }
  if(e.key === 'ArrowRight') go(1);
  if(e.key === 'ArrowLeft') go(-1);
  if(k === 'H' && !revealed){ peek = true; render(); }
});
if(st.i >= st.order.length) st.i = 0;
sync();
render();
</script></body></html>
