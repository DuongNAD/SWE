pply. The advantages of Random Forests include:", "opts": {"A": "Reduced overfitting", "B": "Versatility", "C": "Improved accuracy", "D": "Enhance overfitting"}, "ans": ["A", "B", "C"], "hook": "Random Forests → reduced overfitting, versatility, accuracy", "why": "Random Forests kết hợp nhiều cây quyết định để giảm thiểu overfitting, tăng cường độ chính xác và có thể áp dụng cho nhiều loại dữ liệu.", "trap": "D sai vì Random Forests được thiết kế để GIẢM overfitting, không phải TĂNG."}, {"slide": 127, "q": "_____ focuses on whether we have built the right software in such a way that it meets the stated requirements.", "opts": {"A": "Validation Testing", "B": "Verification Testing", "C": "Unit Testing", "D": "Integration Testing", "E": "System Testing"}, "ans": ["A"], "hook": "right software → Validation", "why": "Validation Testing tập trung vào việc kiểm tra xem chúng ta có xây dựng đúng phần mềm mà khách hàng mong muốn hay không nhằm đáp ứng các yêu cầu đã đề ra.", "trap": "B sai vì Verification Testing tập trung vào câu hỏi liệu chúng ta có xây dựng phần mềm đúng cách hay không (built the product right) thay vì xây dựng đúng phần mềm (built the right software/right)."}, {"slide": 128, "q": "_____ focuses on whether we have built the software right in such a way that each function works correctly and has no defects.", "opts": {"A": "Validation Testing", "B": "Verification Testing", "C": "Unit Testing", "D": "Integration Testing", "E": "System Testing"}, "ans": ["B"], "hook": "built the software right → Verification", "why": "Verification tập trung vào việc kiểm tra xem phần mềm có được xây dựng đúng theo đặc tả kỹ thuật và không có lỗi hay không.", "trap": "A sai vì Validation tập trung vào việc xây dựng đúng sản phẩm người dùng cần (built the right software)."}, {"slide": 129, "q": "_____ states \"what must always\" be true beginning a scenario in the use case.", "opts": {"A": "Initial conditions", "B": "Preconditions", "C": "Primary conditions", "D": "Secondary conditions", "E": "Postconditions"}, "ans": ["B"], "hook": "beginning a scenario → Preconditions", "why": "Preconditions là các điều kiện tiên quyết bắt buộc phải đúng trước khi một kịch bản use case có thể bắt đầu thực hiện.", "trap": "A sai vì Initial conditions không phải là thuật ngữ chuẩn được sử dụng trong đặc tả use case của UML."}, {"slide": 130, "q": "When integrating AI into existing systems, businesses must address _______.", "opts": {"A": "Compatibility with legacy software and workflows", "B": "The elimination of all manual processes.", "C": "The need for constant system updates regardless of functionality.", "D": "The rejection of any customization to existing tools."}, "ans": ["A"], "hook": "Integrating AI → Compatibility legacy software", "why": "Khi đưa AI vào hệ thống cũ, thách thức lớn nhất là đảm bảo công nghệ mới tương thích và hoạt động trơn tru với các phần mềm cũng như quy trình hiện có.", "trap": "B sai vì AI thường hỗ trợ hoặc tự động hóa một phần chứ hiếm khi loại bỏ hoàn toàn mọi quy trình thủ công ngay lập tức."}, {"slide": 131, "q": "AI enhances CRM by analyzing customer data to ______.", "opts": {"A": "Provide personalized experiences and predict customer needs.", "B": "Eliminate human interaction in customer service.", "C": "Generate marketing strategies to sell to the best market of the world.", "D": "Ignore trends and ensure that profit is earned by validating that accounting books are correct."}, "ans": ["A"], "hook": "AI enhances CRM → personalized experiences", "why": "AI trong quản trị quan hệ khách hàng tập trung vào việc khai phá dữ liệu để cá nhân hóa trải nghiệm và dự đoán nhu cầu tương lai.", "trap": "B sai vì AI chỉ hỗ trợ chứ không loại bỏ hoàn toàn sự tương tác của con người trong dịch vụ khách hàng."}, {"slide": 132, "q": "Amazon Q Developer enhances productivity in software development by _______.", "opts": {"A": "Providing code suggestions, explanations, reviews, fixes, optimizations and debugging capabilities", "B": "Replacing the need for software testing.", "C": "Automating the deployment of applications.", "D": "Generating new programming languages."}, "ans": ["A"], "hook": "Amazon Q → suggestions, fixes, debugging", "why": "Đây là công cụ AI hỗ trợ lập trình viên trong toàn bộ chu trình phát triển mã nguồn từ gợi ý đến tối ưu hóa và sửa lỗi.", "trap": "C sai vì Amazon Q tập trung vào hỗ trợ lập trình hơn là tự động hóa quy trình triển khai hạ tầng."}, {"slide": 133, "q": "A state machine diagram describes the behaviour of", "opts": {"A": "an object.", "B": "a use case.", "C": "an operation.", "D": "an actor.", "E": "a class."}, "ans": ["A"], "hook": "State machine → object", "why": "State machine diagram tập trung mô tả vòng đời và các trạng thái chuyển đổi của một đối tượng cụ thể.", "trap": "E sai vì class là khuôn mẫu, còn state machine mô tả hành vi của một thực thể (object) cụ thể trong quá trình thực thi."}, {"slide": 134, "q": "Fill in the blanks (indicated by _______). Generative AI improves Java development by _______.", "opts": {"A": "Suggesting repetitive boilerplate code", "B": "Eliminating the need for human review of code", "C": "Writing complex programs without user input", "D": "Automating software testing in all environments"}, "ans": ["A"], "hook": "Generative AI → Suggesting repetitive boilerplate code", "why": "Generative AI hỗ trợ lập trình Java hiệu quả nhất bằng cách tự động gợi ý các đoạn mã lặp đi lặp lại như getter, setter hay constructor giúp tiết kiệm thời gian", "trap": "C sai vì AI vẫn cần sự can thiệp và đầu vào từ con người để định hướng chứ không thể tự viết chương trình phức tạp từ"}, {"slide": 135, "q": "The behavior of a use case is specified by _____", "opts": {"A": "classes", "B": "components", "C": "nodes", "D": "participating actors", "E": "flow of events"}, "ans": ["E"], "hook": "behavior of a use case → flow of events", "why": "Hành vi của một use case mô tả chuỗi các bước tương tác giữa tác nhân và hệ thống, do đó nó được đặc tả bằng luồng sự kiện.", "trap": "A sai vì classes chỉ định nghĩa cấu trúc dữ liệu và hành vi của các đối tượng cụ thể chứ không đặc tả hành vi của toàn bộ use case."}, {"slide": 136, "q": "SRS stands for ______", "opts": {"A": "Software Resource Solution", "B": "System Refinement Solution", "C": "Structured Requirements Specification", "D": "System Requirements Specification", "E": "Structured Refinement Solution"}, "ans": ["D"], "hook": "SRS → System Requirements Specification", "why": "SRS là viết tắt của System Requirements Specification, tài liệu mô tả các yêu cầu chức năng và phi chức năng của một hệ thống phần mềm.", "trap": "C sai vì 'Structured Requirements Specification' không phải là tên gọi chuẩn, mà là 'System Requirements Specification'."}, {"slide": 138, "q": "What is one of the key challenges in scaling AI systems to handle large volumes of data and high user demand?", "opts": {"A": "Real-time data processing", "B": "Data cleaning and preprocessing", "C": "Data visualization", "D": "Increasing model complexity"}, "ans": ["A"], "hook": "scaling AI, large data, high demand → Real-time data processing", "why": "Khi mở rộng hệ thống AI để xử lý lượng dữ liệu khổng lồ và lượng người dùng truy cập cao cùng lúc, thách thức lớn nhất là phải xử lý dữ liệu và đưa ra phản hồi theo thời gian thực để đảm bảo trải nghiệm người dùng không bị trễ.", "trap": "B sai vì việc làm sạch và tiền xử lý dữ liệu chủ yếu là thách thức trong giai đoạn chuẩn bị dữ liệu huấn luyện chứ không phải là thách thức chính khi hệ thống đang vận hành thực tế ở quy mô lớn."}, {"slide": 139, "q": "What is a feature of AI-powered refactoring tools?", "opts": {"A": "Rewriting business logic without input.", "B": "Automating integration testing.", "C": "Guaranteeing compatibility across systems.", "D": "Detecting redundant code for removal."}, "ans": ["D"], "hook": "refactoring tools → Detecting redundant code", "why": "Các công cụ refactoring tích hợp AI có khả năng phân tích cú pháp và ngữ nghĩa của mã nguồn để phát hiện ra những đoạn mã thừa hoặc trùng lặp nhằm đề xuất loại bỏ chúng giúp tối ưu hóa hệ thống.", "trap": "A sai vì AI không tự ý viết lại logic nghiệp vụ của doanh nghiệp khi không có đầu vào hoặc yêu cầu cụ thể từ lập trình viên."}, {"slide": 140, "q": "What do we capture in use-case modeling?", "opts": {"A": "user interface requirements", "B": "hardware requirements", "C": "acceptance tests", "D": "system behaviour", "E": "data requirements"}, "ans": ["D"], "hook": "Use-case modeling → System behaviour", "why": "Mô hình hóa use-case tập trung mô tả cách hệ thống phản ứng với các tương tác của người dùng để đạt được mục tiêu.", "trap": "A sai vì giao diện người dùng chỉ là một phần nhỏ thể hiện hành vi chứ không phải toàn bộ mục tiêu của use-case."}, {"slide": 141, "q": "What would be most effective in reducing the complexity of designing a software system?", "opts": {"A": "having clear design goals", "B": "having refined work breakdown structure", "C": "having right level of communication", "D": "having sufficient budget", "E": "having timely administrative support"}, "ans": ["A"], "hook": "reducing complexity → clear design goals", "why": "Mục tiêu thiết kế rõ ràng giúp định hình cấu trúc hệ thống chuẩn xác từ đầu, từ đó trực tiếp giảm thiểu sự phức tạp không cần thiết trong quá trình thiết kế.", "trap": "B sai vì work breakdown structure chỉ là việc phân chia công việc trong quản lý dự án chứ không tác động trực tiếp đến việc giảm độ phức tạp của kiến trúc hệ thống."}, {"slide": 142, "q": "Which of the following is non-functional testing?", "opts": {"A": "black box testing", "B": "white box testing", "C": "performance testing", "D": "unit testing", "E": "integration testing"}, "ans": ["C"], "hook": "Non-functional testing → Performance testing", "why": "Performance testing đánh giá hiệu năng hệ thống thay vì chức năng cụ thể.", "trap": "A sai vì black box là kỹ thuật kiểm thử chức năng dựa trên đầu vào và đầu ra."}, {"slide": 143, "q": "Which of the following domains focuses on ensuring employees are prepared, equipped, and motivated to adopt new tools and processes in digital transformation?", "opts": {"A": "Technology", "B": "Operational Processes", "C": "Change Management", "D": "Business Model"}, "ans": ["C"], "hook": "prepared, equipped, motivated → Change Management", "why": "Change Management là lĩnh vực tập trung vào yếu tố con người, giúp nhân viên chuẩn bị sẵn sàng, trang bị đầy đủ và có động lực để thích ứng với các thay đổi công nghệ mới.", "trap": "B sai vì Operational Processes chỉ tập trung vào việc tối ưu hóa quy trình vận hành kỹ thuật chứ không giải quyết khía cạnh con người và tâm lý nhân viên."}, {"slide": 144, "q": "Which of the following UML concepts is not a classifier?", "opts": {"A": "class", "B": "operation", "C": "association", "D": "method", "E": "attribute"}, "ans": ["D"], "hook": "Classifier → method", "why": "Method là một phần của operation, không phải một classifier độc lập trong UML.", "trap": "B sai vì operation là một classifier, nó định nghĩa hành vi có thể thực hiện trên một đối tượng."}, {"slide": 145, "q": "Which of the following is a generalization coverage constraint?", "opts": {"A": "complex", "B": "disunion", "C": "overloaded", "D": "common", "E": "disjoint"}, "ans": ["E"], "hook": "Generalization coverage → Disjoint", "why": "Disjoint là ràng buộc phổ biến nhất yêu cầu các lớp con không được trùng lặp đối tượng.", "trap": "C sai vì overloaded không phải là một loại constraint trong sơ đồ phân cấp lớp."}, {"slide": 146, "q": "Which of the following best describes the phased-release process of incremental development?", "opts": {"A": "partial system; full functionality", "B": "partial system; partial functionality", "C": "full system; partial functionality", "D": "full system; full functionality", "E": "perfect system; perfect functionality"}, "ans": ["A"], "hook": "phased-release → partial system; full functionality", "why": "Quy trình này phát hành từng phần của hệ thống nhưng mỗi phần khi ra mắt đều phải đảm bảo đầy đủ chức năng đã cam kết cho phân đoạn đó.", "trap": "B sai vì partial functionality thường ám chỉ chức năng chưa hoàn thiện, không phù hợp với mục tiêu phát hành sản phẩm sử dụng được ngay."}, {"slide": 147, "q": "Which of the following best describes the phased-release process of iterative development?", "opts": {"A": "partial system; full functionality", "B": "partial system; partial functionality", "C": "full system; partial functionality", "D": "full system; full functionality", "E": "perfect system; perfect functionality"}, "ans": ["C"], "hook": "phased-release → full system; partial functionality", "why": "Quy trình phased-release trong phát triển lặp nghĩa là bàn giao toàn bộ hệ thống ngay từ đầu nhưng chỉ kích hoạt hoặc hoàn thiện một phần chức năng ở mỗi giai đoạn.", "trap": "B sai vì partial system thường mô tả cho phương thức bàn giao incremental phát triển từng phần của hệ thống chứ không phải phased-release cho toàn bộ hệ thống."}, {"slide": 148, "q": "Which law is designed to regulate the use of high-risk AI applications?", "opts": {"A": "United States' AI Bill of Rights (2024)", "B": "European Union's AI Act (2024)", "C": "United Nations AI Regulations (2024)", "D": "China's AI Regulations (2024)"}, "ans": ["B"], "hook": "high-risk AI → EU AI Act", "why": "European Union's AI Act là đạo luật toàn diện đầu tiên trên thế giới phân loại và quản lý chặt chẽ các ứng dụng AI theo mức độ rủi ro bao gồm cả nhóm high-risk.", "trap": "A sai vì AI Bill of Rights của Mỹ chỉ là bộ nguyên tắc hướng dẫn phi ràng buộc chứ không phải là luật bắt buộc để quản lý ứng dụng AI."}, {"slide": 149, "q": "Which technology is often referred to as the \"invisible foundation\" that enables businesses to scale operations, improve efficiency, and facilitate seamless team collaboration?", "opts": {"A": "Blockchain", "B": "Cloud Computing", "C": "Artificial Intelligence (AI)", "D": "Internet of Things (IoT)"}, "ans": ["B"], "hook": "invisible foundation → Cloud Computing", "why": "Cloud Computing cung cấp hạ tầng máy chủ ảo và tài nguyên lưu trữ vô hình nhưng là nền tảng cốt lõi giúp doanh nghiệp mở rộng quy mô và cộng tác từ xa dễ dàng.", "trap": "A sai vì Blockchain thường được gắn liền với các thuật ngữ về bảo mật, phi tập trung và minh bạch chứ không phải là nền tảng vô hình cho vận hành doanh nghiệp nói chung."}, {"slide": 150, "q": "When developing a software development plan, the first task to do is:", "opts": {"A": "decide on the implementation environment.", "B": "define the scope of the project.", "C": "identify the deliverables.", "D": "develop a schedule for the project.", "E": "identify the project risks."}, "ans": ["B"], "hook": "software development plan, first task → define the scope", "why": "Để lập kế hoạch phát triển phần mềm hiệu quả thì việc đầu tiên luôn là xác định phạm vi dự án nhằm biết rõ giới hạn công việc cần làm trước khi phân bổ nguồn lực hay lập lịch biểu.", "trap": "D sai vì không thể lập lịch biểu chi tiết khi chưa biết rõ phạm vi công việc của dự án gồm những gì."}, {"slide": 151, "q": "When testing a simple loop, what is the minimum number of test cases required?", "opts": {"A": "1", "B": "3", "C": "4", "D": "5", "E": "7"}, "ans": ["E"], "hook": "simple loop → minimum 7", "why": "Theo phương pháp kiểm thử vòng lặp đơn giản của Beizer, chúng ta cần tối thiểu 7 ca kiểm thử bao gồm các trường hợp bỏ qua vòng lặp, đi qua vòng lặp 1 lần, 2 lần, m lần, n-1 lần, n lần và n+1 lần.", "trap": "B sai vì 3 chỉ là số ca kiểm thử tối thiểu cho một nhánh điều kiện thông thường chứ không đủ bao phủ các biên đặc thù của cấu trúc vòng lặp."}, {"slide": 152, "q": "A company implements AI tools to improve productivity, uses analytics to interpret sales trends, and conducts training sessions to prepare employees for new workflows. Which domains of digital transformation does this address?", "opts": {"A": "Technology, data, and process.", "B": "Technology, Data, and Change management.", "C": "Technology and networking.", "D": "Data, Process, and change management."}, "ans": ["B"], "hook": "AI tools, analytics, training → Technology, Data, Change management", "why": "Công cụ AI đại diện cho Technology, phân tích xu hướng bán hàng đại diện cho Data, và đào tạo nhân viên thích ứng quy trình mới đại diện cho Change management.", "trap": "A sai vì training sessions để chuẩn bị cho nhân viên thích ứng quy trình mới thuộc về Change management chứ không đơn thuần là thay đổi Process cơ học."}, {"slide": 153, "q": "A Random Forest model is trained to predict house prices based on features like size, location, and number of bedrooms. The predictions from individual trees for a specific house are:\n- Tree 1: $200\n- Tree 2: $220\n- Tree 3: $210\n\nWhat is the final prediction of the Random Forest model for the house?", "opts": {"A": "$210", "B": "$200", "C": "$220", "D": "$250"}, "ans": ["A"], "hook": "Random Forest prediction → average of individual predictions", "why": "Trong mô hình Random Forest cho bài toán hồi quy, kết quả cuối cùng là giá trị trung bình của tất cả các cây quyết định.", "trap": "Các phương án khác sai vì đây không phải là bài toán phân loại theo đa số phiếu bầu mà là tính toán giá trị trung bình."}, {"slide": 154, "q": "A smart city uses connected devices to monitor traffic and optimize public transportation. What technology is primarily enabling this transformation?", "opts": {"A": "Cloud computing", "B": "Artificial Intelligence (AI)", "C": "Data", "D": "Internet of Things (IoT)"}, "ans": ["D"], "hook": "Smart city, connected devices → Internet of Things (IoT)", "why": "Internet of Things là hạ tầng kết nối các thiết bị thông minh để thu thập dữ liệu trong môi trường đô thị.", "trap": "A sai vì Cloud computing chỉ là nơi lưu trữ và xử lý dữ liệu, không phải công nghệ kết nối thiết bị đầu cuối."}, {"slide": 155, "q": "A use case captures the system's behaviour from which point of view?", "opts": {"A": "design", "B": "developer's", "C": "user interface", "D": "user's", "E": "domain model"}, "ans": ["D"], "hook": "use case → user's point of view", "why": "Use case mô tả các chức năng hệ thống dựa trên sự tương tác và mong muốn của người dùng cuối thay vì góc nhìn kỹ thuật.", "trap": "B sai vì developer tập trung vào cách cài đặt mã nguồn chứ không phải hành vi tổng quát của hệ thống."}, {"slide": 156, "q": "A nonfunctional requirement places a ______ on a use case or on the system.", "opts": {"A": "condition", "B": "constraint", "C": "criteria", "D": "feature", "E": "function"}, "ans": ["B"], "hook": "nonfunctional requirement → constraint", "why": "Yêu cầu phi chức năng luôn đặt ra các ràng buộc hay giới hạn cho các use case hoặc toàn bộ hệ thống.", "trap": "A sai vì condition thường là điều kiện tiên quyết để thực hiện use case chứ không phải bản chất của yêu cầu phi chức năng."}, {"slide": 157, "q": "All required functionality is described in the", "opts": {"A": "actor directory.", "B": "class library.", "C": "use cases.", "D": "scenario book.", "E": "task description."}, "ans": ["C"], "hook": "required functionality → use cases", "why": "Trong công nghệ phần mềm, tất cả các chức năng yêu cầu của hệ thống thường được mô tả chi tiết và trực quan nhất thông qua các use case.", "trap": "E sai vì task description thường chỉ mô tả các công việc kỹ thuật nhỏ của lập trình viên chứ không đại diện cho toàn bộ chức năng hệ thống đứng từ góc nhìn người dùng."}, {"slide": 158, "q": "An alternative flow of events for a use case cannot show what type of behaviour?", "opts": {"A": "exceptional", "B": "shared", "C": "variant", "D": "optional", "E": "error"}, "ans": ["B"], "hook": "alternative flow → cannot show shared", "why": "Luồng thay thế chỉ mô tả các hành vi ngoại lệ, tùy chọn hoặc lỗi của một use case cụ thể chứ không dùng để thể hiện hành vi chia sẻ chung giữa các use case.", "trap": "A sai vì exceptional flow chính là một dạng luồng thay thế phổ biến để xử lý ngoại lệ."}, {"slide": 159, "q": "Actors are connected to use cases only by", "opts": {"A": "association relationship.", "B": "dependency relationship.", "C": "generalization relationship.", "D": "inheritance relationship.", "E": "realization relationship."}, "ans": ["A"], "hook": "Actor - Use case → association", "why": "Trong biểu đồ use case, mối quan hệ duy nhất được phép kết nối giữa Actor và Use case là đường kẻ biểu thị sự tương tác trực tiếp.", "trap": "B sai vì dependency chỉ dùng để mô tả sự phụ thuộc giữa các use case hoặc các lớp, không dùng nối Actor."}, {"slide": 160, "q": "Black box testing techniques are mostly used in what type of testing?", "opts": {"A": "unit", "B": "condition", "C": "loop", "D": "integration", "E": "data flow"}, "ans": ["D"], "hook": "Black box → integration testing", "why": "Black box testing tập trung vào giao diện và tương tác giữa các thành phần nên phù hợp nhất với integration testing.", "trap": "A sai vì unit testing thường sử dụng white box testing để kiểm tra logic bên trong mã nguồn."}, {"slide": 161, "q": "Behavioral testing is", "opts": {"A": "black box testing", "B": "white box testing", "C": "red box testing", "D": "green box testing", "E": "blue box testing"}, "ans": ["A"], "hook": "Behavioral testing → Black box", "why": "Behavioral testing tập trung vào hành vi đầu ra dựa trên đầu vào mà không quan tâm đến cấu trúc mã nguồn bên trong.", "trap": "B sai vì White box là Structural testing tập trung vào cấu trúc bên trong của phần mềm."}, {"slide": 162, "q": "In the UML, a class is a description of a group of objects that have common", "opts": {"A": "attributes, operations, relationships and semantics.", "B": "identity, operations, relationships and semantics.", "C": "attributes, operations, roles and semantics.", "D": "attributes, operations, relationships and multiplicity.", "E": "attributes, coverage, relationships and semantics."}, "ans": ["A"], "hook": "UML class → attributes, operations, relationships, semantics", "why": "Định nghĩa chuẩn của một class trong UML bao gồm bốn thành phần cốt lõi là thuộc tính, hành vi, mối quan hệ và ý nghĩa ngữ nghĩa.", "trap": "B sai vì identity là đặc điểm của object chứ không phải class."}, {"slide": 163, "q": "In the UML, the interface of an object contains only", "opts": {"A": "attributes.", "B": "values.", "C": "data types.", "D": "operations.", "E": "variables."}, "ans": ["D"], "hook": "interface → operations", "why": "Trong UML, interface của một đối tượng định nghĩa các hành vi hoặc dịch vụ mà đối tượng đó cung cấp ra bên ngoài thông qua các phương thức.", "trap": "A sai vì attributes thuộc về cấu trúc dữ liệu nội tại của class chứ không phải giao diện tương tác."}, {"slide": 164, "q": "In terms of software quality assurance, the purpose of both the SEI Process Capability Maturity Model (SEI-CMM) and the People Capability Maturity Model (PCMM) is to:", "opts": {"A": "educate and train managers.", "B": "provide feedback on current practices.", "C": "assess and improve current practices.", "D": "develop best practices.", "E": "improve the standards handbook."}, "ans": ["C"], "hook": "SEI-CMM and PCMM → assess and improve practices", "why": "Cả hai mô hình trưởng thành năng lực này đều được thiết kế để đánh giá hiện trạng và cải tiến liên tục các quy trình hoạt động của tổ chức.", "trap": "D sai vì mục đích chính của các mô hình này là đánh giá và cải tiến quy trình hiện tại dựa trên khung chuẩn có sẵn chứ không phải là tự đi xây dựng các best practices mới."}, {"slide": 165, "q": "In domain modeling we capture the system's most important", "opts": {"A": "user interfaces.", "B": "functional requirements.", "C": "use cases and scenarios.", "D": "classes and associations.", "E": "acceptance tests."}, "ans": ["D"], "hook": "domain modeling → classes and associations", "why": "Mô hình miền tập trung vào việc biểu diễn cấu trúc dữ liệu tĩnh thông qua các lớp và mối quan hệ giữa chúng trong không gian vấn đề.", "trap": "B sai vì functional requirements mô tả hành vi hệ thống chứ không phải cấu trúc thực thể như domain model."}, {"slide": 166, "q": "Neural networks are based on:", "opts": {"A": "Decision trees", "B": "Connecting the human brain to a computer", "C": "The behavior of the human brain", "D": "Linked lists"}, "ans": ["C"], "hook": "Neural networks → behavior of the human brain", "why": "Neural networks hay mạng nơ-ron được xây dựng dựa trên việc mô phỏng cấu trúc và cách hoạt động sinh học của bộ não con người.", "trap": "B sai vì mạng nơ-ron là mô hình toán học mô phỏng não bộ chứ không phải là việc cắm dây kết nối trực tiếp vật lý giữa não người và máy tính."}, {"slide": 167, "q": "One of the required inputs for a program that does room scheduling for a public venue is the day of the week, which is input as Sunday, Monday, etc. When testing this program for the input day of the week, what are the minimum number of test values that you would use?", "opts": {"A": "5", "B": "7", "C": "8", "D": "9", "E": "10"}, "ans": ["C"], "hook": "day of the week → 8", "why": "Ngoài 7 ngày trong tuần cần thêm 1 giá trị sai để kiểm tra tính đúng đắn của dữ liệu đầu vào.", "trap": "B sai vì chỉ tính các trường hợp hợp lệ mà quên mất trường hợp ngoại lệ."}, {"slide": 168, "q": "\"The system should register a student in less than a second\" is an example of what type of requirement?", "opts": {"A": "functional", "B": "pseudo", "C": "data", "D": "nonfunctional", "E": "user interface"}, "ans": ["D"], "hook": "less than a second → nonfunctional", "why": "Yêu cầu về tốc độ xử lý hoặc hiệu năng thuộc nhóm thuộc tính chất lượng thay vì mô tả chức năng nghiệp vụ cụ thể.", "trap": "A sai vì functional chỉ tập trung vào việc hệ thống làm gì chứ không phải làm nhanh hay chậm."}, {"slide": 169, "q": "The source code of a software component is required to do which type of testing?", "opts": {"A": "regression testing", "B": "beta testing", "C": "alpha testing", "D": "acceptance testing", "E": "system testing"}, "ans": ["A"], "hook": "source code changed → regression testing", "why": "Regression testing được thực hiện để đảm bảo các thay đổi trong mã nguồn không làm hỏng những chức năng đã hoạt động ổn định trước đó.", "trap": "D sai vì Acceptance testing tập trung vào yêu cầu người dùng cuối chứ không kiểm tra trực tiếp trên mã nguồn."}, {"slide": 170, "q": "The testing in which code is checked is", "opts": {"A": "black box testing", "B": "white box testing", "C": "red box testing", "D": "green box testing", "E": "blue box testing"}, "ans": ["B"], "hook": "code is checked → white box", "why": "White box testing cho phép người kiểm thử nhìn thấy cấu trúc mã nguồn bên trong và kiểm tra trực tiếp các dòng code đó.", "trap": "A sai vì black box testing chỉ kiểm tra chức năng bên ngoài mà không được phép nhìn hay kiểm tra mã nguồn bên trong."}, {"slide": 171, "q": "The degree to which the design specifications are followed during manufacturing is known as", "opts": {"A": "quality of adherence.", "B": "quality of conformance.", "C": "quality of design.", "D": "quality of performance.", "E": "quality of testing."}, "ans": ["B"], "hook": "Manufacturing → quality of conformance", "why": "Quality of conformance là thước đo mức độ sản phẩm thực tế tuân thủ đúng các đặc tả thiết kế ban đầu.", "trap": "C sai vì quality of design tập trung vào giá trị các tính năng chứ không phải quá trình sản xuất."}, {"slide": 172, "q": "Test cases for state-based testing can be derived from the", "opts": {"A": "use case model.", "B": "state machine diagrams.", "C": "basis paths.", "D": "domain model.", "E": "nonfunctional requirements."}, "ans": ["B"], "hook": "state-based testing → state machine diagrams", "why": "Kiểm thử dựa trên trạng thái state-based testing sử dụng biểu đồ máy trạng thái state machine diagrams để mô tả các trạng thái của hệ thống và chuyển đổi giữa chúng.", "trap": "A sai vì use case model chỉ tập trung vào hành vi tương tác của người dùng với hệ thống chứ không biểu diễn chi tiết các trạng thái bên trong."}, {"slide": 173, "q": "Risk analysis is introduced in which software development process?", "opts": {"A": "Waterfall", "B": "Prototyping", "C": "Agile", "D": "Phased-release", "E": "Spiral"}, "ans": ["E"], "hook": "Risk analysis → Spiral", "why": "Mô hình Spiral đặt trọng tâm vào việc đánh giá và giảm thiểu rủi ro trong mỗi vòng lặp phát triển.", "trap": "A sai vì Waterfall là mô hình tuyến tính, không chú trọng việc phân tích rủi ro ngay từ đầu."}, {"slide": 175, "q": "What is one key challenge businesses face when integrating AI solutions with existing Customer Relationship Management (CRM) systems?", "opts": {"A": "Replacing the CRM system entirely with the AI solution.", "B": "Ensuring seamless data flow between AI and the CRM system.", "C": "Using AI only to automate routine customer service tasks.", "D": "Eliminating all manual processes from the CRM system."}, "ans": ["B"], "hook": "integrating AI CRM → seamless data flow", "why": "Việc kết nối AI vào hệ thống CRM sẵn có gặp khó khăn lớn nhất ở khâu đồng bộ và truyền tải dữ liệu mượt mà giữa hai nền tảng.", "trap": "A sai vì mục tiêu là tích hợp (integrating) chứ không phải thay thế hoàn toàn hệ thống cũ."}, {"slide": 176, "q": "What is one primary ethical or regulatory challenge businesses face when deploying AI solutions like Generative AI?", "opts": {"A": "Reducing the cost of AI development and deployment", "B": "Ensuring compliance with data protection laws like GDPR", "C": "Avoiding biases in AI-generated outputs", "D": "Scaling AI solutions across multiple platforms"}, "ans": ["B"], "hook": "Ethical or regulatory → GDPR", "why": "Quy định pháp lý và đạo đức hàng đầu trong triển khai AI hiện nay liên quan chặt chẽ đến việc bảo vệ dữ liệu cá nhân và quyền riêng tư theo các bộ luật quốc tế.", "trap": "C sai vì đây là thách thức kỹ thuật và đạo đức nội bộ, không mang tính ràng buộc pháp lý (regulatory) mạnh mẽ như luật GDPR."}, {"slide": 177, "q": "What is the primary role of the hidden layers in a neural network?", "opts": {"A": "To make the final prediction.", "B": "To collect raw data for training.", "C": "To store the output of the neural network.", "D": "To combine and extract patterns from input features."}, "ans": ["D"], "hook": "Hidden layers → extract patterns", "why": "Các tầng ẩn thực hiện tính toán phi tuyến tính để trích xuất và kết hợp các đặc trưng phức tạp từ dữ liệu đầu vào.", "trap": "A sai vì tầng đầu ra (output layer) mới là nơi thực hiện dự đoán cuối cùng."}, {"slide": 178, "q": "What is the primary advantage of using decision trees?", "opts": {"A": "They can only handle numerical data.", "B": "They require large amounts of data to work.", "C": "They are easy to interpret and visualize.", "D": "They are free from overfitting."}, "ans": ["C"], "hook": "decision trees → easy interpret visualize", "why": "Cấu trúc cây phân cấp giúp con người dễ dàng đọc hiểu luồng quyết định và minh họa bằng hình ảnh trực quan.", "trap": "D sai vì decision trees rất dễ bị overfitting nếu cây phát triển quá sâu mà không được cắt tỉa."}, {"slide": 179, "q": "What is one major benefit of using Generative AI in software development?", "opts": {"A": "Guaranteeing bug-free applications.", "B": "Writing entire applications without user input.", "C": "Reducing repetitive coding tasks.", "D": "Handling hardware configurations automatically."}, "ans": ["C"], "hook": "Generative AI → Reducing repetitive", "why": "AI hỗ trợ tự động hóa các đoạn mã lặp đi lặp lại giúp tăng năng suất lập trình viên.", "trap": "A sai vì AI không thể đảm bảo ứng dụng hoàn toàn không có lỗi."}, {"slide": 180, "q": "What is one advantage of using Generative AI for code reviews?", "opts": {"A": "Automating the identification of potential bugs.", "B": "Replacing developers for manual code reviews.", "C": "Refactoring code without developer input.", "D": "Generating detailed project documentation."}, "ans": ["A"], "hook": "GenAI code review → automating bug identification", "why": "GenAI hỗ trợ đắc lực trong việc quét nhanh các lỗi tiềm ẩn mà con người có thể bỏ sót.", "trap": "B sai vì AI chỉ hỗ trợ chứ không thay thế hoàn toàn vai trò kiểm soát chất lượng của lập trình viên."}, {"slide": 181, "q": "What is a primary ethical consideration when deploying AI systems in business?", "opts": {"A": "Using only publicly available data for training.", "B": "Automating every process without human oversight.", "C": "Ensuring the AI system is completely autonomous.", "D": "Ensuring data privacy and protection."}, "ans": ["D"], "hook": "AI deployment → Data privacy", "why": "Việc bảo mật thông tin và quyền riêng tư của dữ liệu là yêu cầu đạo đức quan trọng nhất khi áp dụng trí tuệ nhân tạo.", "trap": "B sai vì việc tự động hóa hoàn toàn mà thiếu sự kiểm soát của con người là hành vi thiếu trách nhiệm."}, {"slide": 182, "q": "What approach does Generative AI use to develop coding capabilities?", "opts": {"A": "By relying on manual instructions for every task.", "B": "By copying code from online repositories.", "C": "By guessing the logic for code execution.", "D": "By analyzing patterns in training data."}, "ans": ["D"], "hook": "GenAI → patterns in training data", "why": "Generative AI hoạt động dựa trên việc học và phân tích các mẫu dữ liệu khổng lồ để dự đoán nội dung tiếp theo.", "trap": "C sai vì AI tạo mã dựa trên xác suất mẫu hình thay vì tự đoán logic tùy tiện."}, {"slide": 183, "q": "What role does Generative AI play in automating code reviews?", "opts": {"A": "Automatically merging reviewed code into the main branch.", "B": "Performing reviews without any developer input.", "C": "Guaranteeing compliance with all coding standards.", "D": "Highlighting inefficiencies and suggesting improvements."}, "ans": ["D"], "hook": "GenAI code review → highlight inefficiencies, suggest improvements", "why": "GenAI đóng vai trò hỗ trợ con người bằng cách phát hiện các điểm chưa tối ưu và đề xuất mã nguồn tốt hơn thay vì tự động quyết định thay thế con người.", "trap": "C sai vì GenAI chỉ mang tính tham khảo, không thể đảm bảo tuyệt đối tuân thủ mọi coding standards trong mọi ngữ cảnh phức tạp."}, {"slide": 184, "q": "Which of the following is a key ethical challenge when deploying AI systems?", "opts": {"A": "Preventing AI from being used in any customer-facing roles.", "B": "Complying with data protection laws like GDPR.", "C": "Ensuring the AI system works only offline.", "D": "Guaranteeing that AI never makes errors."}, "ans": ["B"], "hook": "ethical challenge → GDPR", "why": "Tuân thủ các luật bảo vệ dữ liệu như GDPR là một thách thức đạo đức và pháp lý cốt lõi khi triển khai các hệ thống AI xử lý dữ liệu người dùng.", "trap": "D sai vì việc đảm bảo AI không bao giờ mắc lỗi là điều không thể thực hiện được trong thực tế, đây là mục tiêu không khả thi chứ không phải thách thức đạo đức chuẩn mực."}, {"slide": 185, "q": "Which of the following statements is true about custom software?", "opts": {"A": "The number of copies in use is high.", "B": "The requirements come from market research.", "C": "The development effort is high.", "D": "The requirements come from hardware needs.", "E": "The development effort is low."}, "ans": ["C"], "hook": "custom software → development effort is high", "why": "Phần mềm viết theo yêu cầu riêng của khách hàng luôn đòi hỏi nhiều công sức phát triển từ đầu thay vì có sẵn như phần mềm thương mại đóng gói.", "trap": "B sai vì nghiên cứu thị trường là nguồn yêu cầu của phần mềm thương mại đại chúng chứ không phải phần mềm viết theo yêu cầu riêng."}, {"slide": 186, "q": "Why is compliance important when deploying AI systems in businesses?", "opts": {"A": "To eliminate the need for human oversight in decision-making.", "B": "To ensure the AI system generates random outputs.", "C": "To align with legal regulations and protect data privacy.", "D": "To avoid the use of training data in AI systems."}, "ans": ["C"], "hook": "Compliance AI → legal, data privacy", "why": "Compliance đảm bảo hệ thống tuân thủ các quy định pháp lý và bảo vệ thông tin người dùng.", "trap": "A sai vì compliance không nhằm mục đích loại bỏ sự giám sát của con người."}, {"slide": 187, "q": "When setting up an Amazon Q Developer account, what is the initial step?", "opts": {"A": "Install the IDE plugin directly.", "B": "Register on the Amazon Q Developer portal.", "C": "Start using the AI tool without setup.", "D": "Link a GitHub repository before registering."}, "ans": ["B"], "hook": "Amazon Q setup → Register on portal", "why": "Việc đăng ký tài khoản trên cổng thông tin chính thức là bước xác thực bắt buộc trước khi có thể tích hợp vào IDE.", "trap": "A sai vì bạn cần tài khoản hợp lệ trên portal trước khi có thể cài đặt và kích hoạt plugin trong IDE."}, {"slide": 188, "q": "When is an association class needed?", "opts": {"A": "When the multiplicity of the relationship is many-to-many (N:M).", "B": "When the relationship is unidirectional.", "C": "When the relationship has properties.", "D": "When the relationship is mandatory.", "E": "When the relationship is optional."}, "ans": ["C"], "hook": "Association class → relationship has properties", "why": "Association class được dùng để lưu trữ các thuộc tính bổ sung của mối quan hệ giữa hai lớp.", "trap": "A sai vì quan hệ N:M chỉ cần class trung gian chứ không bắt buộc dùng association class."}, {"slide": 189, "q": "When testing a nested loop, we initially test the inner loop while holding the outer loop at", "opts": {"A": "its minimum value.", "B": "its middle value.", "C": "its maximum value.", "D": "both its minimum and maximum value.", "E": "any value."}, "ans": ["A"], "hook": "nested loop testing → inner first, outer at minimum", "why": "Để cô lập logic vòng lặp trong, ta cần giữ vòng lặp ngoài ở giá trị khởi tạo nhỏ nhất nhằm tránh các tương tác phức tạp từ đầu.", "trap": "C sai vì giá trị lớn nhất thường được dùng để kiểm tra biên của vòng lặp ngoài sau khi đã test xong vòng lặp trong."}, {"slide": 190, "q": "How does AI help with code refactoring?", "opts": {"A": "By identifying opportunities for simplification.", "B": "By skipping human oversight entirely.", "C": "By ensuring zero errors in refactored code.", "D": "By automatically rewriting all application logic."}, "ans": ["A"], "hook": "AI refactoring → identifying simplification opportunities", "why": "AI đóng vai trò trợ lý hỗ trợ phân tích và gợi ý các điểm cần cải thiện mã nguồn chứ không thay thế hoàn toàn tư duy con người.", "trap": "B sai vì AI không bao giờ được phép bỏ qua sự kiểm soát của con người trong quy trình phát triển phần mềm."}, {"slide": 191, "q": "How does Generative AI impact the code review process?", "opts": {"A": "By automating the detection of code inefficiencies.", "B": "By completely eliminating the need for manual reviews.", "C": "By guaranteeing code is free from all bugs.", "D": "By reviewing project architecture independently."}, "ans": ["A"], "hook": "GenAI code review → automating detection of inefficiencies", "why": "Công nghệ AI hỗ trợ tăng tốc độ và chất lượng bằng cách tự động quét các điểm chưa tối ưu trong mã nguồn.", "trap": "B sai vì AI chỉ hỗ trợ chứ không thay thế hoàn toàn được sự giám sát của con người."}, {"slide": 192, "q": "How should you format a prompt when writing new code using Amazon Q Developer?", "opts": {"A": "Write the code manually without involving the tool.", "B": "Describe the code functionality in natural language.", "C": "Wait for Amazon Q to suggest code without providing input.", "D": "Copy and paste code from another source into Amazon Q."}, "ans": ["B"], "hook": "Amazon Q prompt → describe in natural language", "why": "Để Amazon Q hiểu yêu cầu và tạo mã chính xác, bạn cần mô tả chức năng mong muốn thông qua ngôn ngữ tự nhiên.", "trap": "D sai vì việc sao chép mã nguồn khác không phải là cách tối ưu để ra lệnh cho AI tạo mã mới từ đầu."}, {"slide": 193, "q": "How does AI assist in improving code reviews?", "opts": {"A": "By ensuring code is always error-free", "B": "By eliminating the need for developer oversight", "C": "By automated code inspection", "D": "By managing all code deployments automatically"}, "ans": ["C"], "hook": "AI code review → automated code inspection", "why": "AI hỗ trợ rà soát mã nguồn bằng cách tự động phát hiện lỗi và đề xuất cải tiến thay vì thay thế hoàn toàn con người.", "trap": "A sai vì AI không thể đảm bảo code hoàn toàn không có lỗi."}, {"slide": 194, "q": "How do GenAI models learn to create new content?", "opts": {"A": "By identifying patterns and features within large datasets.", "B": "Through directly reproducing data from their training datasets.", "C": "Only prompts provided by users are used as input.", "D": "By producing content randomly without prior learning."}, "ans": ["A"], "hook": "GenAI → patterns and features", "why": "GenAI học bằng cách phân tích và trích xuất các đặc trưng từ dữ liệu khổng lồ để tạo nội dung mới thay vì sao chép.", "trap": "B sai vì mô hình không sao chép nguyên văn dữ liệu từ tập huấn luyện mà chỉ học cấu trúc của chúng."}, {"slide": 195, "q": "How does Amazon Q Developer help you refactor code?", "opts": {"A": "It deletes unused code without user approval.", "B": "It identifies redundant or inefficient sections in the code.", "C": "It ensures all bugs are fixed in the refactored code.", "D": "It automatically rewrites the entire application."}, "ans": ["B"], "hook": "Amazon Q refactor → identify redundant code", "why": "Amazon Q hỗ trợ phân tích và chỉ ra các đoạn mã dư thừa hoặc kém hiệu quả để lập trình viên tối ưu hóa.", "trap": "A sai vì AI không bao giờ tự ý xóa code mà không có sự phê duyệt của người dùng."}, {"slide": 196, "q": "How does Amazon Q explain code to developers?", "opts": {"A": "It breaks the code into smaller, understandable parts.", "B": "It focuses only on syntax without context.", "C": "It ignores the programming language of the code.", "D": "It guarantees a perfect understanding for all developers."}, "ans": ["A"], "hook": "Amazon Q explain → breaks code into smaller parts", "why": "Amazon Q sử dụng AI để phân tích và diễn giải các đoạn mã phức tạp thành những phần nhỏ logic giúp lập trình viên dễ nắm bắt hơn.", "trap": "D sai vì không có công cụ nào đảm bảo sự hiểu biết hoàn hảo tuyệt đối cho mọi lập trình viên."}, {"slide": 197, "q": "When using Generative AI tools for coding, few-shot prompting is often employed to achieve better results. What does few-shot prompting involve?", "opts": {"A": "Providing direct instructions without examples.", "B": "Providing a few examples to guide the AI's response.", "C": "Asking the AI to perform a task without providing examples.", "D": "Encouraging the AI to think step-by-step through a problem."}, "ans": ["B"], "hook": "few-shot prompting → providing a few examples", "why": "Kỹ thuật few-shot dựa trên việc đưa ra một số lượng nhỏ các mẫu đầu vào để AI học theo khuôn mẫu đó.", "trap": "A và C sai vì đây là mô tả của zero-shot prompting, tức là yêu cầu thực hiện mà không có ví dụ đi kèm."}, {"slide": 198, "q": "A state machine diagram responds to every event that", "opts": {"A": "occurs", "B": "occurs provided it is not processing an activity.", "C": "changes a value of the object's attributes.", "D": "triggers a transition.", "E": "sends a message."}, "ans": ["D"], "hook": "State machine → triggers a transition", "why": "Biểu đồ trạng thái chỉ phản ứng với các sự kiện làm thay đổi trạng thái hiện tại thông qua việc kích hoạt chuyển đổi.", "trap": "A sai vì không phải mọi sự kiện xảy ra đều tác động đến luồng trạng thái của đối tượng."}, {"slide": 199, "q": "A decision tree predicts loan approvals based on income, credit score, and employment history. Why might the model struggle with new data?", "opts": {"A": "It has too many features and splits, causing overfitting.", "B": "The features are beyond evaluation by a decision tree.", "C": "It has too few decision rules to make accurate predictions.", "D": "It uses the same rules for all customers, regardless of data."}, "ans": ["A"], "hook": "decision tree new data → overfitting, too many splits", "why": "Mô hình quá phức tạp với nhiều nhánh cây sẽ học thuộc lòng dữ liệu cũ thay vì tổng quát hóa cho dữ liệu mới.", "trap": "C sai vì thêm quy tắc không giải quyết được vấn đề dữ liệu mới mà chỉ làm mô hình phức tạp hơn."}, {"slide": 200, "q": "A technology company wants to scale its artificial intelligence (AI) model to manage increasing user demand and large datasets. During this process, it encounters system efficiency and data security challenges. What is the most critical issue the company needs to address?", "opts": {"A": "Reducing the size of training datasets to save resources.", "B": "Designing algorithms that prioritize efficiency over scalability.", "C": "Avoiding the use of distributed computing to keep costs low.", "D": "Ensuring data privacy and security at scale."}, "ans": ["D"], "hook": "Scale AI model → Data privacy and security", "why": "Khi mở rộng quy mô hệ thống AI, bảo mật dữ liệu là yêu cầu tiên quyết để đảm bảo tính toàn vẹn và tuân thủ pháp lý.", "trap": "A sai vì cắt giảm dữ liệu sẽ làm giảm độ chính xác và hiệu năng của mô hình AI."}, {"slide": 201, "q": "A milestone in a software development project is", "opts": {"A": "a management decision point.", "B": "a problem that delays the project.", "C": "the time at which a project starts.", "D": "the time at which a project completes.", "E": "a meeting with the client."}, "ans": ["A"], "hook": "Milestone → Management decision point", "why": "Milestone là các điểm kiểm soát quan trọng giúp quản lý đánh giá tiến độ và đưa ra quyết định tiếp theo.", "trap": "D sai vì project completion là kết thúc dự án chứ không phải là điểm kiểm soát trong quá trình."}, {"slide": 202, "q": "A design class is most cohesive when it", "opts": {"A": "is designed by only one person.", "B": "does not require database access.", "C": "has few dependencies to other classes.", "D": "is used in only one scenario of a use case.", "E": "has responsibilities that are closely related."}, "ans": ["E"], "hook": "Cohesive → responsibilities related", "why": "Tính gắn kết (cohesion) cao nhất khi một class tập trung thực hiện các nhiệm vụ có liên quan chặt chẽ với nhau.", "trap": "C sai vì ít phụ thuộc (low coupling) là đặc điểm của tính độc lập, không phải tính gắn kết."}, {"slide": 203, "q": "A retail company wants to optimize inventory management using AI. Which approach is most effective?", "opts": {"A": "Implement IoT devices for customer feedback collection.", "B": "Use predictive analytics to forecast demand.", "C": "Migrate data to an on-premises server.", "D": "Develop an AI chatbot to improve customer service."}, "ans": ["B"], "hook": "Inventory optimization → Predictive analytics", "why": "Dự báo nhu cầu chính xác giúp tối ưu hóa lượng hàng tồn kho hiệu quả nhất.", "trap": "D sai vì chatbot chỉ hỗ trợ khách hàng chứ không giúp quản lý tồn kho."}, {"slide": 204, "q": "An interface abstracts a module. Abstraction helps most in reducing the complexity of:", "opts": {"A": "designing the system.", "B": "building the system.", "C": "maintaining the system.", "D": "cost and time estimates for developing the system.", "E": "understanding the system."}, "ans": ["E"], "hook": "interface abstraction → understanding the system", "why": "Việc che giấu chi tiết cài đặt qua interface giúp người dùng dễ dàng nắm bắt chức năng mà không cần đọc hiểu toàn bộ mã nguồn phức tạp.", "trap": "A sai vì abstraction tập trung vào việc hiểu cấu trúc hiện tại hơn là quá trình tư duy thiết kế ban đầu."}, {"slide": 205, "q": "An event on a state machine diagram can represent", "opts": {"A": "the completion of an activity.", "B": "a return from a message send.", "C": "exiting a state.", "D": "the passage of a designated period of time.", "E": "a guard becoming true."}, "ans": ["D"], "hook": "Event trong State Machine → Time passage", "why": "Trong State Machine Diagram, sự kiện thời gian (Time Event) thể hiện việc một khoảng thời gian cụ thể đã trôi qua.", "trap": "A sai vì hoàn thành activity là hành động nội tại, không phải là event kích hoạt chuyển trạng thái."}, {"slide": 206, "q": "An interface encapsulates a module. Encapsulation helps most in reducing the complexity of:", "opts": {"A": "designing the system.", "B": "building the system.", "C": "maintaining the system.", "D": "cost and time estimates for developing the system.", "E": "understanding the system."}, "ans": ["C"], "hook": "Encapsulation → Maintenance", "why": "Đóng gói giúp tách biệt thay đổi trong module nên việc bảo trì, sửa lỗi sẽ không ảnh hưởng đến các phần khác.", "trap": "E sai vì đóng gói giúp cô lập logic bên trong, làm giảm sự hiểu biết cần thiết về chi tiết thực thi nhưng bảo trì mới là mục đích chính của việc giảm độ phức tạp."}, {"slide": 207, "q": "Basis path testing ensures that we have tested at least", "opts": {"A": "all interactions between programs.", "B": "all the ways of executing the loops in a program.", "C": "all the statements in a program.", "D": "all the data structures in a program.", "E": "all the inputs to a program."}, "ans": ["C"], "hook": "Basis path testing → all statements", "why": "Phương pháp này đảm bảo thực thi mọi câu lệnh ít nhất một lần bằng cách tính toán số đường đi độc lập tối thiểu.", "trap": "B sai vì việc kiểm thử mọi vòng lặp chỉ là một phần nhỏ của cấu trúc điều khiển mà basis path testing bao phủ."}, {"slide": 208, "q": "Black box testing uses test values at the boundaries of a subdomain because", "opts": {"A": "these values are easier for us to figure out.", "B": "this will make integrating components easier.", "C": "errors are more likely to occur here.", "D": "black box testing only works for such values.", "E": "these values can be given to us by the users."}, "ans": ["C"], "hook": "Boundary values → errors likely to occur", "why": "Các lỗi phần mềm thường xuất hiện tại điểm biên của miền giá trị thay vì ở giữa.", "trap": "A sai vì giá trị biên không phải lúc nào cũng dễ xác định hơn giá trị thường."}, {"slide": 209, "q": "Could reviews or inspections be considered part of testing?", "opts": {"A": "No, because they are normally applied before testing.", "B": "Yes, because both help detect faults and improve quality.", "C": "Yes, because testing includes all non-constructive activities.", "D": "No, because they do not apply to the test documentation.", "E": "No, because they are beyond the development plan."}, "ans": ["B"], "hook": "reviews/inspections → Yes, both detect faults", "why": "Cả review và testing đều là kỹ thuật kiểm chứng giúp phát hiện sớm khiếm khuyết để nâng cao chất lượng phần mềm.", "trap": "A sai vì dù thực hiện trước nhưng review vẫn được coi là một dạng kiểm thử tĩnh."}, {"slide": 210, "q": "Defensive programming means that you", "opts": {"A": "do not let anyone else read your code", "B": "do not let input data crash your program", "C": "do not let anyone else change your code", "D": "do not use object-oriented programming languages", "E": "do not let anyone else test your code"}, "ans": ["B"], "hook": "defensive programming → not let input crash program", "why": "Kỹ thuật này tập trung vào việc xử lý dữ liệu đầu vào không hợp lệ để đảm bảo hệ thống vẫn hoạt động ổn định thay vì bị treo.", "trap": "A, C, E sai vì đây là các biện pháp bảo mật hoặc quản lý dự án, không liên quan đến kỹ thuật lập trình phòng thủ."}, {"slide": 211, "q": "Having quality design goals is of most help in reducing the complexity of:", "opts": {"A": "designing the system.", "B": "building the system.", "C": "maintaining the system.", "D": "cost and time estimates for developing the system.", "E": "understanding the system."}, "ans": ["A"], "hook": "quality design goals → reducing complexity of designing", "why": "Mục tiêu thiết kế tốt ngay từ đầu giúp đơn giản hóa quá trình kiến trúc và xây dựng cấu trúc hệ thống.", "trap": "E sai vì mục tiêu thiết kế giúp tạo ra hệ thống đơn giản chứ không trực tiếp làm việc hiểu hệ thống trở nên dễ dàng hơn."}, {"slide": 212, "q": "Is it possible for there to be more than one association between any two classes?", "opts": {"A": "Yes, always.", "B": "Yes, but only for binary and higher order associations.", "C": "Yes, if the multiplicity is many to many (N:M).", "D": "No, no way.", "E": "Gee, I don't know!"}, "ans": ["A"], "hook": "two classes → yes, multiple associations always possible", "why": "UML cho phép tạo nhiều association giữa hai lớp nếu chúng biểu diễn các vai trò hoặc ý nghĩa khác nhau trong hệ thống.", "trap": "D sai vì mô hình UML không giới hạn số lượng mối quan hệ giữa các cặp đối tượng."}, {"slide": 213, "q": "In a neural network, what happens when the input data is processed through the layers?", "opts": {"A": "The data is stored in memory for future use.", "B": "Patterns and features are extracted to make predictions.", "C": "The network generates random outputs unrelated to the input.", "D": "It immediately results in a final decision."}, "ans": ["B"], "hook": "Neural network → Patterns and features extraction", "why": "Mạng thần kinh hoạt động bằng cách học và trích xuất đặc trưng từ dữ liệu đầu vào để dự đoán kết quả.", "trap": "D sai vì mạng thần kinh cần qua nhiều lớp xử lý mới đưa ra kết quả cuối cùng chứ không tức thì."}, {"slide": 214, "q": "In the UML the multiplicity of an association specifies", "opts": {"A": "which classes can be related to each other.", "B": "how many classes participate in the association.", "C": "the navigability of the association.", "D": "the number of objects that must/can be related.", "E": "whether role names are required."}, "ans": ["D"], "hook": "multiplicity → number of objects", "why": "Multiplicity trong UML xác định số lượng thực thể của một lớp có thể liên kết với một thực thể của lớp khác.", "trap": "B sai vì multiplicity đếm số lượng object cụ thể chứ không phải đếm số lượng class tham gia vào mối quan hệ."}, {"slide": 215, "q": "In the context of digital transformation, organizations increasingly rely on AI to enhance operations. Which of the following best describes AI's contribution to this transformation?", "opts": {"A": "Replacing all human roles in an organization", "B": "Reducing the importance of change management", "C": "Automating processes to improve efficiency", "D": "Eliminating the need for data in decision-making"}, "ans": ["C"], "hook": "AI contribution → Automating processes", "why": "AI đóng vai trò cốt lõi trong chuyển đổi số bằng cách tự động hóa các quy trình lặp đi lặp lại để tối ưu hóa hiệu suất vận hành của tổ chức.", "trap": "A sai vì AI chỉ hỗ trợ hoặc thay thế một phần chứ không thể thay thế hoàn toàn mọi vai trò của con người."}, {"slide": 216, "q": "In software engineering, we build models of a software system to:", "opts": {"A": "reduce the workload of the project team.", "B": "help us deal with the complexity of a problem.", "C": "reduce the amount of communication with users.", "D": "know which people to hire into the project team.", "E": "know which language to use for implementation."}, "ans": ["B"], "hook": "Software modeling → deal with complexity", "why": "Mô hình hóa giúp đơn giản hóa hệ thống phức tạp để con người dễ hiểu và quản lý hơn.", "trap": "A sai vì mô hình hóa không trực tiếp giảm khối lượng công việc cho đội dự án."}, {"slide": 217, "q": "In the Model-View-Controller (MVC) architectural pattern, the Model represents", "opts": {"A": "the objects used to render data in the user interface.", "B": "the process control mechanism used by the system.", "C": "the controls with which the user interacts.", "D": "the data viewed and manipulated by the user.", "E": "the business logic of the application."}, "ans": ["D"], "hook": "Model → data", "why": "Model đóng vai trò là nơi lưu trữ dữ liệu và các quy tắc nghiệp vụ liên quan đến dữ liệu đó.", "trap": "E sai vì business logic thường là phần xử lý nằm giữa Model và Controller trong các kiến trúc phức tạp hơn."}, {"slide": 218, "q": "Integration testing focuses on", "opts": {"A": "the flow of control in a component.", "B": "the logical conditions in a component.", "C": "validating user requirements.", "D": "the interaction among the components.", "E": "integrating a database with the software system."}, "ans": ["D"], "hook": "Integration → interaction among components", "why": "Kiểm thử tích hợp tập trung vào việc kiểm tra cách các thành phần riêng lẻ phối hợp và tương tác với nhau khi được ghép nối.", "trap": "C sai vì validating user requirements là mục tiêu của Acceptance testing chứ không phải Integration testing."}, {"slide": 219, "q": "One purpose of system analysis and design is to", "opts": {"A": "determine the cost of developing the system.", "B": "determine the time required to implement the system.", "C": "capture the system's nonfunctional requirements.", "D": "adapt the requirements to the implementation environment.", "E": "obtain the client's approval for developing the system."}, "ans": ["D"], "hook": "System analysis → adapt requirements", "why": "Mục tiêu của phân tích thiết kế là điều chỉnh các yêu cầu nghiệp vụ sao cho phù hợp với môi trường kỹ thuật và công nghệ thực tế.", "trap": "A sai vì xác định chi phí thuộc về quản lý dự án, không phải mục đích cốt lõi của việc thiết kế hệ thống."}, {"slide": 220, "q": "The primary purpose of refactoring code is to", "opts": {"A": "reduce the number of input parameters.", "B": "isolate bugs by rewriting the code.", "C": "add assertions to the code.", "D": "improve the internal structure of the code.", "E": "improve the interaction among components."}, "ans": ["D"], "hook": "Refactoring → Improve internal structure", "why": "Refactoring tập trung vào việc cải thiện cấu trúc mã nguồn mà không làm thay đổi hành vi bên ngoài của hệ thống.", "trap": "B sai vì việc sửa code để tìm lỗi là debugging chứ không phải refactoring."}, {"slide": 221, "q": "The purpose of software testing is to show that", "opts": {"A": "the software has no defects (bugs).", "B": "the program code is well structured.", "C": "the software has a good architecture.", "D": "the software is of good quality.", "E": "the software has defects (bugs)."}, "ans": ["E"], "hook": "purpose of testing → has defects", "why": "Kiểm thử phần mềm được thiết kế để tìm ra lỗi thay vì chứng minh sự vắng mặt của lỗi.", "trap": "A sai vì không có quá trình kiểm thử nào có thể khẳng định phần mềm hoàn toàn sạch lỗi."}, {"slide": 222, "q": "The purpose of data flow testing is to ensure the correctness of values", "opts": {"A": "stored by a program into a database.", "B": "that move into and out of a database.", "C": "that pass through a user interface.", "D": "of program variables.", "E": "output by a program."}, "ans": ["D"], "hook": "Data flow testing → Program variables", "why": "Data flow testing tập trung kiểm soát vòng đời và giá trị của các biến từ lúc khởi tạo đến khi sử dụng trong mã nguồn.", "trap": "A sai vì kiểm thử luồng dữ liệu không giới hạn phạm vi vào cơ sở dữ liệu mà tập trung vào logic tính toán bên trong chương trình."}, {"slide": 223, "q": "The cyclomatic complexity of a program can tell us something about which of the following external attributes (design goals) of software quality?", "opts": {"A": "usability - how easy it is to use", "B": "learnability - how easy it is to learn how to use", "C": "safety - how likely it is to be error free", "D": "integrity - how well it prevents unauthorized access", "E": "installability - how easy it is to install"}, "ans": ["C"], "hook": "cyclomatic complexity → safety, error free", "why": "Độ phức tạp chương trình càng cao thì khả năng phát sinh lỗi càng lớn, ảnh hưởng trực tiếp đến tính an toàn của phần mềm.", "trap": "A sai vì usability phụ thuộc vào giao diện người dùng chứ không phải độ phức tạp logic bên trong code."}, {"slide": 224, "q": "The Mediator design pattern is used to", "opts": {"A": "provide a unified interface to a subsystem.", "B": "provide a placeholder for another object.", "C": "decouple an abstraction from its implementation.", "D": "restrict a class to have only one instance.", "E": "encapsulate how a set of objects interact."}, "ans": ["E"], "hook": "Mediator → encapsulate interaction", "why": "Mediator đóng vai trò trung gian giúp các đối tượng không cần gọi trực tiếp nhau mà thông qua một bộ điều phối tập trung.", "trap": "A sai vì mô tả chức năng của Facade pattern nhằm cung cấp giao diện thống nhất cho hệ thống con."}, {"slide": 225, "q": "The Strategy design pattern is used to", "opts": {"A": "defer instantiation of a class to its subclasses.", "B": "provide a placeholder for another object.", "C": "decouple an abstraction from its implementation.", "D": "restrict a class to have only one instance.", "E": "encapsulate an interchangeable family of algorithms"}, "ans": ["E"], "hook": "Strategy → family of algorithms", "why": "Strategy cho phép đóng gói một nhóm các thuật toán có thể thay thế lẫn nhau để thay đổi hành vi tại thời điểm thực thi.", "trap": "C sai vì decouple abstraction và implementation là định nghĩa của Bridge pattern."}, {"slide": 226, "q": "The Observer design pattern is used to", "opts": {"A": "defer instantiation of a class to its subclasses.", "B": "provide a placeholder for another object.", "C": "notify other objects about updates.", "D": "encapsulate how a set of objects interact.", "E": "decouple an abstraction from its implementation."}, "ans": ["C"], "hook": "Observer → notify updates", "why": "Design pattern Observer được thiết kế để định nghĩa mối quan hệ một-nhiều giữa các đối tượng sao cho khi một đối tượng thay đổi trạng thái thì tất cả các đối tượng phụ thuộc của nó đều được thông báo và tự động cập nhật.", "trap": "D sai vì encapsulate how a set of objects interact là định nghĩa của Mediator pattern chứ không phải Observer."}, {"slide": 227, "q": "Testing every statement in a program guarantees that all defects (bugs) will be found.", "opts": {"A": "Yes, definitely!", "B": "Yes, but only for simple programs.", "C": "Yes, but only for programs using object-oriented languages.", "D": "No, no way!!", "E": "Gee, I don't know??"}, "ans": ["D"], "hook": "statement coverage → No, does NOT guarantee all defects found", "why": "Việc thực thi mọi câu lệnh không thể phát hiện các lỗi logic tiềm ẩn hoặc các trường hợp dữ liệu chưa được kiểm thử.", "trap": "A sai vì testing không bao giờ tìm được 100% mọi lỗi (exhaustively testing)."}, {"slide": 229, "q": "What is the primary role of data in digital transformation?", "opts": {"A": "To analyze only historical trends without real-time processing.", "B": "To store large volumes of information in physical hard drives.", "C": "To replace traditional IT systems with cloud solutions.", "D": "To provide insights that drive informed decision-making and improve efficiency."}, "ans": ["D"], "hook": "Digital transformation → insights drive decisions", "why": "Dữ liệu là tài sản chiến lược giúp doanh nghiệp hiểu rõ tình hình thực tế để đưa ra các quyết định chính xác và tối ưu quy trình.", "trap": "A sai vì chuyển đổi số đòi hỏi khả năng xử lý dữ liệu thời gian thực thay vì chỉ nhìn vào quá khứ."}, {"slide": 230, "q": "What is one of the key benefits of using AI tools like Amazon Q Developer in software development?", "opts": {"A": "AI completely eliminates the need for human input in coding.", "B": "AI ensures code will never have bugs or need refactoring.", "C": "AI tools can independently decide and implement architectural designs.", "D": "AI tools provide instant code explanations and suggest optimizations."}, "ans": ["D"], "hook": "AI tools → code explanations and optimizations", "why": "Công cụ AI hỗ trợ lập trình viên bằng cách phân tích mã nguồn và đưa ra các gợi ý cải tiến hiệu quả.", "trap": "A sai vì AI chỉ là công cụ hỗ trợ chứ không thay thế hoàn toàn tư duy của con người."}, {"slide": 231, "q": "What is the best way to refactor the following verbose switch statement to improve code readability and maintainability?\n\nswitch(day) {\n    case \"Monday\":\n        System.out.println(\"Start of the week\");\n        break;\n    case \"Friday\":\n        System.out.println(\"End of the workweek\");\n        break;\n    default:\n        System.out.println(\"Midweek\");\n}", "opts": {"A": "Replace the switch statement with an enum and method call.", "B": "Convert it into nested if-else statements.", "C": "Leave it as is since switch statements are always optimal.", "D": "Add more case statements for all days of the week."}, "ans": ["A"], "hook": "verbose switch → replace with enum", "why": "Sử dụng Enum kết hợp đa hình giúp loại bỏ switch, giúp mã nguồn sạch hơn và dễ mở rộng khi thêm ngày mới.", "trap": "B sai vì nested if-else khiến code trở nên rối rắm và khó bảo trì hơn so với switch ban đầu."}, {"slide": 232, "q": "What is the most apparent issue in the following Java code snippet that could be optimized to improve efficiency?\n\npublic void processOrder() {\n    synchronized(this) {\n        System.out.println(\"Processing Order\");\n    }\n    synchronized(this) {\n        System.out.println(\"Finalizing Order\");\n    }\n}", "opts": {"A": "Incorrect use of the 'this' keyword", "B": "Missing exception handling", "C": "Redundant synchronization blocks", "D": "Uninitialized variables"}, "ans": ["C"], "hook": "synchronized blocks → redundant synchronization", "why": "Việc dùng nhiều khối đồng bộ hóa liên tiếp trên cùng một đối tượng gây lãng phí tài nguyên và làm giảm hiệu năng thực thi.", "trap": "A sai vì từ khóa this được dùng đúng mục đích tham chiếu đến đối tượng hiện tại."}, {"slide": 233, "q": "What is the primary purpose of using AI for Java documentation?", "opts": {"A": "To automatically generate and maintain up-to-date technical documentation from code.", "B": "To assist developers in generating comprehensive documentation without manual effort.", "C": "To ensure code quality by reviewing and identifying potential errors.", "D": "To replace developers in writing project documentation entirely."}, "ans": ["A"], "hook": "AI documentation → auto-generate and maintain docs", "why": "Mục đích cốt lõi của AI trong tài liệu là duy trì sự đồng bộ giữa mã nguồn và tài liệu kỹ thuật một cách tự động.", "trap": "B sai vì việc hỗ trợ con người chỉ là phương tiện, không phải mục tiêu chính về tính đồng bộ kỹ thuật."}, {"slide": 234, "q": "What is the primary impact of using Generative AI in automating code reviews?", "opts": {"A": "To identify potential errors and suggest improving code quality.", "B": "To fully replace developers in the code review process.", "C": "To generate automated unit tests for code.", "D": "To eliminate the need for manual testing in development workflows."}, "ans": ["A"], "hook": "GenAI code review → identify errors, improve quality", "why": "Công cụ AI đóng vai trò hỗ trợ con người trong việc phát hiện lỗi và tối ưu chất lượng mã nguồn thay vì thay thế hoàn toàn.", "trap": "B sai vì AI chỉ hỗ trợ chứ không thể thay thế hoàn toàn tư duy và trách nhiệm của lập trình viên."}, {"slide": 235, "q": "What is a key ethical concern when using Generative AI tools like Amazon Q Developer for software development?", "opts": {"A": "AI-generated code is always free from logical errors.", "B": "AI tools are incapable of improving productivity.", "C": "AI eliminates the need for developer oversight.", "D": "AI tools may generate code resembling copyrighted or proprietary material."}, "ans": ["D"], "hook": "Generative AI → copyrighted material", "why": "AI tạo mã nguồn dựa trên dữ liệu huấn luyện có sẵn nên có nguy cơ vi phạm bản quyền hoặc sao chép tài sản trí tuệ của bên khác.", "trap": "C sai vì AI chỉ hỗ trợ chứ không bao giờ thay thế được sự giám sát của lập trình viên để đảm bảo an toàn và logic."}, {"slide": 236, "q": "What is a significant risk associated with deepfake video technology?", "opts": {"A": "It can create realistic but false videos, potentially leading to fraud or misinformation.", "B": "It can crash a financial system.", "C": "The creation of a deepfake places significant strain on computer hardware, which may pose a risk of system damage.", "D": "It can corrupt the data integrity in artificial intelligence models."}, "ans": ["A"], "hook": "deepfake → fraud, misinformation", "why": "Công nghệ này tạo ra video giả mạo giống thật để đánh lừa người xem và lan truyền tin tức giả.", "trap": "B sai vì deepfake tác động đến nhận thức con người chứ không trực tiếp làm sập hệ thống tài chính."}, {"slide": 237, "q": "What is the primary difference between Generative AI and Discriminative AI?", "opts": {"A": "Both Generative and Discriminative AI focus only on data classification.", "B": "Generative AI predicts outcomes, while Discriminative AI generates new content.", "C": "Discriminative AI is faster than Generative AI in creating content.", "D": "Generative AI creates new data, while Discriminative AI predicts or classifies existing data."}, "ans": ["D"], "hook": "Generative vs Discriminative → creates new vs classifies existing", "why": "Generative tập trung tạo ra dữ liệu mới từ phân phối xác suất còn Discriminative tập trung phân biệt ranh giới giữa các lớp dữ liệu.", "trap": "B sai vì đảo ngược chức năng giữa hai mô hình tạo nội dung và dự đoán kết quả."}, {"slide": 238, "q": "What is one key feature of GitHub Copilot that enhances Java development in IntelliJ?", "opts": {"A": "Automatically generating production-ready Java applications without any input.", "B": "Writing comprehensive test cases without developer intervention.", "C": "Automatically deploying Java applications to production.", "D": "Managing deployment pipelines directly from IntelliJ."}, "ans": ["A"], "hook": "GitHub Copilot → auto-generating Java code", "why": "Copilot hỗ trợ lập trình viên bằng cách gợi ý và tạo mã nguồn dựa trên ngữ cảnh công việc.", "trap": "B sai vì Copilot không thể tự viết toàn bộ test case mà không cần sự điều chỉnh từ người dùng."}, {"slide": 239, "q": "What is a \"contextual prompt\" in Generative AI tools?", "opts": {"A": "A debugging technique for code reviews.", "B": "A prompt that uses minimal input to guess the context.", "C": "A prompt that includes background information to help the AI provide accurate answers.", "D": "A repetitive command used to train the AI further."}, "ans": ["C"], "hook": "contextual prompt → includes background information", "why": "Contextual prompt là kỹ thuật cung cấp ngữ cảnh chi tiết giúp AI hiểu rõ yêu cầu và phản hồi chính xác hơn.", "trap": "B sai vì đó là cách tiếp cận tối giản (minimal), ngược lại hoàn toàn với việc cung cấp đầy đủ ngữ cảnh."}, {"slide": 240, "q": "What is the primary goal of digital transformation in businesses?", "opts": {"A": "To integrate digital technologies to improve efficiency and deliver value.", "B": "To use digital tools for marketing purposes.", "C": "To focus on the creation of a digital virtual reality space for businesses.", "D": "To focus solely on creating new software applications."}, "ans": ["A"], "hook": "Digital transformation → efficiency and value", "why": "Chuyển đổi số là quá trình áp dụng công nghệ vào mọi khía cạnh doanh nghiệp nhằm tối ưu vận hành và gia tăng giá trị cho khách hàng.", "trap": "D sai vì chuyển đổi số là sự thay đổi toàn diện mô hình kinh doanh chứ không chỉ là việc viết thêm phần mềm."}, {"slide": 241, "q": "What is the primary purpose of a neural network in machine learning?", "opts": {"A": "To process inputs and learn patterns for making predictions or decisions.", "B": "To make decisions based on rules put in the programming, resulting in a leaf node.", "C": "To teach new information to humans using videos and the internet.", "D": "To combine the results of multiple trees into an averaged result."}, "ans": ["A"], "hook": "Neural network → learn patterns for predictions", "why": "Neural network mô phỏng mạng thần kinh để học các mẫu phức tạp từ dữ liệu nhằm đưa ra dự đoán.", "trap": "B sai vì đó là đặc điểm của Decision Tree, không phải Neural network."}, {"slide": 242, "q": "What is the key advantage of using random forests over a single decision tree?", "opts": {"A": "Random forests reduce overfitting by combining multiple decision trees.", "B": "Random forests are simpler to interpret than decision trees.", "C": "Random forests require no data to make predictions.", "D": "Random forests always generate a single, static model."}, "ans": ["A"], "hook": "random forests → reduce overfitting, combining multiple trees", "why": "Kỹ thuật ensemble của nhiều cây giúp trung hòa sai số và tăng tính tổng quát cho mô hình.", "trap": "B sai vì Random forest phức tạp và khó giải thích hơn nhiều so với một cây đơn lẻ."}, {"slide": 243, "q": "What is the primary function of a decision tree in Machine Learning?", "opts": {"A": "To replicate the neural structure of a human brain.", "B": "To store data for future analysis.", "C": "To split data into branches based on feature values to make decisions.", "D": "To predict random outcomes without patterns."}, "ans": ["C"], "hook": "Decision tree → split data into branches", "why": "Cấu trúc cây quyết định hoạt động bằng cách phân tách tập dữ liệu thành các nhánh nhỏ dựa trên các giá trị đặc trưng để đưa ra kết luận.", "trap": "A sai vì mô tả cơ chế của Neural Networks chứ không phải Decision tree."}, {"slide": 244, "q": "What is the primary relationship between AI and Machine Learning (ML)?", "opts": {"A": "ML is another term for AI, and they mean the same thing.", "B": "AI is a subset of ML.", "C": "ML is a subset of AI that enables computers to learn from data.", "D": "AI and ML are independent technologies with no relationship."}, "ans": ["C"], "hook": "AI → ML subset → Learn from data", "why": "Machine Learning là một lĩnh vực con của trí tuệ nhân tạo tập trung vào việc huấn luyện hệ thống tự học từ dữ liệu thay vì lập trình cứng.", "trap": "B sai vì bị ngược phân cấp khi khẳng định AI nằm trong ML."}, {"slide": 245, "q": "What are the key benefits of using GitHub Copilot for Java development? (Select all that apply)", "opts": {"A": "Replaces the need for learning Java syntax and best practices.", "B": "Helps generate code based on comments or descriptions.", "C": "Assists with debugging by recommending fixes for errors.", "D": "Accelerates coding by suggesting entire functions and methods."}, "ans": ["B", "C", "D"], "hook": "GitHub Copilot → generate code, debugging fixes, suggest functions", "why": "Công cụ này hỗ trợ lập trình viên thông qua việc tự động tạo code, đề xuất sửa lỗi và hoàn thiện các hàm phức tạp.", "trap": "A sai vì AI chỉ hỗ trợ chứ không thay thế hoàn toàn việc học cú pháp và kiến thức nền tảng của lập trình viên."}, {"slide": 246, "q": "What are the benefits of using Generative AI tools like Amazon Q Developer in Java development?\n(Select all that apply)", "opts": {"A": "Complete elimination of manual coding.", "B": "Early error detection and suggestions for fixes.", "C": "Increased coding efficiency through the automation of repetitive tasks.", "D": "Learning support for beginner developers."}, "ans": ["B", "C", "D"], "hook": "AI tool benefits → early, efficiency, learning", "why": "Công cụ Generative AI hỗ trợ lập trình viên tối ưu hóa quy trình làm việc thông qua việc tự động hóa, sửa lỗi và cung cấp tài liệu học tập thay vì thay thế hoàn toàn con người.", "trap": "A sai vì AI hiện tại chỉ hỗ trợ (assist) chứ chưa thể thay thế hoàn toàn việc viết mã thủ công (complete elimination)."}, {"slide": 247, "q": "Which of the following is not likely to contribute to the complexity of software development?", "opts": {"A": "The vocabulary of the application domain", "B": "The number and size of the programs that need to be implemented", "C": "The nature of the application domain", "D": "A large development team", "E": "Insufficient hardware resources"}, "ans": ["E"], "hook": "software complexity NOT → NOT insufficient hardware", "why": "Độ phức tạp phần mềm được định nghĩa bởi các yếu tố nội tại của hệ thống như yêu cầu, dữ liệu và quy trình, trong khi tài nguyên phần cứng chỉ là môi trường vận hành bên ngoài.", "trap": "D sai vì quy mô đội ngũ lớn thường làm tăng độ phức tạp trong quản lý và giao tiếp dự án."}, {"slide": 248, "q": "Which of the following best explains the difference between Artificial Intelligence (AI) and Machine Learning (ML)?", "opts": {"A": "AI is a subset of ML, where AI focuses on making predictions while ML focuses on decision-making.", "B": "AI and ML are unrelated technologies that solve different problems.", "C": "ML is a subset of AI, where ML helps computers learn from data to make decisions or predictions.", "D": "AI refers to the technology used only to create robots that look like humans."}, "ans": ["C"], "hook": "AI vs ML → ML is a subset of AI", "why": "Machine Learning là một nhánh kỹ thuật nằm trong phạm vi rộng lớn hơn của trí tuệ nhân tạo nhằm tối ưu hóa học máy từ dữ liệu.", "trap": "A sai vì AI là tập mẹ chứa ML chứ không phải ngược lại."}, {"slide": 249, "q": "Which of the following is a benefit of the Waterfall software development process?", "opts": {"A": "It is easier to deal with vague user requirements.", "B": "It develops the system incrementally.", "C": "It is easier to find people with the required development skills.", "D": "It makes the software development process more disciplined.", "E": "It makes it easier to get user feedback early in the project development."}, "ans": ["D"], "hook": "Waterfall → disciplined", "why": "Mô hình Waterfall yêu cầu quy trình nghiêm ngặt theo từng giai đoạn cố định và có hệ thống tài liệu rõ ràng nên tính kỷ luật rất cao.", "trap": "B sai vì Waterfall phát triển theo dạng tuần tự chứ không phải tăng trưởng theo từng phần như Incremental."}, {"slide": 250, "q": "Which of the following is a key ethical concern associated with generative AI?", "opts": {"A": "The risk of diminishing human creativity, such as singing, due to AI's ability to compose songs.", "B": "The potential for bias in AI-generated content.", "C": "The concern about developers profiting significantly from users of GenAI.", "D": "Its inability to automate tasks without human input."}, "ans": ["B"], "hook": "Generative AI → bias in content", "why": "Dữ liệu huấn luyện bị định kiến khiến mô hình tạo ra các kết quả sai lệch hoặc phân biệt đối xử.", "trap": "A sai vì sự sáng tạo của con người là lo ngại về văn hóa thay vì là một vấn đề đạo đức kỹ thuật cốt lõi."}, {"slide": 251, "q": "Which of the following best describes the role of AI in automating Java code refactoring?", "opts": {"A": "Improves code readability and performance by suggesting cleaner implementations.", "B": "Rewrite the entire application in a different programming language.", "C": "Automatically generates test cases for the codebase.", "D": "Identifies bugs and fixes them in the code."}, "ans": ["A"], "hook": "Refactoring AI → Clean code readability", "why": "Mục tiêu chính của refactoring là cải thiện cấu trúc và khả năng đọc hiểu của mã nguồn mà không làm thay đổi hành vi bên ngoài.", "trap": "C sai vì tạo test cases là nhiệm vụ của automated testing chứ không phải quá trình refactoring."}, {"slide": 252, "q": "Which of the following scenarios best describes how a neural network adjusts its weights during training?", "opts": {"A": "The network adjusts weights randomly to improve accuracy.", "B": "Weights are fixed during training to avoid instability.", "C": "Weights are updated based on feedback from the error rate or prediction error.", "D": "The output layer directly updates all weights in the network."}, "ans": ["C"], "hook": "Training weights → Error feedback update", "why": "Quá trình huấn luyện sử dụng thuật toán lan truyền ngược để điều chỉnh trọng số nhằm giảm thiểu sai số dự đoán.", "trap": "A sai vì trọng số được cập nhật dựa trên toán học tối ưu hóa chứ không phải thay đổi ngẫu nhiên."}, {"slide": 253, "q": "Which of the following is a benefit of having a software development process?", "opts": {"A": "It is not necessary to train the developers.", "B": "We have to gathe
