<script>
const DATA = [{"slide": 5, "q": "Which of the following are commonly recognized design patterns in software development?", "opts": {"A": "Singleton Pattern", "B": "Factory Pattern", "C": "Decorator Pattern", "D": "Provisional Pattern", "E": "Exclusive Pattern"}, "ans": ["A", "B", "C"], "hook": "design patterns → Singleton, Factory, Decorator", "why": "Đây là ba mẫu thiết kế kinh điển và cực kỳ phổ biến trong nhóm Gang of Four (GoF) design patterns.", "trap": "D và E sai vì Provisional và Exclusive không phải là các mẫu thiết kế chuẩn trong công nghệ phần mềm."}, {"slide": 7, "q": "What are some ethical considerations when deploying AI systems?", "opts": {"A": "Bias in AI algorithms.", "B": "Privacy and data protection.", "C": "AI's inability to perform complex calculations.", "D": "Job displacement and economic impacts.", "E": "The color of the AI interface."}, "ans": ["A", "B", "D"], "hook": "ethical considerations → Bias, Privacy, Job displacement", "why": "Đạo đức trong triển khai AI liên quan trực tiếp đến sự thiên vị thuật toán, bảo mật dữ liệu người dùng và tác động mất việc làm của người lao động.", "trap": "C sai vì đây là giới hạn kỹ thuật của AI chứ không thuộc phạm trù đạo đức xã hội."}, {"slide": 8, "q": "What are the components of a decision tree?", "opts": {"A": "Nodes, which represent features or decisions.", "B": "Edges, which represent the outcome of a decision at a node.", "C": "Leaves, which represent final decisions or predictions.", "D": "Layers, which stack to increase the tree's height."}, "ans": ["A", "B", "C"], "hook": "decision tree components → Nodes, Edges, Leaves", "why": "Cấu trúc của một cây quyết định luôn bao gồm các nút để biểu diễn thuộc tính hoặc quyết định, các cạnh để chỉ ra kết quả lựa chọn và các lá để chứa kết quả dự đoán cuối cùng.", "trap": "D sai vì Layers là thành phần đặc trưng của mạng nơ-ron nhân tạo chứ không thuộc cấu trúc của cây quyết định."}, {"slide": 9, "q": "Which of the following are critical steps in evaluating the effectiveness of test cases in a software application?", "opts": {"A": "Assess code coverage to ensure comprehensive testing.", "B": "Review test case outcomes against expected results.", "C": "Increase the number of test cases irrespective of relevance.", "D": "Analyze test case execution time and resource usage.", "E": "Focus solely on the UI aspects of the application."}, "ans": ["A", "B", "D"], "hook": "test case effectiveness → code coverage, outcomes, execution time", "why": "Đánh giá hiệu quả test case cần xem xét mức độ bao phủ mã, kết quả thực tế so với mong đợi và hiệu suất chạy test.", "trap": "C sai vì tăng số lượng test case mà không quan tâm đến sự liên quan không đảm bảo hiệu quả, thậm chí có thể lãng phí tài nguyên."}, {"slide": 10, "q": "Which of the following are valid ways AI tools can enhance Java development workflows? Select 3 correct answers.", "opts": {"A": "Automating code refactoring tasks", "B": "Generating unit tests automatically", "C": "Completely replacing human developers", "D": "Providing intelligent code suggestions", "E": "Removing the need for code reviews"}, "ans": ["A", "B", "D"], "hook": "AI tools Java development → Automating, Generating, Providing", "why": "Các công cụ AI hiện nay chỉ đóng vai trò hỗ trợ tăng năng suất thông qua tự động hóa tái cấu trúc, sinh test case và gợi ý code chứ chưa thể thay thế hoàn toàn con người hay loại bỏ quy trình kiểm duyệt code.", "trap": "C và E sai vì AI hiện tại không thể thay thế hoàn toàn lập trình viên hay loại bỏ bước code review vốn cực kỳ quan trọng để đảm bảo chất lượng hệ thống."}, {"slide": 11, "q": "Which of the following statements about the Strategy Pattern are true?", "opts": {"A": "It provides a way to choose algorithms at runtime.", "B": "It encapsulates varying behaviors in classes.", "C": "It restricts the use of inheritance.", "D": "It keeps the algorithm implementation independent of client classes.", "E": "It forces all classes to implement the same interface."}, "ans": ["A", "B", "D"], "hook": "Strategy Pattern → choose runtime, encapsulate behaviors, independent client", "why": "Strategy Pattern cho phép thay đổi thuật toán linh hoạt lúc chạy bằng cách đóng gói các hành vi khác nhau vào các lớp riêng biệt, giúp thuật toán độc lập với lớp sử dụng nó.", "trap": "C sai vì Strategy Pattern thực tế khuyến khích sự kết hợp thay vì kế thừa nhưng nó không hề cấm đoán hay giới hạn việc sử dụng kế thừa trong toàn bộ hệ thống."}, {"slide": 12, "q": "Which metrics are commonly used to measure software quality?", "opts": {"A": "Defect density", "B": "Market share growth", "C": "Code churn rate", "D": "Employee satisfaction index", "E": "Mean time to failure"}, "ans": ["A", "C", "E"], "hook": "Software Quality → Defect, Churn, Failure", "why": "Các metric phổ biến đo chất lượng phần mềm bao gồm mật độ lỗi (Defect density), tốc độ thay đổi code (Code churn rate) và thời gian trung bình đến lỗi (Mean time to failure).", "trap": "B sai vì Market share growth đo lường sự phát triển thị trường, không phải chất lượng phần mềm; D sai vì Employee satisfaction index đo lường sự hài lòng của nhân viên, không phải chất lượng phần mềm."}, {"slide": 13, "q": "Which components are essential in constructing a comprehensive use-case model?", "opts": {"A": "Actors", "B": "Scenarios", "C": "System boundaries", "D": "Database schemas"}, "ans": ["A", "B", "C"], "hook": "comprehensive use-case model → Actors, Scenarios, System boundaries", "why": "Một mô hình use case toàn diện cần có tác nhân tương tác, các kịch bản luồng công việc và ranh giới xác định phạm vi của hệ thống.", "trap": "D sai vì Database schemas thuộc về mức thiết kế dữ liệu chi tiết ở tầng dưới chứ không nằm trong mô hình use case ở mức đặc tả yêu cầu."}, {"slide": 14, "q": "Select the correct elements necessary for constructing a state machine diagram for a checkout system in a movie shop.", "opts": {"A": "States", "B": "Transitions", "C": "Initial State", "D": "Cost analysis", "E": "Product categories"}, "ans": ["A", "B", "C"], "hook": "state machine diagram → States, Transitions, Initial State", "why": "Bản chất của biểu đồ trạng thái state machine diagram là mô tả các trạng thái của hệ thống cùng sự chuyển dịch giữa chúng nên bắt buộc phải có States, Transitions và điểm bắt đầu Initial State.", "trap": "D và E sai vì Cost analysis và Product categories là các khái niệm thuộc về phân tích kinh doanh và quản lý sản phẩm, không phải là phần tử cấu thành nên một biểu đồ kỹ thuật UML."}, {"slide": 15, "q": "Which of the following are commonly recognized design patterns in software development?", "opts": {"A": "Singleton Pattern", "B": "Factory Pattern", "C": "Decorator Pattern", "D": "Proprietary Pattern", "E": "Exclusive Pattern"}, "ans": ["A", "B", "C"], "hook": "design patterns → Singleton, Factory, Decorator", "why": "Singleton, Factory và Decorator là ba mẫu thiết kế kinh điển và cực kỳ phổ biến trong cuốn sách Gang of Four nổi tiếng.", "trap": "D và E sai vì Proprietary và Exclusive chỉ là các thuật ngữ mô tả tính chất độc quyền, hoàn toàn không phải là design patterns trong công nghệ phần mềm."}, {"slide": 16, "q": "Which of the following are steps to enhance chatbot development using Amazon Q Developer?", "opts": {"A": "Utilize pre-trained models for natural language understanding.", "B": "Integrate with cloud-based services for scalability.", "C": "Develop AI from scratch without using any existing frameworks.", "D": "Implement continuous learning for improved accuracy.", "E": "Focus solely on graphical user interface design."}, "ans": ["A", "B", "D"], "hook": "Amazon Q Developer → pre-trained, cloud, continuous learning", "why": "Amazon Q Developer là nền tảng của AWS, giúp tăng cường phát triển chatbot bằng cách tận dụng các mô hình đã huấn luyện, tích hợp dịch vụ đám mây và học hỏi liên tục.", "trap": "C sai vì Amazon Q Developer được thiết kế để tăng tốc phát triển AI, không phải để phát triển AI từ đầu mà không dùng framework nào."}, {"slide": 17, "q": "Which conditions should be considered when performing loop testing?", "opts": {"A": "Entry and exit conditions of the loop", "B": "Performance impact of the loop", "C": "Initialization of loop variables", "D": "User interface appearance during loop execution"}, "ans": ["A", "B", "C"], "hook": "Loop testing → Entry/exit, performance, init", "why": "Khi kiểm thử vòng lặp, cần xem xét các điều kiện vào/ra, hiệu suất và khởi tạo biến để đảm bảo vòng lặp hoạt động đúng và hiệu quả.", "trap": "D sai vì giao diện người dùng không phải là điều kiện kiểm thử vòng lặp mà là vấn đề của giao diện chung."}, {"slide": 18, "q": "Which of the following actions are part of implementing various types of software tests effectively?", "opts": {"A": "Defining clear test objectives", "B": "Choosing appropriate testing tools", "C": "Avoiding documentation of test cases", "D": "Conducting thorough test reviews", "E": "Emphasizing only positive test results"}, "ans": ["A", "B", "D"], "hook": "implementing software tests → Defining, Choosing, Conducting", "why": "Để triển khai kiểm thử phần mềm hiệu quả thì cần xác định rõ mục tiêu, chọn công cụ phù hợp và đánh giá kết quả kiểm thử kỹ lưỡng.", "trap": "C sai vì việc tránh tài liệu hóa test case là hoàn toàn sai nguyên tắc kiểm thử chuyên nghiệp."}, {"slide": 19, "q": "Which of the following elements can be part of a UML Class Diagram?", "opts": {"A": "Attributes", "B": "Methods", "C": "Actors", "D": "Nodes", "E": "Relationships"}, "ans": ["A", "B", "E"], "hook": "Class Diagram → Attributes, Methods, Relationships", "why": "UML Class Diagram biểu diễn cấu trúc tĩnh của hệ thống, bao gồm các lớp, thuộc tính, phương thức và mối quan hệ giữa chúng.", "trap": "C sai vì Actors là thành phần của Use Case Diagram, không phải Class Diagram. D sai vì Nodes là thành phần của Deployment Diagram, không phải Class Diagram."}, {"slide": 20, "q": "Which of the following conditions may cause an extension to occur in a use case? (Select THREE correct answers.)", "opts": {"A": "Condition-based extensions", "B": "Event-driven extensions", "C": "Exception-driven extensions", "D": "Time-based extensions", "E": "Actor-based extensions"}, "ans": ["A", "B", "C"], "hook": "use case extension → Condition, Event, Exception", "why": "Các extension trong use case thường được kích hoạt bởi một điều kiện cụ thể, một sự kiện xảy ra, hoặc một ngoại lệ cần xử lý.", "trap": "D sai vì Time-based extensions không phải là một loại extension tiêu chuẩn trong use case; E sai vì Actor-based extensions không phải là điều kiện gây extension mà actor chỉ là người thực hiện."}, {"slide": 21, "q": "When validating system requirements for completeness and consistency, which of the following actions should be taken?", "opts": {"A": "Conduct peer reviews", "B": "Perform traceability analysis", "C": "Only rely on initial client interviews", "D": "Ignore stakeholder feedback", "E": "Utilize automated tools for requirement validation"}, "ans": ["A", "B", "E"], "hook": "validating requirements → Peer review, Traceability, Automated tools", "why": "Để đảm bảo yêu cầu hệ thống đầy đủ và nhất quán, cần có nhiều phương pháp kiểm tra chéo và tự động hóa.", "trap": "C sai vì chỉ dựa vào phỏng vấn ban đầu là không đủ để xác thực yêu cầu, cần nhiều phương pháp khác; D sai vì bỏ qua phản hồi của các bên liên quan sẽ dẫn đến yêu cầu không chính xác hoặc thiếu sót."}, {"slide": 22, "q": "In the context of version control, which practices are recommended for maintaining code integrity?", "opts": {"A": "Frequent commits with clear messages", "B": "Ignoring merge conflicts", "C": "Branching for new features", "D": "Regular code reviews", "E": "Only updating code when absolutely necessary"}, "ans": ["A", "C", "D"], "hook": "version control integrity → commits, branching, reviews", "why": "Các thực hành tốt nhất để duy trì tính toàn vẹn của mã nguồn bao gồm việc lưu lại lịch sử thường xuyên, phân nhánh để phát triển tính năng mới độc lập và đánh giá mã nguồn để kiểm soát chất lượng trước khi gộp.", "trap": "B sai vì việc bỏ qua các xung đột khi gộp mã nguồn sẽ trực tiếp phá hỏng tính toàn vẹn và gây lỗi nghiêm trọng cho hệ thống."}, {"slide": 23, "q": "Select the techniques that are essential for ensuring project success by applying requirements.", "opts": {"A": "Prioritizing requirements", "B": "Validating requirements against objectives", "C": "Tracking requirement changes", "D": "Ignoring user feedback", "E": "Focusing only on technical specifications"}, "ans": ["A", "B", "C"], "hook": "ensuring project success by applying requirements → Prioritizing, Validating, Tracking", "why": "Để đảm bảo dự án thành công khi áp dụng yêu cầu thì cần phải ưu tiên hóa các yêu cầu, xác thực chúng dựa trên mục tiêu và theo dõi các thay đổi của chúng trong suốt vòng đời dự án.", "trap": "D và E sai vì bỏ qua phản hồi của người dùng và chỉ tập trung vào đặc tả kỹ thuật sẽ dẫn đến sản phẩm không đáp ứng đúng nhu cầu thực tế."}, {"slide": 24, "q": "Select the principles that should be considered when designing system architectures.", "opts": {"A": "Modularity", "B": "Scalability", "C": "Maintainability", "D": "Randomness", "E": "Redundancy"}, "ans": ["A", "B", "C"], "hook": "designing system architectures → Modularity, Scalability, Maintainability", "why": "Thiết kế kiến trúc hệ thống luôn hướng tới tính mô-đun hóa để dễ quản lý, khả năng mở rộng quy mô khi tải tăng và tính dễ bảo trì lâu dài.", "trap": "E sai vì Redundancy thường là kỹ thuật dự phòng trong thiết kế hệ thống tin cậy cao chứ không phải là một nguyên lý thiết kế kiến trúc cốt lõi mang tính tổng quát như ba yếu tố kia."}, {"slide": 25, "q": "Select all factors to consider when gathering project requirements using the Requirements Worksheet.", "opts": {"A": "Stakeholder needs and expectations", "B": "Compliance with legal and regulatory standards", "C": "Ignoring conflicting requirements", "D": "Feasibility of implementation", "E": "Assuming all requirements are non-negotiable"}, "ans": ["A", "B", "D"], "hook": "Requirements Worksheet → Stakeholder, Legal, Feasibility", "why": "Khi thu thập yêu cầu, cần xem xét các yếu tố bên ngoài (stakeholder, pháp lý) và yếu tố khả thi nội tại của dự án.", "trap": "C sai vì luôn phải giải quyết các yêu cầu mâu thuẫn chứ không phải bỏ qua; E sai vì không phải tất cả các yêu cầu đều không thể thương lượng."}, {"slide": 27, "q": "What is one of the advantages of using incremental development in software engineering?", "opts": {"A": "Allows for frequent feedback and adjustments", "B": "Ensures complete upfront knowledge of requirements", "C": "Guarantees minimal bugs in the final product", "D": "Reduces the need for design documentation"}, "ans": ["A"], "hook": "incremental development → frequent feedback", "why": "Phát triển tiệm tiến chia nhỏ dự án thành nhiều phần để bàn giao sớm, từ đó giúp khách hàng dễ dàng theo dõi và đưa ra phản hồi liên tục.", "trap": "B sai vì việc hiểu rõ toàn bộ yêu cầu ngay từ đầu là đặc trưng của mô hình Waterfall chứ không phải Incremental."}, {"slide": 28, "q": "What is the primary role of the Factory Pattern in applying the open-closed principle in software design?", "opts": {"A": "To allow software entities to be open for extension but closed for modification.", "B": "To ensure that a class has only one instance and provides a global point of access to it.", "C": "To provide a way to defer the instantiation of objects until necessary.", "D": "To simplify code readability by reducing the number of classes needed."}, "ans": ["A"], "hook": "Factory Pattern Open-Closed → Extension not Modification", "why": "Factory Pattern hỗ trợ nguyên lý Open-Closed bằng cách cho phép thêm loại đối tượng mới mà không cần sửa đổi code hiện có.", "trap": "C sai vì đó là vai trò của Lazy Initialization, không phải trọng tâm của Factory Pattern trong việc áp dụng Open-Closed Principle."}, {"slide": 29, "q": "What is the primary benefit of using the Factory Pattern in software design?", "opts": {"A": "It promotes code reusability by allowing the creation of objects without specifying the exact class.", "B": "It ensures a single instance of a class is created.", "C": "It simplifies the interface for object creation by using inheritance.", "D": "It provides a way to structure code with a strict hierarchy."}, "ans": ["A"], "hook": "Factory Pattern → creation without specifying exact class", "why": "Factory Pattern giúp che giấu logic khởi tạo phức tạp và tách biệt quá trình tạo đối tượng khỏi lớp sử dụng trực tiếp, giúp mã nguồn linh hoạt và dễ tái sử dụng hơn.", "trap": "B sai vì đảm bảo chỉ tạo một thực thể duy nhất của lớp là đặc trưng của Singleton Pattern chứ không phải Factory Pattern."}, {"slide": 30, "q": "What is the purpose of applying estimation techniques in project management?", "opts": {"A": "To establish project scope", "B": "To predict project size and duration", "C": "To identify project risks", "D": "To create a detailed project plan"}, "ans": ["B"], "hook": "estimation → predict size and duration", "why": "Kỹ thuật ước lượng trong quản lý dự án được sử dụng để dự đoán trước quy mô kích thước và khoảng thời gian cần thiết để hoàn thành dự án.", "trap": "D sai vì tạo kế hoạch chi tiết đòi hỏi nhiều bước lập lịch và phân bổ nguồn lực cụ thể chứ không chỉ dừng lại ở việc ước lượng."}, {"slide": 31, "q": "What is a primary difference between testing and debugging in software development?", "opts": {"A": "Testing identifies errors; debugging fixes them", "B": "Testing fixes errors; debugging identifies them", "C": "Testing happens after debugging", "D": "Testing doesn't involve any code analysis"}, "ans": ["A"], "hook": "testing vs debugging → testing identifies, debugging fixes", "why": "Testing là quá trình chạy chương trình để phát hiện và tìm ra lỗi, trong khi debugging là quá trình cô lập nguyên nhân và sửa chữa lỗi đó.", "trap": "B sai vì phương án này bị đảo ngược hoàn toàn vai trò của hai hoạt động."}, {"slide": 32, "q": "What is the key component of a software project plan that outlines the timeline and milestones?", "opts": {"A": "Schedule Management Plan", "B": "Quality Management Plan", "C": "Risk Management Plan", "D": "Communication Management Plan"}, "ans": ["A"], "hook": "timeline and milestones → Schedule Management Plan", "why": "Schedule Management Plan chịu trách nhiệm thiết lập lịch trình, xác định thời hạn và các mốc quan trọng của dự án phần mềm.", "trap": "C sai vì Risk Management Plan chỉ tập trung vào việc nhận diện và xử lý rủi ro chứ không quản lý mốc thời gian."}, {"slide": 33, "q": "What is the primary purpose of configuration management in software development?", "opts": {"A": "To maintain consistency of a product's performance and functionality", "B": "To enhance the user interface of the software", "C": "To increase the speed of software development", "D": "To automate software testing processes"}, "ans": ["A"], "hook": "configuration management → consistency", "why": "Quản lý cấu hình tập trung vào việc duy trì sự đồng nhất và kiểm soát các thay đổi đối với sản phẩm phần mềm trong suốt vòng đời của nó.", "trap": "C sai vì tốc độ phát triển phụ thuộc vào quy trình Agile hoặc công cụ hỗ trợ chứ không phải mục đích chính của quản lý cấu hình."}, {"slide": 34, "q": "What is the primary purpose of acceptance testing in a movie shop application?", "opts": {"A": "To ensure the application meets business requirements.", "B": "To identify syntax errors in the code.", "C": "To test the integration of different modules.", "D": "To assess the performance under load."}, "ans": ["A"], "hook": "acceptance testing → business requirements", "why": "Acceptance testing là kiểm thử chấp nhận nhằm xác định xem hệ thống đã đáp ứng đúng các yêu cầu nghiệp vụ và mong đợi của khách hàng hay chưa.", "trap": "C sai vì việc tích hợp các module là nhiệm vụ của integration testing chứ không phải acceptance testing."}, {"slide": 35, "q": "What is the primary objective of black box testing?", "opts": {"A": "To evaluate software functionality without examining internal code", "B": "To improve code readability and maintainability", "C": "To assess the scalability of the software architecture", "D": "To determine the software's compliance with coding standards"}, "ans": ["A"], "hook": "black box → functionality", "why": "Kiểm thử hộp đen tập trung vào việc xác minh chức năng của phần mềm từ góc độ người dùng, không cần biết cấu trúc bên trong.", "trap": "B sai vì đó là mục tiêu của refactoring hoặc clean code; C sai vì đó là mục tiêu của kiểm thử hiệu năng hoặc stress test; D sai vì đó là mục tiêu của kiểm thử tĩnh hoặc review code."}, {"slide": 36, "q": "What is a key requirement for project success in the context of use case development?", "opts": {"A": "Clear and detailed specifications that all stakeholders understand.", "B": "A fast-paced development cycle to outpace competitors.", "C": "A large team to handle diverse project aspects.", "D": "Frequent changes to adapt to new technologies."}, "ans": ["A"], "hook": "use case development → clear and detailed specifications", "why": "Để phát triển use case thành công thì yêu cầu cốt lõi là các bên liên quan phải hiểu rõ ràng và chi tiết các đặc tả yêu cầu hệ thống.", "trap": "B sai vì tốc độ phát triển nhanh chỉ là yếu tố phụ, nếu không hiểu rõ đặc tả từ đầu thì sản phẩm làm ra nhanh vẫn sẽ thất bại."}, {"slide": 37, "q": "What is the primary purpose of applying defensive programming techniques in software development?", "opts": {"A": "Enhance code reliability by handling unexpected inputs gracefully", "B": "Increase code execution speed through optimized algorithms", "C": "Reduce the overall size of the codebase by removing redundancies", "D": "Ensure compatibility with future versions of the programming language"}, "ans": ["A"], "hook": "defensive programming → unexpected inputs gracefully", "why": "Defensive programming hay lập trình phòng thủ là kỹ thuật viết mã nguồn sao cho chương trình vẫn hoạt động ổn định và tin cậy bằng cách lường trước và xử lý khéo léo các tình huống dữ liệu đầu vào bất thường.", "trap": "B sai vì lập trình phòng thủ thường làm tăng số lượng câu lệnh kiểm tra điều kiện nên không giúp tăng tốc độ thực thi mã nguồn."}, {"slide": 38, "q": "Which testing technique is most suitable for identifying independent paths in a flow graph?", "opts": {"A": "Basis path testing", "B": "Regression testing", "C": "Black box testing", "D": "White box testing"}, "ans": ["A"], "hook": "independent paths → Basis path", "why": "Basis path testing được thiết kế để tìm các đường độc lập trong biểu đồ luồng.", "trap": "D sai vì White box testing là một loại kiểm thử (bao gồm Basis path testing), không phải một kỹ thuật cụ thể để tìm đường độc lập."}, {"slide": 39, "q": "Which of the following is an example of multiplicity in a UML class diagram?", "opts": {"A": "One to many", "B": "Private", "C": "Abstract", "D": "Extends"}, "ans": ["A"], "hook": "multiplicity → One to many", "why": "Multiplicity trong biểu đồ lớp UML thể hiện bội số quan hệ giữa các thực thể, ví dụ như quan hệ một - nhiều hoặc một - một.", "trap": "D sai vì Extends là từ khóa thể hiện quan hệ kế thừa trong lập trình hoặc mối quan hệ giữa các use case chứ không phải bội số quan hệ."}, {"slide": 40, "q": "Which of the following is a crucial step to validate that system requirements are complete?", "opts": {"A": "Conducting a thorough requirements review", "B": "Assuming stakeholder agreement", "C": "Relying solely on automated tools", "D": "Skipping documentation for minor requirements"}, "ans": ["A"], "hook": "complete → review", "why": "Kiểm tra kỹ lưỡng các yêu cầu là bước quan trọng nhất để đảm bảo chúng đầy đủ và chính xác.", "trap": "B sai vì không thể giả định sự đồng thuận của các bên liên quan mà không có xác nhận."}, {"slide": 41, "q": "Which of the following best describes the purpose of Scrum in software development?", "opts": {"A": "Scrum is a framework for managing work with an emphasis on iterative progress.", "B": "Scrum is a programming language used in Agile development.", "C": "Scrum is a database management system for software projects.", "D": "Scrum is a tool for automating testing in software development."}, "ans": ["A"], "hook": "Scrum → framework iterative", "why": "Scrum là một khung làm việc linh hoạt, tập trung vào việc phát triển phần mềm theo các chu kỳ lặp đi lặp lại để đạt được tiến độ liên tục.", "trap": "B sai vì Scrum là một framework, không phải ngôn ngữ lập trình."}, {"slide": 42, "q": "Which of the following is a major activity involved in capturing system requirements in software development?", "opts": {"A": "Defining user interactions", "B": "Implementing code", "C": "Testing software", "D": "Deploying applications"}, "ans": ["A"], "hook": "capturing requirements → user interactions", "why": "Xác định yêu cầu hệ thống thực chất là tìm hiểu người dùng sẽ tương tác với phần mềm như thế nào để giải quyết vấn đề của họ.", "trap": "B sai vì việc viết mã thuộc giai đoạn Implementation chứ không phải Capture Requirements."}, {"slide": 43, "q": "Which UML diagram would be most suitable to represent the structure of a banking application, focusing on the relationships between account holders, accounts, and transactions?", "opts": {"A": "Class Diagram", "B": "Sequence Diagram", "C": "Activity Diagram", "D": "State Diagram"}, "ans": ["A"], "hook": "Banking structure → Class Diagram", "why": "Class Diagram biểu diễn cấu trúc tĩnh của hệ thống, bao gồm các lớp, thuộc tính, phương thức và mối quan hệ giữa chúng, rất phù hợp để mô tả các đối tượng như người giữ tài khoản, tài khoản và giao dịch.", "trap": "Sequence Diagram sai vì nó tập trung vào luồng tương tác giữa các đối tượng theo thời gian, không phải cấu trúc tĩnh."}, {"slide": 44, "q": "Which factor best indicates the impact of a risk on a software development project?", "opts": {"A": "Potential consequences on project milestones", "B": "The number of team members affected", "C": "Availability of risk mitigation strategies", "D": "Compliance with industry standards"}, "ans": ["A"], "hook": "risk impact → consequences on milestones", "why": "Tác động của rủi ro thường được đánh giá qua những hậu quả mà nó gây ra cho các mục tiêu quan trọng của dự án, đặc biệt là các mốc thời gian.", "trap": "B sai vì số lượng thành viên bị ảnh hưởng không phải là thước đo chính xác nhất về tác động tổng thể của rủi ro lên dự án."}, {"slide": 45, "q": "Which of the following best captures the concept of a 'user story' in Agile development?", "opts": {"A": "A detailed technical specification of a feature", "B": "A simple description of a feature from an end-user perspective", "C": "A contract between developers and stakeholders", "D": "A timeline for project delivery"}, "ans": ["B"], "hook": "user story → end-user perspective", "why": "User story bản chất là mô tả ngắn gọn và đơn giản về một tính năng dưới góc nhìn của người dùng cuối thay vì mang tính kỹ thuật.", "trap": "A sai vì user story không bao giờ là một tài liệu đặc tả kỹ thuật chi tiết."}, {"slide": 46, "q": "Which approach in software modeling starts with the overall system design and then progressively breaks it down into smaller components or modules?", "opts": {"A": "Sequential approach", "B": "Iterative approach", "C": "Top-down approach", "D": "Bottom-up approach"}, "ans": ["C"], "hook": "overall system design → Top-down approach", "why": "Phương pháp tiếp cận top-down bắt đầu từ bức tranh tổng thể của hệ thống rồi mới phân rã chi tiết thành các thành phần nhỏ hơn.", "trap": "D sai vì Bottom-up đi từ các thành phần nhỏ, chi tiết rồi mới ghép thành hệ thống lớn, hoàn toàn ngược lại với đề bài."}, {"slide": 47, "q": "Which of the following best describes the concept of 'abstraction' in use case analysis?", "opts": {"A": "Simplifying complex systems by focusing on essential features only", "B": "Eliminating non-functional requirements from system design", "C": "Ensuring all software components are reusable", "D": "Maximizing data redundancy to improve performance"}, "ans": ["A"], "hook": "abstraction use case → essential features", "why": "Abstraction là quá trình đơn giản hóa hệ thống bằng cách chỉ tập trung vào các đặc điểm cốt lõi.", "trap": "B sai vì abstraction không phải là loại bỏ non-functional requirements mà là tập trung vào các tính năng chính."}, {"slide": 48, "q": "How does modularity help in managing the complexity of software systems?", "opts": {"A": "By breaking down systems into smaller, manageable components", "B": "By increasing the overall size of the codebase", "C": "By eliminating the need for design patterns", "D": "By reducing the need for programming languages"}, "ans": ["A"], "hook": "modularity → smaller manageable components", "why": "Chia nhỏ hệ thống thành các module giúp giảm tải nhận thức và dễ dàng quản lý từng phần riêng biệt.", "trap": "B sai vì modularity giúp tổ chức code tốt hơn chứ không phải làm tăng kích thước mã nguồn."}, {"slide": 49, "q": "How do standards and metrics contribute to maintaining consistent software quality in quality assurance?", "opts": {"A": "They provide benchmarks and measurements to maintain consistent software quality.", "B": "They outline the software development lifecycle stages.", "C": "They focus primarily on code optimization techniques.", "D": "They dictate the programming languages and design pattern used in development."}, "ans": ["A"], "hook": "Standards, metrics → Benchmarks, measurements", "why": "Tiêu chuẩn và số đo đóng vai trò là các mốc chuẩn và thước đo định lượng để đảm bảo chất lượng phần mềm đồng nhất.", "trap": "C sai vì tối ưu mã nguồn chỉ là một phần nhỏ của kỹ thuật chứ không đại diện cho toàn bộ quy trình đảm bảo chất lượng."}, {"slide": 50, "q": "How does Amazon Q Developer assist in generating Java documentation?", "opts": {"A": "By analyzing code semantics and auto-generating documentation based on it", "B": "By converting comments into structured documentation", "C": "By using machine learning to predict documentation needs", "D": "By following pre-written templates for common Java classes"}, "ans": ["A"], "hook": "Amazon Q Developer → Analyzing code semantics", "why": "Công cụ này sử dụng AI để hiểu ngữ nghĩa của mã nguồn và tự động tạo ra tài liệu mô tả chính xác chức năng của code đó.", "trap": "B sai vì việc chuyển đổi comment có sẵn chỉ là một kỹ thuật cũ, Amazon Q có khả năng tự phân tích logic code để viết tài liệu mới."}, {"slide": 51, "q": "How do UML diagrams aid in understanding system design?", "opts": {"A": "By visually representing system components and their relationships.", "B": "By detailing the exact code implementation.", "C": "By ensuring systems run without errors.", "D": "By replacing the need for technical documentation."}, "ans": ["A"], "hook": "UML diagrams → visually representing", "why": "UML là ngôn ngữ mô hình hóa trực quan giúp lập trình viên hình dung cấu trúc và mối quan hệ giữa các thành phần trong hệ thống mà không cần đọc code chi tiết.", "trap": "B sai vì UML tập trung vào thiết kế mức cao chứ không mô tả chi tiết mã nguồn triển khai."}, {"slide": 52, "q": "During requirements analysis, what is an essential activity to ensure comprehensive understanding of the system requirements?", "opts": {"A": "Engaging with end users to gather detailed requirements", "B": "Immediately starting code development to test assumptions", "C": "Focusing solely on technical specifications", "D": "Skipping documentation to save time"}, "ans": ["A"], "hook": "requirements analysis → engaging end users", "why": "Phân tích yêu cầu cần sự tương tác trực tiếp với người dùng cuối để hiểu rõ nhu cầu thực tế và mục tiêu của hệ thống.", "trap": "C sai vì chỉ tập trung vào thông số kỹ thuật là chưa đủ để hiểu toàn diện yêu cầu nghiệp vụ."}, {"slide": 53, "q": "In the context of a movie shop, which analysis method is most suitable for understanding customer behavior and preferences?", "opts": {"A": "Regression analysis", "B": "Customer segmentation analysis", "C": "Inventory turnover analysis", "D": "SWOT analysis"}, "ans": ["B"], "hook": "customer behavior → customer segmentation", "why": "Phân đoạn khách hàng là phương pháp tốt nhất để phân loại và hiểu rõ hành vi cũng như sở thích riêng biệt của từng nhóm người dùng.", "trap": "A sai vì Regression analysis thường dùng để dự báo xu hướng hoặc mối quan hệ giữa các biến số hơn là hiểu đặc điểm hành vi."}, {"slide": 54, "q": "In a neural network, what is the main role of the hidden layer?", "opts": {"A": "To process inputs and pass the transformation to the output layer.", "B": "To initialize weights for the input layer.", "C": "To directly compare the output with expected results.", "D": "To store static data for future input processing."}, "ans": ["A"], "hook": "hidden layer → process inputs", "why": "Lớp ẩn có nhiệm vụ chính là biến đổi và xử lý dữ liệu đầu vào trước khi chuyển đến lớp đầu ra.", "trap": "C sai vì việc so sánh trực tiếp output với kết quả mong đợi là vai trò của hàm mất mát (loss function) hoặc các thuật toán huấn luyện, không phải của lớp ẩn."}, {"slide": 55, "q": "In the context of software development, what is a critical consideration when applying implementation strategies to real-world scenarios?", "opts": {"A": "Ensuring scalability to handle increased load", "B": "Focusing solely on code aesthetics", "C": "Avoiding the use of any third-party libraries", "D": "Minimizing initial development time at any cost"}, "ans": ["A"], "hook": "real-world scenarios → scalability", "why": "Khi áp dụng các chiến lược triển khai vào thực tế, hệ thống bắt buộc phải có khả năng mở rộng để đáp ứng lượng tải thực tế ngày càng tăng từ người dùng.", "trap": "D sai vì việc giảm tối đa thời gian phát triển bằng mọi giá sẽ dẫn đến nợ kỹ thuật nghiêm trọng và sản phẩm không thể sử dụng lâu dài."}, {"slide": 56, "q": "Identify important aspects of the quality assurance process.", "opts": {"A": "Regular audits to ensure compliance with standards.", "B": "Training programs to enhance team skills and knowledge.", "C": "Marketing strategies to improve software visibility.", "D": "User interface design to enhance user experience."}, "ans": ["A"], "hook": "quality assurance → Regular audits", "why": "Đảm bảo chất lượng phần mềm đòi hỏi việc kiểm tra và đánh giá định kỳ để chắc chắn rằng quy trình phát triển luôn tuân thủ các tiêu chuẩn chất lượng đã đề ra.", "trap": "B sai vì việc đào tạo nâng cao kỹ năng đội ngũ thuộc về quản lý nhân sự hơn là một hoạt động kiểm soát trực tiếp trong quy trình đảm bảo chất lượng."}, {"slide": 57, "q": "In software development, what is the primary objective of conducting a retrospective meeting in Agile methodologies?", "opts": {"A": "To reflect on past iterations and improve future processes", "B": "To assign tasks for the next sprint", "C": "To evaluate individual team member performance", "D": "To finalize user stories for release"}, "ans": ["A"], "hook": "retrospective meeting → improve future processes", "why": "Họp cải tiến quy trình retrospective trong Agile được thực hiện ở cuối mỗi sprint nhằm nhìn lại quá trình đã qua và tìm cách cải thiện hiệu quả làm việc cho các sprint tiếp theo.", "trap": "C sai vì retrospective tập trung vào cải tiến quy trình của cả nhóm chứ không dùng để đánh giá hay chỉ trích hiệu suất của từng cá nhân."}, {"slide": 59, "q": "Which of the following CANNOT be shown on a Gantt chart?", "opts": {"A": "the task dependencies", "B": "the time estimates for each task", "C": "the resource assignment for each task", "D": "the tasks that lie on the critical path", "E": "the progress of each task"}, "ans": ["D"], "hook": "Gantt chart → CANNOT → critical path", "why": "Gantt chart chỉ tập trung vào tiến độ và thời gian theo lịch biểu chứ không phân tích mạng lưới công việc để xác định đường găng như sơ đồ PERT hay CPM.", "trap": "A sai vì Gantt chart hiện đại vẫn có thể hiển thị các mũi tên liên kết giữa các task."}, {"slide": 60, "q": "Which of the following is not an emphasis of an Agile development process?", "opts": {"A": "individuals and interactions", "B": "comprehensive test plan", "C": "client involvement/collaboration", "D": "working software", "E": "responsiveness to change"}, "ans": ["B"], "hook": "Not Agile → comprehensive test plan", "why": "Tuyên ngôn Agile ưu tiên phần mềm chạy tốt hơn là việc lập kế hoạch hay tài liệu hóa quá chi tiết và toàn diện.", "trap": "A sai vì Agile luôn nhấn mạnh tương tác giữa các cá nhân hơn là quy trình và công cụ."}, {"slide": 61, "q": "Which of the following IS NOT a software quality assurance activity?", "opts": {"A": "standards enforcement", "B": "program testing", "C": "artifact reviews", "D": "software configuration management", "E": "people training"}, "ans": ["E"], "hook": "NOT quality assurance → people training", "why": "Đào tạo nhân sự là hoạt động quản lý nguồn lực và phát triển tổ chức chứ không trực tiếp kiểm soát hay đảm bảo chất lượng của sản phẩm phần mềm.", "trap": "D sai vì nhiều người nghĩ quản lý cấu hình không liên quan đến chất lượng, nhưng thực tế nó giúp kiểm soát phiên bản và tính nhất quán của sản phẩm nên vẫn là hoạt động QA."}, {"slide": 62, "q": "Which of the following is NOT true about design patterns?", "opts": {"A": "They help novices behave like experts.", "B": "They are described using program code.", "C": "They represent a solution to a problem in a context.", "D": "They can be used to handle nonfunctional requirements.", "E": "They make extensive use of inheritance and delegation."}, "ans": ["B"], "hook": "design patterns NOT → NOT described using program code", "why": "Design patterns là các giải pháp trừu tượng, mô tả cách giải quyết vấn đề chứ không phải bản thân đoạn mã cụ thể.", "trap": "D sai vì design patterns có thể giúp xử lý các non-functional requirements như hiệu năng (ví dụ: Singleton) hoặc khả năng mở rộng (ví dụ: Strategy)."}, {"slide": 63, "q": "Which statement is NOT true about a state in a state machine diagram?", "opts": {"A": "It has duration.", "B": "It can be anonymous (unnamed).", "C": "It can only be entered by the triggering of an event.", "D": "It may be characterized by the value of one or more attributes.", "E": "It may be characterized by the existence of a link to another object."}, "ans": ["C"], "hook": "state machine diagram NOT true → only entered by event", "why": "Một state trong state machine diagram vẫn có thể được đi vào trực tiếp thông qua initial state hoặc các chuyển trạng thái không điều kiện mà không cần có event kích hoạt.", "trap": "A sai vì state thể hiện một khoảng thời gian đối tượng duy trì một điều kiện nào đó nên nó bắt buộc phải có duration."}, {"slide": 64, "q": "Which of the following is NOT a way to deal with risks in software development?", "opts": {"A": "avoid (replan or change requirements)", "B": "ignore (act as if it won't happen)", "C": "mitigate (devise tests to see if it occurs)", "D": "confine (restrict the scope of its effect)", "E": "monitor (constantly be on the lookout for it)"}, "ans": ["B"], "hook": "NOT deal with risks → ignore", "why": "Trong quản lý rủi ro của phát triển phần mềm, việc phớt lờ rủi ro là một hành động vô trách nhiệm và không được coi là một chiến lược giải quyết rủi ro hợp lệ.", "trap": "C sai vì mitigate là chiến lược giảm thiểu rủi ro rất phổ biến nên không thể là đáp án cho câu hỏi chọn phương án KHÔNG phải."}, {"slide": 65, "q": "Which of the following is NOT a configuration management activity?", "opts": {"A": "change management", "B": "version management", "C": "risk management", "D": "release management", "E": "system building"}, "ans": ["C"], "hook": "configuration management NOT → NOT risk management", "why": "Risk management thuộc về quản lý dự án chung chứ không nằm trong các hoạt động kỹ thuật của quản lý cấu hình phần mềm.", "trap": "E sai vì system building là một bước kỹ thuật bắt buộc để tạo ra sản phẩm từ các thành phần cấu hình nên sinh viên dễ nhầm là không thuộc configuration management."}, {"slide": 66, "q": "Which of the following is NOT an issue when considering \"programming-in-the-large\"?", "opts": {"A": "Understanding user requirements", "B": "Applying appropriate software development processes", "C": "Building models of a system", "D": "Validating user input.", "E": "Making design trade-offs"}, "ans": ["D"], "hook": "programming-in-the-large → Validating user input", "why": "Programming-in-the-large liên quan đến các vấn đề quản lý, tổ chức và cấu trúc hệ thống lớn, không phải chi tiết kỹ thuật như kiểm tra đầu vào người dùng.", "trap": "A sai vì việc hiểu yêu cầu người dùng là một thách thức lớn khi phát triển phần mềm quy mô lớn."}, {"slide": 67, "q": "Which of the following is NOT included in the \"Four P's in Software Development\"?", "opts": {"A": "people", "B": "plan", "C": "process", "D": "product", "E": "project"}, "ans": ["B"], "hook": "Four P's NOT → NOT plan", "why": "Mô hình quản lý dự án phần mềm 4P bao gồm People, Product, Process và Project chứ không chứa Plan.", "trap": "E sai vì Project thường bị nhầm là không thuộc 4P do trùng âm đầu với Product và Process trong khi thực tế Plan mới là từ bị loại."}, {"slide": 68, "q": "Which of the following is NOT a property of an attribute in the UML?", "opts": {"A": "data type", "B": "multiplicity", "C": "visibility", "D": "signature", "E": "changeability"}, "ans": ["D"], "hook": "attribute in UML → NOT signature", "why": "Signature hay chữ ký là đặc trưng của phương thức hoặc hàm chứ không phải là thuộc tính của một attribute trong UML.", "trap": "B sai vì multiplicity hoàn toàn có thể là thuộc tính của attribute để chỉ ra số lượng phần tử của thuộc tính đó."}, {"slide": 69, "q": "Which of the following is NOT a software engineering activity?", "opts": {"A": "knowledge acquisition", "B": "hiring programmers", "C": "problem solving", "D": "rationale management", "E": "modeling"}, "ans": ["B"], "hook": "NOT software engineering activity → hiring programmers", "why": "Hiring programmers là hoạt động quản trị nhân sự thuộc phòng HR chứ không phải là một hoạt động kỹ thuật hay quản lý kỹ thuật trực tiếp trong quy trình xây dựng phần mềm.", "trap": "A sai vì knowledge acquisition là hoạt động thu thập và tìm hiểu kiến thức miền nghiệp vụ để xây dựng phần mềm nên vẫn thuộc kỹ nghệ phần mềm."}, {"slide": 70, "q": "Which of the following is NOT a characteristics of software quality?", "opts": {"A": "portable", "B": "profitable", "C": "correct", "D": "reusable", "E": "reliable"}, "ans": ["B"], "hook": "software quality → NOT profitable", "why": "Chất lượng phần mềm tập trung vào các đặc tính kỹ thuật và vận hành như tính đúng đắn, khả năng tái sử dụng hay tính di động, trong khi khả năng sinh lời là mục tiêu kinh doanh thương mại chứ không phải đặc tính chất lượng của bản thân phần mềm.", "trap": "A sai vì portable dễ bị nhầm là không liên quan, nhưng thực tế tính di động là một đặc tính chất lượng phần mềm quan trọng trong chuẩn ISO/IEC 25010."}, {"slide": 71, "q": "Which of the following should NOT be included in the use-case detailed specification?", "opts": {"A": "participating actors", "B": "developing tools", "C": "preconditions", "D": "flow of events", "E": "postconditions"}, "ans": ["B"], "hook": "use-case detailed specification → NOT developing tools", "why": "Tài liệu đặc tả chi tiết use case chỉ tập trung mô tả hành vi hệ thống và tương tác của người dùng chứ không chứa các thông tin kỹ thuật về công cụ phát triển phần mềm.", "trap": "A sai vì nhiều sinh viên nhầm lẫn actor chỉ nằm ở sơ đồ use case tổng quan, nhưng thực tế danh sách các actor tham gia vẫn phải được liệt kê chi tiết trong tài liệu đặc tả."}, {"slide": 72, "q": "Which statement is NOT true about software engineering?", "opts": {"A": "It is an ad-hoc development effort.", "B": "It deals with multiple versions of the software.", "C": "It should build a quality system.", "D": "It requires a team effort.", "E": "It should solve a real user problem."}, "ans": ["A"], "hook": "NOT true software engineering → ad-hoc", "why": "Software engineering là quá trình phát triển phần mềm có kỷ luật, quy trình và kế hoạch rõ ràng chứ không phải là một nỗ lực tự phát, tùy tiện như ad-hoc.", "trap": "D sai vì nhiều người nghĩ lập trình viên có thể làm việc độc lập nên chọn nhầm, nhưng thực tế software engineering quy mô lớn luôn đòi hỏi sự phối hợp của một đội ngũ."}, {"slide": 73, "q": "Which statement is NOT true about a use case?", "opts": {"A": "It describes actor/system interaction", "B": "It represents part of the system's user interface.", "C": "It is an abstraction of one or more scenarios", "D": "It can be represented as a UML class.", "E": "It is always initiated by an actor."}, "ans": ["B"], "hook": "Use case UI → NOT TRUE", "why": "Use case mô tả tương tác giữa người dùng và hệ thống, không phải là một phần của giao diện người dùng (UI) trực tiếp.", "trap": "D sai vì use case được biểu diễn bằng UML use case diagram, không phải class diagram."}, {"slide": 74, "q": "Which statement is NOT true about a use-case actor?", "opts": {"A": "An actor can represent a person.", "B": "An actor also can be represented by a domain model class.", "C": "An actor represents a role a user can play.", "D": "An actor can represent an internal database.", "E": "An actor can represent a system."}, "ans": ["D"], "hook": "actor NOT true → internal database", "why": "Actor là một vai trò bên ngoài tương tác với hệ thống, không phải là thành phần bên trong như database.", "trap": "B sai vì actor có thể là một hệ thống bên ngoài, nhưng không thể là một class trong domain model nội bộ."}, {"slide": 75, "q": "Which reason for the failure of or problems with software development is NOT related to requirements capture?", "opts": {"A": "incomplete requirements captured", "B": "lack of user involvement", "C": "unrealistic user expectations", "D": "lack of resources", "E": "changing requirements and specifications"}, "ans": ["D"], "hook": "failure NOT related to requirements → lack of resources", "why": "Thiếu hụt nguồn lực như ngân sách hay nhân sự thuộc về quản lý dự án chứ không liên quan trực tiếp đến quá trình thu thập và định nghĩa yêu cầu phần mềm.", "trap": "E sai vì sự thay đổi liên tục của yêu cầu và đặc tả kỹ thuật vẫn là vấn đề trực tiếp thuộc nhóm quy trình quản lý yêu cầu khách hàng."}, {"slide": 76, "q": "According to the best practices of analysis object interaction, which one of the following interactions should NOT be allowed?", "opts": {"A": "interactions between a boundary object and a control object", "B": "interactions between two control objects", "C": "interactions between a boundary object and an entity object", "D": "interactions between two boundary objects", "E": "interactions between a control object and an entity object"}, "ans": ["D"], "hook": "NOT allowed interaction → two boundary objects", "why": "Theo quy tắc phân tích tương tác đối tượng Robustness Diagram, hai đối tượng giao diện boundary không được phép tương tác trực tiếp với nhau mà phải thông qua một đối tượng điều khiển control.", "trap": "C sai vì tương tác giữa boundary và entity cũng bị cấm trong Robustness Diagram, nhưng đáp án D (hai boundary tương tác với nhau) là lỗi nghiêm trọng nhất và luôn luôn bị cấm tuyệt đối trong mọi tài liệu thiết kế chuẩn."}, {"slide": 77, "q": "If an organization has a standards handbook for software development, then which of the following probably is NOT true?", "opts": {"A": "A project can decide to not follow any standards.", "B": "A project can decide to ignore a standard.", "C": "A project can decide to use a standard as is.", "D": "A project can decide to modify a standard.", "E": "A project can decide to create a new standard."}, "ans": ["A"], "hook": "standards handbook → NOT true: not follow any", "why": "Dù tổ chức cho phép tùy biến, bỏ qua hoặc tạo mới tiêu chuẩn nhưng một dự án phần mềm không thể tùy tiện quyết định không tuân theo bất kỳ tiêu chuẩn nào cả.", "trap": "B sai vì việc bỏ qua một tiêu chuẩn cụ thể (ignore a standard) vẫn được phép nếu dự án đó không áp dụng quy trình tương ứng, khác với việc vô kỷ luật hoàn toàn ở đáp án A."}, {"slide": 79, "q": "Which statement about the UML (Unified Modeling Language) is true?", "opts": {"A": "The UML makes us think about the world in a certain way.", "B": "The UML can be used to model only software systems.", "C": "The UML can be used for only object-oriented software systems.", "D": "The UML is a software development process.", "E": "The UML provides a fixed set of modeling elements."}, "ans": ["A"], "hook": "UML is true → think about the world", "why": "UML không chỉ là công cụ vẽ mà còn là một ngôn ngữ mô hình hóa giúp định hình cách chúng ta tư duy và nhìn nhận thế giới thực theo hướng đối tượng.", "trap": "D sai vì UML chỉ là một ngôn ngữ mô hình hóa trực quan chứ bản thân nó không phải là một quy trình phát triển phần mềm."}, {"slide": 80, "q": "Which statement is true about system testing and acceptance testing?", "opts": {"A": "System testing is done after acceptance testing.", "B": "System testing is done by the developers; acceptance testing is done by the client.", "C": "System testing is done at the client's site; acceptance testing is done at the developer's site.", "D": "System testing is done by the client; acceptance testing is done by the developers.", "E": "None of the above is true."}, "ans": ["B"], "hook": "System testing and acceptance testing → System developers, Acceptance client", "why": "System testing do đội ngũ phát triển thực hiện để kiểm thử toàn bộ hệ thống, trong khi acceptance testing do khách hàng thực hiện để nghiệm thu sản phẩm.", "trap": "A sai vì system testing phải được thực hiện trước để đảm bảo hệ thống chạy ổn định rồi mới bàn giao cho khách hàng làm acceptance testing."}, {"slide": 82, "q": "True or False: A neural network gives output in the hidden layer.", "opts": {"A": "False", "B": "True"}, "ans": ["A"], "hook": "neural network output → False", "why": "Mạng nơ-ron nhân tạo chỉ đưa ra kết quả đầu ra ở lớp đầu ra chứ không phải ở lớp ẩn.", "trap": "B sai vì lớp ẩn chỉ đóng vai trò xử lý trung gian và trích xuất đặc trưng chứ không xuất kết quả trực tiếp."}, {"slide": 83, "q": "True or False: A random forest combines multiple decision trees, reducing overfitting and improving accuracy.", "opts": {"A": "False", "B": "True"}, "ans": ["B"], "hook": "random forest → True", "why": "Random forest kết hợp nhiều decision trees giúp giảm hiện tượng overfitting và tăng độ chính xác nhờ cơ chế bỏ phiếu số đông của các cây quyết định độc lập.", "trap": "A sai vì nhầm tưởng việc kết hợp nhiều cây sẽ làm mô hình phức tạp hơn và dễ gây overfitting hơn."}, {"slide": 84, "q": "True or False: AI-powered tools like Amazon Q Developer can identify synchronization issues in Java code during automated code reviews.", "opts": {"A": "True", "B": "False"}, "ans": ["A"], "hook": "Amazon Q Developer → synchronization issues → True", "why": "Các công cụ AI hiện đại như Amazon Q Developer có khả năng phân tích luồng dữ liệu và phát hiện các lỗi đồng bộ hóa phức tạp như deadlock hay race condition trong mã nguồn Java.", "trap": "B sai vì nghĩ rằng AI chỉ kiểm tra được cú pháp cơ bản chứ không thể phát hiện lỗi logic đồng bộ hóa đa luồng phức tạp."}, {"slide": 85, "q": "True or False: A company introducing AI-based chatbots to improve customer support is an example of digital transformation.", "opts": {"A": "True", "B": "False"}, "ans": ["A"], "hook": "AI-based chatbots → True", "why": "Việc áp dụng chatbot AI để cải tiến quy trình chăm sóc khách hàng là một ví dụ điển hình của chuyển đổi số nhằm thay đổi cách thức doanh nghiệp tương tác và tạo giá trị.", "trap": "B sai vì nghĩ rằng chuyển đổi số phải là cái gì đó to tát thay đổi toàn bộ tập đoàn, trong khi việc ứng dụng AI vào một quy trình cụ thể như customer support đã đủ để coi là digital transformation."}, {"slide": 86, "q": "True or False: An online bookstore struggling with clunky checkouts, delivery delays, and a lack of personalized recommendations can succeed by focusing on the four domains of digital transformation.", "opts": {"A": "False", "B": "True"}, "ans": ["B"], "hook": "struggling with clunky checkouts → True", "why": "Bốn lĩnh vực của chuyển đổi số gồm quy trình, công nghệ, dữ liệu và tổ chức sẽ giúp giải quyết triệt để các vấn đề về thanh toán, vận chuyển và cá nhân hóa của nhà sách.", "trap": "A sai vì nghĩ rằng chuyển đổi số chỉ là lý thuyết chung chung không giải quyết được các lỗi kỹ thuật cụ thể của hệ thống."}, {"slide": 87, "q": "True or False: A neural network is created to mimic how computer chips work on a deeper level and some biological concepts.", "opts": {"A": "True", "B": "False"}, "ans": ["B"], "hook": "neural network → False", "why": "Mạng nơ-ron nhân tạo được thiết kế để mô phỏng cách hoạt động của bộ não sinh học chứ không phải để bắt chước cách hoạt động của chip máy tính.", "trap": "A sai vì dễ bị nhầm lẫn bởi cụm từ biological concepts mà quên mất vế computer chips là hoàn toàn sai lệch bản chất."}, {"slide": 88, "q": "True or false: AI tools can only generate boilerplate code for specific programming languages.", "opts": {"A": "True", "B": "False"}, "ans": ["B"], "hook": "AI tools can only → False", "why": "Các công cụ AI hiện nay rất đa năng, có thể tạo ra nhiều loại code phức tạp và hỗ trợ hầu hết các ngôn ngữ lập trình chứ không chỉ giới hạn ở boilerplate code cho một số ngôn ngữ cụ thể.", "trap": "A sai vì chữ only mang tính chất tuyệt đối và phủ nhận khả năng tạo code logic phức tạp hoặc đa ngôn ngữ của AI hiện đại."}, {"slide": 89, "q": "True or false: AI-generated boilerplate code often requires developer review before integration.", "opts": {"A": "True", "B": "False"}, "ans": ["A"], "hook": "AI-generated boilerplate → True", "why": "Mã nguồn do AI tự động tạo ra vẫn có thể chứa lỗi logic hoặc bảo mật nên luôn cần lập trình viên kiểm tra lại trước khi tích hợp vào hệ thống.", "trap": "B sai vì tin tưởng tuyệt đối vào AI mà không qua kiểm duyệt sẽ dễ dẫn đến các lỗi hệ thống nghiêm trọng."}, {"slide": 90, "q": "True or false: AI tools guarantee error-free boilerplate code for all projects.", "opts": {"A": "True", "B": "False"}, "ans": ["B"], "hook": "AI tools guarantee → False", "why": "Công cụ AI không bao giờ đảm bảo tạo ra mã nguồn hoàn toàn không có lỗi cho mọi dự án vì chúng vẫn có thể tạo ra lỗi logic hoặc mã nguồn lỗi thời.", "trap": "A sai vì từ guarantee mang tính tuyệt đối, trong thực tế phát triển phần mềm không có công cụ nào đảm bảo 100% không có lỗi."}, {"slide": 91, "q": "True or False: Chain-of-thought prompting encourages AI to break down problems step-by-step to generate better results.", "opts": {"A": "True", "B": "False"}, "ans": ["A"], "hook": "Chain-of-thought → step-by-step", "why": "Chain-of-thought hướng dẫn mô hình tư duy theo từng bước để tăng độ chính xác của kết quả.", "trap": "B sai vì Chain-of-thought chính là kỹ thuật giúp AI suy luận logic thay vì đưa ra kết quả trực tiếp."}, {"slide": 92, "q": "True or False: Generating a new piece of music in the style of Beethoven is a task that Generative AI can accomplish.", "opts": {"A": "True", "B": "False"}, "ans": ["A"], "hook": "Beethoven music → Generative AI True", "why": "Generative AI có khả năng học hỏi các mẫu và phong cách từ dữ liệu hiện có để tạo ra nội dung mới, bao gồm cả âm nhạc theo phong cách của các nhà soạn nhạc nổi tiếng.", "trap": "B sai vì việc tạo ra nội dung mới dựa trên phong cách đã học là một ứng dụng điển hình của Generative AI."}, {"slide": 93, "q": "True or False: Networking is one of the four key domains of digital transformation.", "opts": {"A": "True", "B": "False"}, "ans": ["B"], "hook": "digital transformation domains → False", "why": "Bốn lĩnh vực chính của chuyển đổi số bao gồm Technology, Data, Process, và Organizational Change chứ không có Networking.", "trap": "A sai vì dễ nhầm lẫn Networking là một phần của hạ tầng công nghệ trong chuyển đổi số."}, {"slide": 94, "q": "True or False. Neural networks are composed of layers, including input, hidden, and output layers, where neurons in each layer are connected to neurons in the next layer.", "opts": {"A": "True", "B": "False"}, "ans": ["A"], "hook": "Neural network → input, hidden, output layers", "why": "Mạng nơ-ron được cấu tạo bởi các lớp gồm lớp đầu vào, lớp ẩn và lớp đầu ra, với các nơ-ron trong mỗi lớp kết nối với nơ-ron của lớp kế tiếp.", "trap": "B sai vì mô tả cấu trúc của mạng nơ-ron là hoàn toàn chính xác."}, {"slide": 96, "q": "What is a primary use case for Generative AI in Java? Select all that apply.", "opts": {"A": "Explaining Java-specific design patterns.", "B": "Writing boilerplate code for APIs.", "C": "Detecting vulnerabilities in deployed systems.", "D": "Deploying applications directly."}, "ans": ["A", "B"], "hook": "Generative AI Java → design patterns, boilerplate", "why": "Generative AI xuất sắc trong việc tạo và giải thích nội dung dựa trên dữ liệu hiện có, rất phù hợp cho việc giải thích các mẫu thiết kế và viết code lặp đi lặp lại.", "trap": "C sai vì phát hiện lỗ hổng trong hệ thống đã triển khai thường cần phân tích runtime và các công cụ bảo mật chuyên biệt, không phải là ứng dụng chính của Generative AI; D sai vì triển khai ứng dụng là một quy trình DevOps yêu cầu công cụ CI/CD, không phải chức năng trực tiếp của Generative AI."}, {"slide": 97, "q": "What are the main features of Amazon Q Developer? Select all that apply", "opts": {"A": "Debugging runtime errors automatically.", "B": "Code generation.", "C": "Automating production deployment.", "D": "Explaining existing code logic."}, "ans": ["B", "D"], "hook": "Amazon Q Developer → Code generation, Explaining code", "why": "Amazon Q Developer là trợ lý AI tập trung vào việc hỗ trợ lập trình viên viết code mới và giải thích hiểu rõ các đoạn code hiện có.", "trap": "A sai vì Amazon Q Developer hỗ trợ phát hiện lỗi và đề xuất sửa lỗi trong code chứ không tự động sửa lỗi runtime khi chương trình đang chạy."}, {"slide": 98, "q": "What should you do if an explanation is too complex? Select all that apply.", "opts": {"A": "Assume the explanation is wrong.", "B": "Ignore the AI and find an alternative tool.", "C": "Request a simpler explanation for beginners.", "D": "Ask for examples to clarify the explanation."}, "ans": ["C", "D"], "hook": "explanation too complex → simpler explanation, examples", "why": "Khi giải thích của AI quá phức tạp, cách xử lý tối ưu là yêu cầu một giải thích đơn giản hơn cho người mới bắt đầu và yêu cầu thêm ví dụ thực tế để làm rõ vấn đề.", "trap": "B sai vì việc bỏ qua AI ngay lập tức và tìm công cụ khác là quá vội vàng khi chưa thử các câu lệnh prompt tối ưu hơn."}, {"slide": 99, "q": "What are some best practices when interacting with ChatGPT for Java-related queries? Select all that apply.", "opts": {"A": "Using clear and specific prompts.", "B": "Asking for real-time error detection in IDEs.", "C": "Providing context to clarify the problem.", "D": "Avoiding detailed follow-up questions."}, "ans": ["A", "C"], "hook": "ChatGPT Java queries → clear specific prompts, providing context", "why": "Để nhận được câu trả lời chính xác nhất từ ChatGPT khi hỏi về Java, người dùng cần cung cấp câu lệnh rõ ràng, cụ thể và bổ sung đầy đủ ngữ cảnh của vấn đề.", "trap": "B sai vì ChatGPT là mô hình ngôn ngữ lớn hoạt động độc lập, không thể tự phát hiện lỗi thời gian thực ngay trong IDE của người dùng được."}, {"slide": 100, "q": "Which features are available in GitHub Copilot for Java developers? Select all that apply.", "opts": {"A": "Conversational support for debugging.", "B": "Built-in IDE debugging tools.", "C": "Code generation for entire blocks.", "D": "Autocompletion of functions and methods."}, "ans": ["C", "D"], "hook": "GitHub Copilot → Code block, Autocomplete", "why": "GitHub Copilot là công cụ AI hỗ trợ viết code thông qua việc gợi ý hoàn thiện hàm hoặc tạo các đoạn mã dựa trên ngữ cảnh.", "trap": "A sai vì Copilot không trực tiếp tích hợp trình gỡ lỗi (debugger) mà chỉ gợi ý sửa lỗi qua chat."}, {"slide": 101, "q": "Which statements are true after a model has been trained on data? Select all that apply.", "opts": {"A": "AI can make predictions or decisions without needing explicit instructions for every scenario.", "B": "AI needs explicit guidance for every scenario in order to make decisions.", "C": "AI cannot make decisions.", "D": "AI is designed to mimic human decision-making processes."}, "ans": ["A", "D"], "hook": "trained model → predictions without instructions, mimic human", "why": "Mô hình AI sau khi huấn luyện có khả năng tự suy luận dựa trên dữ liệu đã học thay vì tuân thủ các quy tắc cứng nhắc.", "trap": "B sai vì mô hình đã huấn luyện không yêu cầu hướng dẫn chi tiết cho từng trường hợp cụ thể."}, {"slide": 102, "q": "How does Amazon Q Developer improve the Java coding experience for developers? (Select all that apply)", "opts": {"A": "Completely replaces the need for testing.", "B": "Provides contextual code suggestions to speed up coding.", "C": "Highlights potential errors and suggests fixes.", "D": "Enhances code optimization and efficiency."}, "ans": ["B", "C", "D"], "hook": "Amazon Q Developer Java → suggestions, errors, optimization", "why": "Amazon Q Developer hỗ trợ lập trình viên Java bằng cách gợi ý mã nguồn theo ngữ cảnh, phát hiện lỗi để sửa và tối ưu hóa hiệu suất code, nhưng không thể thay thế hoàn toàn việc kiểm thử.", "trap": "A sai vì AI hỗ trợ lập trình không bao giờ thay thế hoàn toàn được quy trình testing thủ công và tự động của con người."}, {"slide": 103, "q": "A Generative AI model creates a recipe by learning from thousands of cookbooks and generates a song by analyzing popular music trends. Which concepts describe how AI works to create content like recipes and songs? Select all that apply.", "opts": {"A": "Identifying patterns in large datasets (e.g., cookbooks or music) and creating new outputs based on those learned patterns.", "B": "Pattern recognition from large datasets.", "C": "Use of explicit, hard-coded instructions like if, if-else, for, switch.", "D": "Generating outputs based on learned patterns without relying on extensive datasets.\\"}, "ans": ["A", "B"], "hook": "creates a recipe / generates a song → Pattern recognition / large datasets", "why": "Generative AI hoạt động bằng cách nhận diện các quy luật từ tập dữ liệu lớn đã học để tạo ra nội dung mới như công thức nấu ăn hay bài hát.", "trap": "D sai vì AI tạo sinh bắt buộc phải dựa vào các tập dữ liệu lớn cực kỳ phong phú chứ không thể tạo ra kết quả tốt mà không cần chúng."}, {"slide": 104, "q": "A developer uses GitHub Copilot while working on a Java project. Which tasks can GitHub Copilot assist with? Select all that apply.", "opts": {"A": "Auto-completing code based on existing comments and patterns.", "B": "Suggesting code snippets for common tasks.", "C": "Debugging errors during runtime.", "D": "Ensuring that the generated code can adapt itself to accommodate new requirements during run time."}, "ans": ["A", "B"], "hook": "Copilot → Auto-complete, Snippets", "why": "GitHub Copilot là một công cụ AI hỗ trợ lập trình viên bằng cách tự động hoàn thành mã và gợi ý các đoạn mã.", "trap": "C sai vì Copilot không phải là công cụ debug lỗi runtime, D sai vì Copilot không đảm bảo khả năng thích ứng của mã trong lúc chạy."}, {"slide": 105, "q": "A developer is debugging a large Java application with syntax errors and code optimization needs. They want a tool that provides real-time fixes and suggestions directly within their IDE. Which Generative AI tools should they consider? Select all that apply.", "opts": {"A": "ChatGPT", "B": "IntelliJ IDEA", "C": "GitHub Copilot", "D": "Amazon Q Developer"}, "ans": ["C", "D"], "hook": "real-time, IDE, Java → Copilot, Amazon Q", "why": "GitHub Copilot và Amazon Q Developer là các công cụ Generative AI được tích hợp trực tiếp vào IDE để cung cấp gợi ý và sửa lỗi mã nguồn theo thời gian thực.", "trap": "B sai vì IntelliJ IDEA là một IDE truyền thống chứa các công cụ hỗ trợ chứ bản thân nó không phải là một công cụ Generative AI."}, {"slide": 106, "q": "A company trains a neural network to detect diseases from medical images. Why is it important to validate the model on unseen data? Select all that apply.", "opts": {"A": "To ensure the model generalizes well to new cases.", "B": "To identify biases or inaccuracies in its predictions.", "C": "To confirm that the model memorized all training examples.", "D": "To test the neural network's ability to process noisy inputs."}, "ans": ["A", "B"], "hook": "Unseen data → Generalize & Biases", "why": "Kiểm thử trên dữ liệu chưa thấy giúp xác định khả năng tổng quát hóa và phát hiện các sai lệch của mô hình.", "trap": "C sai vì mục tiêu là tổng quát hóa, không phải ghi nhớ tất cả dữ liệu huấn luyện. D sai vì kiểm tra khả năng xử lý nhiễu là một mục tiêu khác, không phải lý do chính của validation trên unseen data."}, {"slide": 108, "q": "What are the benefits of using ChatGPT in software development? (Select all that apply)", "opts": {"A": "Assistance in generating and refining code snippets.", "B": "Debugging support for identifying and fixing code errors.", "C": "Complete automation of the coding process.", "D": "Quick explanations of complex programming concepts."}, "ans": ["A", "B", "D"], "hook": "ChatGPT benefits → Assistance, Debugging, Quick explanations", "why": "ChatGPT đóng vai trò là công cụ hỗ trợ lập trình viên viết code, sửa lỗi và giải thích khái niệm chứ chưa thể tự động hóa hoàn toàn toàn bộ quy trình phát triển phần mềm.", "trap": "C sai vì ChatGPT không thể tự động hóa hoàn toàn quy trình code mà vẫn cần sự kiểm soát và can thiệp của con người."}, {"slide": 109, "q": "What aspects of code reviews can AI automate? Select all that apply.", "opts": {"A": "Identifying inefficiencies in algorithms.", "B": "Ensuring compliance with coding standards.", "C": "Highlighting security vulnerabilities.", "D": "Writing complete fixes without input."}, "ans": ["A", "B", "C"], "hook": "AI code review → inefficiencies, coding standards, security", "why": "AI có thể phân tích cấu trúc mã nguồn để tìm lỗi bảo mật, quy chuẩn và hiệu suất nhưng chưa thể tự sửa lỗi hoàn toàn mà không cần con người can thiệp.", "trap": "D sai vì AI hiện tại không thể tự viết bản sửa lỗi hoàn chỉnh mà không cần đầu vào hay sự kiểm soát của lập trình viên."}, {"slide": 110, "q": "Which of the following are components of digital transformation? Select all that apply.", "opts": {"A": "The process of using technology to fundamentally redesign how businesses operate and deliver value", "B": "Integrating AI and automation to improve efficiency and decision-making", "C": "Involving software developers to create innovative tools and systems", "D": "Adopting digital tools without changing business processes"}, "ans": ["A", "B", "C"], "hook": "Digital transformation → Redesign, AI, Developers", "why": "Chuyển đổi số bao gồm cả việc thiết kế lại quy trình kinh doanh, tích hợp công nghệ thông minh và sự tham gia của đội ngũ phát triển phần mềm để tạo ra giá trị mới.", "trap": "D sai vì chuyển đổi số đòi hỏi phải thay đổi quy trình kinh doanh chứ không chỉ là áp dụng công cụ mới một cách thụ động."}, {"slide": 111, "q": "Which of the following examples demonstrates the capabilities of Generative AI? Select all that apply.", "opts": {"A": "Writing a new story without any human prompt.", "B": "Producing a unique painting from a text prompt.", "C": "Writing a new story based on a theme.", "D": "Completing a program in Java with suggested enhancements and explanations."}, "ans": ["B", "C", "D"], "hook": "Generative AI → painting from prompt, writing stories, completing code", "why": "Generative AI có khả năng tạo ra nội dung mới, độc đáo từ các gợi ý hoặc tự động, bao gồm văn bản, hình ảnh và mã.", "trap": "A sai vì Generative AI thường cần một prompt (gợi ý) ban đầu, dù là rất nhỏ, để bắt đầu quá trình tạo ra nội dung mới, không hoàn toàn 'without any human prompt'."}, {"slide": 112, "q": "Which of the following are future trends in AI-driven CRM systems? Select all that apply.", "opts": {"A": "Predictive engagement, anticipating customer needs before they arise", "B": "Eliminating all human interaction in customer service", "C": "Seamlessly connecting customer interactions across multiple platforms", "D": "Hyper-personalized marketing campaigns that adapt in real-time"}, "ans": ["A", "C", "D"], "hook": "Future CRM → ACD (Anticipating, Connecting, Data-personalized)", "why": "Xu hướng CRM tương lai tập trung vào dự báo nhu cầu, kết nối đa nền tảng và cá nhân hóa sâu thay vì loại bỏ hoàn toàn con người.", "trap": "B sai vì AI chỉ hỗ trợ chứ không thay thế hoàn toàn sự tương tác của con người trong dịch vụ khách hàng."}, {"slide": 113, "q": "Which of the following are critical strategies for ensuring ethical AI deployment? Select all that apply.", "opts": {"A": "Ignoring data privacy regulations to prioritize innovation", "B": "Regularly auditing AI systems for biases and inaccuracies", "C": "Using diverse and inclusive datasets for training AI models", "D": "Ensuring AI systems are transparent and explainable in their decision-making processes"}, "ans": ["B", "C", "D"], "hook": "Ethical AI → Audit, Diverse, Transparent", "why": "Đạo đức trong AI đòi hỏi sự minh bạch, dữ liệu đa dạng để tránh định kiến và phải được kiểm tra định kỳ để đảm bảo tính chính xác.", "trap": "A sai vì vi phạm quyền riêng tư (privacy) không bao giờ là chiến lược đạo đức cho dù để ưu tiên đổi mới."}, {"slide": 114, "q": "Which of the following are challenges businesses face when integrating AI with supply chain management systems? Select all that apply.", "opts": {"A": "Data scattered across multiple sources and formats", "B": "Employee training required to interpret AI-generated insights", "C": "High initial costs and scalability concerns", "D": "Fully automated inventory and logistics with no human oversight"}, "ans": ["A", "B", "C"], "hook": "Integrating AI challenges → Data, Training, Costs", "why": "Tích hợp AI vào chuỗi cung ứng gặp khó khăn về phân tán dữ liệu, chi phí ban đầu cao và nhân viên chưa đủ trình độ để hiểu kết quả phân tích từ AI.", "trap": "D sai vì việc tự động hóa hoàn toàn không có sự giám sát của con người là một rủi ro cực lớn chứ không phải là một mục tiêu hay thách thức thực tế được khuyến khích khi tích hợp AI."}, {"slide": 115, "q": "Which of the following statements about neural networks is true? Select all that apply.", "opts": {"A": "Weights are initialized by the activation function.", "B": "The Sigmoid activation function produces outputs between 0 and 1, making it suitable for probability-based tasks.", "C": "In a neural network, the updating of the weights takes place only during the training phase.", "D": "The activation function is used to decide which information passes through a neuron."}, "ans": ["B", "C", "D"], "hook": "neural networks → Sigmoid 0-1, update training, activation decide", "why": "Hàm Sigmoid chuẩn hóa đầu ra về khoảng 0 đến 1, trọng số chỉ được cập nhật trong quá trình huấn luyện và hàm kích hoạt đóng vai trò quyết định thông tin nào được truyền qua neuron.", "trap": "A sai vì trọng số (weights) được khởi tạo ngẫu nhiên hoặc theo các phương pháp như Xavier/He chứ không phải do hàm kích hoạt khởi tạo."}, {"slide": 116, "q": "Which of the following are examples of Generative AI tools used for code generation?", "opts": {"A": "Amazon Q Developer", "B": "GitHub Copilot", "C": "DALL-E", "D": "Microsoft Copilot"}, "ans": ["A", "B", "D"], "hook": "Generative AI code → Q, GitHub, Microsoft", "why": "Amazon Q Developer, GitHub Copilot và Microsoft Copilot là các công cụ AI chuyên dụng hỗ trợ viết và tối ưu hóa mã nguồn tự động.", "trap": "C sai vì DALL-E là công cụ tạo hình ảnh từ văn bản chứ không phải công cụ lập trình."}, {"slide": 117, "q": "Which technologies are commonly used to drive digital transformation? Select all that apply.", "opts": {"A": "Artificial Intelligence (AI)", "B": "Legacy Software", "C": "Cloud Computing", "D": "Internet of Things (IoT)"}, "ans": ["A", "C", "D"], "hook": "digital transformation → AI, Cloud, IoT", "why": "Chuyển đổi số luôn gắn liền với các công nghệ hiện đại như trí tuệ nhân tạo, điện toán đám mây và vạn vật kết nối internet thay vì các hệ thống cũ kỹ.", "trap": "B sai vì Legacy Software là phần mềm cũ lỗi thời, là rào cản chứ không phải công nghệ thúc đẩy chuyển đổi số."}, {"slide": 118, "q": "How does Generative AI contribute to effective code reviews? Select all that apply.", "opts": {"A": "By recommending performance optimizations.", "B": "By identifying potential bugs.", "C": "By detecting redundant logic in code.", "D": "Handling hardware configurations automatically."}, "ans": ["A", "B", "C"], "hook": "Generative AI code review → optimize, bug, redundant", "why": "Generative AI giúp cải thiện chất lượng code bằng cách đề xuất tối ưu hóa, phát hiện lỗi và logic trùng lặp.", "trap": "D sai vì Generative AI trong code review không trực tiếp xử lý cấu hình phần cứng."}, {"slide": 119, "q": "A developer uses Generative AI tools like GitHub Copilot and Amazon Q Developer. Which of the following benefits are typical of these tools? Select all that apply.", "opts": {"A": "Generating repetitive boilerplate code.", "B": "Replacing the need for software testing.", "C": "Providing debugging suggestions for common errors.", "D": "Offering intelligent code completion based on the context."}, "ans": ["A", "C", "D"], "hook": "AI tools → Boilerplate, Debugging, Completion", "why": "Các công cụ Generative AI hỗ trợ viết mã lặp lại, gợi ý sửa lỗi và hoàn thiện mã dựa trên ngữ cảnh nhưng không thể thay thế hoàn toàn quy trình kiểm thử.", "trap": "B sai vì AI có thể tạo ra lỗi logic nên vẫn cần testing để đảm bảo chất lượng phần mềm."}, {"slide": 120, "q": "A user wants to generate a detailed essay using a GenAI tool. Which prompt engineering techniques could help? Select all that apply.", "opts": {"A": "Using vague terms like, “Give me something interesting”.", "B": "Offering examples of the desired output to provide the context.", "C": "Specifying role play and the target audience.", "D": "Provide clear instructions, such as, “Write a 500-word essay about climate change in the USA during the last 20 years starting from the current year backward.”"}, "ans": ["B", "C", "D"], "hook": "Detailed essay → Examples, Role, Clear instructions", "why": "Để tạo bài luận chi tiết bằng GenAI cần cung cấp ngữ cảnh cụ thể qua ví dụ, phân vai người viết và các chỉ dẫn rõ ràng về giới hạn nội dung.", "trap": "A sai vì thuật ngữ mơ hồ như Give me something interesting sẽ khiến AI tạo ra nội dung chung chung không đúng mục tiêu."}, {"slide": 121, "q": "A company adopts AI to personalize customer experiences, IoT devices to monitor inventory, and cloud platforms to manage operations. Which aspects of digital transformation are evident in this example? Select all that apply.", "opts": {"A": "Enhancing customer experiences through data-driven insights.", "B": "Eliminating the need for human involvement in all processes.", "C": "Leveraging advanced technologies to improve efficiency.", "D": "Optimizing workflows using digital solutions."}, "ans": ["A", "C", "D"], "hook": "AI, IoT, Cloud → A, C, D", "why": "Việc áp dụng các công nghệ hiện đại nhằm mục đích tối ưu quy trình, tăng hiệu suất và cá nhân hóa trải nghiệm khách hàng thay vì thay thế hoàn toàn con người.", "trap": "B sai vì chuyển đổi số hỗ trợ con người chứ không loại bỏ hoàn toàn sự tham gia của con người trong mọi quy trình."}, {"slide": 122, "q": "A company uses customer data to identify buying patterns, sales data to optimize inventory, and employee data to improve workflows. What aspects of digital transformation does this highlight? Select all that apply.", "opts": {"A": "Using technology to replace all manual tasks.", "B": "Enhancing customer experience through personalization", "C": "Leveraging data for actionable insights.", "D": "Improving operational efficiency."}, "ans": ["B", "C", "D"], "hook": "buying/sales/employee data → B, C, D", "why": "Dữ liệu khách hàng giúp cá nhân hóa, dữ liệu bán hàng mang lại thông tin chi tiết để hành động và dữ liệu nhân viên giúp tối ưu quy trình vận hành.", "trap": "A sai vì chuyển đổi số không có nghĩa là thay thế toàn bộ công việc thủ công bằng công nghệ."}, {"slide": 123, "q": "A bank uses an AI model to approve loan applications. Which methods can improve the model's transparency? Select all that apply.", "opts": {"A": "Applying LIME to explain individual loan decisions.", "B": "Using a black-box model with no explanation capabilities.", "C": "Using SHAP (SHapley Additive exPlanations) to understand feature importance", "D": "Providing clear documentation of how the model works."}, "ans": ["A", "C", "D"], "hook": "AI transparency → LIME, SHAP, documentation", "why": "Các phương pháp giải thích model và tài liệu minh bạch giúp người dùng hiểu rõ căn cứ đưa ra quyết định của AI.", "trap": "B sai vì black-box model không có khả năng giải thích, làm giảm tính minh bạch của hệ thống."}, {"slide": 124, "q": "A developer uses a generative AI tool to build a program. Which of the following tasks can the tool assist with? Select all that apply.", "opts": {"A": "Completing a partially written function.", "B": "Providing suggestions based on comments in the code.", "C": "Deploying the program to production automatically.", "D": "Debugging and improving an existing code snippet."}, "ans": ["A", "B", "D"], "hook": "generative AI tool → Completing, Suggestions, Debugging", "why": "Generative AI hỗ trợ lập trình viên viết tiếp code, gợi ý từ comment và sửa lỗi code nhưng không tự động deploy chương trình lên môi trường production.", "trap": "C sai vì việc tự động deploy lên production là nhiệm vụ của các công cụ CI/CD chứ không thuộc phạm vi hỗ trợ trực tiếp của generative AI sinh mã nguồn."}, {"slide": 125, "q": "Select all that a
