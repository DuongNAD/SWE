r fewer requirements from users.", "C": "It is easier to divide up the work among development team members.", "D": "It is not necessary to maintain the system.", "E": "There is less need for the development team to communicate with the users."}, "ans": ["C"], "hook": "software process → easier to divide work among team", "why": "Quy trình chuẩn giúp phân chia nhiệm vụ rõ ràng và quản lý công việc hiệu quả hơn giữa các thành viên.", "trap": "A sai vì quy trình không thay thế được việc đào tạo nhân sự."}, {"slide": 254, "q": "Which of the following is a key way AI tools can assist in designing software architecture?", "opts": {"A": "Automatically generating boilerplate code and suggesting design patterns.", "B": "Writing and maintaining all the business logic of the application.", "C": "Completely replacing developers in the software design process.", "D": "Ensuring that the software will never require refactoring."}, "ans": ["A"], "hook": "AI software design → boilerplate code, suggest design patterns", "why": "AI đóng vai trò hỗ trợ đắc lực bằng cách tự động hóa các tác vụ lặp lại và đề xuất cấu trúc tối ưu cho kiến trúc phần mềm.", "trap": "C sai vì AI chỉ là công cụ hỗ trợ, không thể thay thế hoàn toàn vai trò tư duy và quyết định của kiến trúc sư phần mềm."}, {"slide": 255, "q": "Which of the following statements is not true about an association relationship?", "opts": {"A": "It is inherently bi-directional.", "B": "It can be restricted to be only unidirectional.", "C": "It represents an instance of the relationship.", "D": "It can normally only be read meaningfully in one direction.", "E": "It is a description of a group of instances of the relationship."}, "ans": ["C"], "hook": "association NOT → NOT an instance of relationship", "why": "Association là một mô tả tổng quát về mối quan hệ giữa các lớp, không phải là một instance cụ thể.", "trap": "A sai vì association mặc định là hai chiều nhưng có thể giới hạn thành một chiều."}, {"slide": 256, "q": "Which of the following statement about early test design is false?", "opts": {"A": "Faults found during early test design are less expensive to fix.", "B": "Early test design can prevent fault multiplication.", "C": "Early test design can find faults.", "D": "Early test design takes more effort.", "E": "Early test design can cause changes to the requirements."}, "ans": ["D"], "hook": "early test design FALSE → FALSE takes more effort", "why": "Thiết kế test sớm giúp phát hiện lỗi sớm nên thực tế tiết kiệm thời gian và công sức tổng thể thay vì làm tăng chúng.", "trap": "A sai vì sửa lỗi sớm luôn rẻ hơn so với sửa ở giai đoạn sau."}, {"slide": 257, "q": "Why is interpretability important in AI systems?", "opts": {"A": "It allows users to understand how decisions are made, especially in critical applications.", "B": "It guarantees that AI systems will always produce 100% accurate results.", "C": "It eliminates the need for data-driven decision-making.", "D": "It ensures that AI systems function without requiring human oversight."}, "ans": ["A"], "hook": "Interpretability → understand decisions", "why": "Tính giải thích giúp con người hiểu được logic và lý do đằng sau các quyết định của hệ thống AI.", "trap": "B sai vì không có công nghệ nào đảm bảo độ chính xác tuyệt đối 100%."}, {"slide": 258, "q": "How does Generative AI enhance the process of detecting bugs in Java code?", "opts": {"A": "By rewriting the buggy code with optimized solutions.", "B": "By completely automating the debugging process.", "C": "By identifying errors through the analysis of code patterns and anomalies.", "D": "By providing a guarantee of error-free Java applications."}, "ans": ["C"], "hook": "GenAI bug detection → code patterns and anomalies", "why": "AI hoạt động bằng cách phân tích cấu trúc mã nguồn để tìm ra các điểm bất thường so với mẫu chuẩn.", "trap": "B sai vì AI chỉ hỗ trợ chứ không thể thay thế hoàn toàn con người trong mọi quy trình debug."}, {"slide": 259, "q": "A developer is using Amazon Q Developer to work on a Java project. The tool suggests code for connecting to a database and identifies a syntax error in a query. Which of the following describes how Amazon Q Developer enhances productivity in this scenario?", "opts": {"A": "It replaces the developer's need to understand the programming language.", "B": "It suggests corrections for syntax errors and provides relevant code snippets.", "C": "It removes the entire code and writes a new program.", "D": "It replaces the developer's need to understand database connections."}, "ans": ["B"], "hook": "Amazon Q Developer → syntax error corrections, code snippets", "why": "Công cụ này hỗ trợ lập trình viên bằng cách cung cấp các đoạn mã phù hợp và phát hiện lỗi sai trực tiếp trong quá trình viết code.", "trap": "A sai vì AI chỉ hỗ trợ chứ không thay thế hoàn toàn kiến thức lập trình của con người."}, {"slide": 260, "q": "A company uses AI for targeted advertising campaigns based on user data. What steps should it prioritize to comply with GDPR and ensure ethical practices?", "opts": {"A": "Using AI to bypass user consent requirements.", "B": "Ensuring that users provide informed consent for data collection and usage.", "C": "Ensuring AI algorithms remain confidential and avoid transparency with regulators.", "D": "Avoiding all forms of data storage to comply with GDPR."}, "ans": ["B"], "hook": "GDPR, AI → Informed consent", "why": "GDPR yêu cầu sự minh bạch và quyền kiểm soát của người dùng thông qua việc đồng ý tham gia thu thập dữ liệu.", "trap": "A sai vì GDPR nghiêm cấm hành vi bỏ qua sự đồng ý của người dùng."}, {"slide": 261, "q": "A healthcare provider adopts an AI tool to predict risks for critical conditions. Doctors express concern about how the AI reaches conclusions, specifically when recommending treatments. Why is it critical for the AI model to provide interpretable results?", "opts": {"A": "To allow stakeholders to understand and trust the AI's decision-making process.", "B": "To ensure users can easily modify the AI model's decisions directly.", "C": "To completely eliminate the need for human oversight in treatment planning.", "D": "To make AI models faster by simplifying algorithms."}, "ans": ["A"], "hook": "AI interpretable → trust stakeholders", "why": "Tính minh bạch giúp bác sĩ hiểu rõ cơ sở logic để tin tưởng và chịu trách nhiệm cho các quyết định y tế.", "trap": "B sai vì mục tiêu là giải thích kết quả chứ không phải cho phép người dùng can thiệp trực tiếp vào thuật toán."}, {"slide": 262, "q": "A financial institution uses an AI model to predict the risk of loan defaults based on customer data, including credit scores, income, and spending patterns. A customer is denied a loan and asks why the AI made this decision. How should the institution provide clarity on the AI's decision?", "opts": {"A": "Avoid using interpretability techniques and simply provide the customer with the raw decision.", "B": "Simplify the AI model by removing features that are hard to interpret.", "C": "Use SHapley Additive exPlanations (SHAP) to calculate and explain each feature's contribution to the decision.", "D": "Use Local Interpretable Model-agnostic Explanations (LIME) to highlight the features that contributed most to the decision."}, "ans": ["C"], "hook": "AI explain decisions → SHAP feature contribution", "why": "SHAP dựa trên lý thuyết trò chơi để phân bổ đóng góp của từng đặc trưng một cách chính xác và công bằng cho kết quả dự đoán.", "trap": "D sai vì LIME chỉ xấp xỉ cục bộ quanh một điểm dữ liệu, không cung cấp độ tin cậy và chính xác về đóng góp tổng thể như SHAP."}, {"slide": 263, "q": "An online bookstore is struggling to compete due to poor customer experiences, delivery delays, and a lack of personalized recommendations. Which strategy best incorporates the four domains of digital transformation to address these issues?", "opts": {"A": "Use customer behavior data to personalize recommendations, implement automated inventory systems, and train employees on digital tools.", "B": "Focus solely on redesigning the website and adding a wish list feature.", "C": "Offer flat discounts to increase sales and collaborate with coffee shops for hybrid events.", "D": "Outsource delivery services and add more staff for manual inventory tracking."}, "ans": ["A"], "hook": "digital transformation → data personalization, automation, training", "why": "Đáp án A bao phủ toàn diện bốn trụ cột chuyển đổi số gồm trải nghiệm khách hàng, quy trình vận hành, công nghệ và năng lực nhân sự.", "trap": "B sai vì chỉ tập trung vào giao diện website mà thiếu đi sự thay đổi về quy trình vận hành và dữ liệu nội bộ."}, {"slide": 264, "q": "An exclusive or (XOR) constraint states that", "opts": {"A": "an attribute cannot have null values.", "B": "an attribute must either be null or can only have one of two values.", "C": "instances of the same class cannot be related to each other.", "D": "instances of only one of two classes can be related to instances of another class.", "E": "two classes cannot be related by an association class."}, "ans": ["D"], "hook": "XOR constraint → only one of two classes", "why": "Ràng buộc XOR đảm bảo rằng tại một thời điểm, một thực thể chỉ có thể tham gia vào đúng một trong các mối quan hệ được chỉ định.", "trap": "B sai vì mô tả về giá trị thuộc tính chứ không phải mối quan hệ giữa các lớp."}, {"slide": 265, "q": "In the UML, the concept of generalization", "opts": {"A": "relates two different classes by an association relationship.", "B": "allows a class to remove attributes and operations from its subclasses.", "C": "supports the concept of stereotype.", "D": "allows a class to specialize its attributes and operations.", "E": "links instances of different classes together."}, "ans": ["D"], "hook": "Generalization → specialize attributes operations", "why": "Generalization thiết lập quan hệ kế thừa, cho phép lớp con kế thừa và chuyên biệt hóa các thuộc tính cùng phương thức từ lớp cha.", "trap": "A sai vì association là quan hệ liên kết ngang, không phải quan hệ cha-con (generalization)."}, {"slide": 266, "q": "In system analysis and design, an entity class represents", "opts": {"A": "information about a user of the system.", "B": "information that is persistent.", "C": "system dependencies on actors.", "D": "information that is transient.", "E": "coordination, sequencing, transactions and control of other objects."}, "ans": ["B"], "hook": "entity class → persistent information", "why": "Entity class dùng để lưu trữ dữ liệu lâu dài trong hệ thống thay vì dữ liệu tạm thời.", "trap": "D sai vì transient chỉ thông tin tạm thời, còn entity class phải là dữ liệu cần lưu trữ lâu dài."}, {"slide": 267, "q": "The incomplete coverage constraint for a generalization relationship means that:", "opts": {"A": "A. a superclass instance can be a member of one or more of the subclasses. [overlapping]", "B": "B. some subclass instance is not a member of any superclass. [not possible]", "C": "C. a superclass instance can be a member of at most one of the subclasses. [disjoint]", "D": "D. each superclass instance is a member of some subclass. [complete]", "E": "E. some superclass instance is not a member of any subclass."}, "ans": ["E"], "hook": "incomplete coverage → superclass not member of any subclass", "why": "Incomplete nghĩa là không đầy đủ, tức là tồn tại đối tượng của superclass không thuộc bất kỳ subclass nào.", "trap": "D sai vì đó là định nghĩa của constraint Complete, yêu cầu mọi superclass instance phải thuộc ít nhất một subclass."}, {"slide": 268, "q": "The best way to conduct a requirements validation review is to", "opts": {"A": "examine the system model for errors", "B": "have the customer look over the requirements", "C": "send them to the system design team and see if they have any concerns", "D": "use a checklist of questions to examine each requirement", "E": "categorize the requirements into functional and nonfunctional"}, "ans": ["D"], "hook": "requirements validation → use a checklist", "why": "Sử dụng bảng kiểm giúp đảm bảo mọi yêu cầu được rà soát một cách hệ thống, đầy đủ và khách quan nhất.", "trap": "B sai vì khách hàng thường không có chuyên môn kỹ thuật để phát hiện các lỗi mâu thuẫn hoặc thiếu sót trong đặc tả yêu cầu."}, {"slide": 269, "q": "The cost of fixing a fault", "opts": {"A": "can never be more than 5% of the total development cost.", "B": "is more expensive if found in requirements than functional design.", "C": "can be estimated by performing a SWOT analysis.", "D": "increases as we move the product towards live use.", "E": "decreases as we move the product towards live use."}, "ans": ["D"], "hook": "cost of fixing fault → increases towards live use", "why": "Lỗi càng để lâu đến giai đoạn vận hành mới sửa thì chi phí khắc phục càng tốn kém do phải thay đổi cấu trúc hệ thống đã hoàn thiện.", "trap": "B sai vì lỗi ở giai đoạn yêu cầu thường dễ sửa và ít tốn kém nhất so với các giai đoạn sau."}, {"slide": 270, "q": "The purpose of an acceptance test plan is to", "opts": {"A": "verify the acceptability of the code structure.", "B": "specify the criteria for determining whether the system is finished.", "C": "list all the requirements for the system.", "D": "define the scope of the system development.", "E": "define the goals of the system."}, "ans": ["B"], "hook": "Acceptance test → criteria system finished", "why": "Acceptance test tập trung xác nhận hệ thống đã đáp ứng đầy đủ yêu cầu để nghiệm thu và bàn giao cho khách hàng.", "trap": "A sai vì code structure là mối quan tâm của unit test hoặc code review chứ không phải acceptance test."}, {"slide": 271, "q": "The Bridge design pattern is used to", "opts": {"A": "provide a unified interface to a subsystem.", "B": "decouple an abstraction from its implementation.provide a placeholder for another object.", "C": "decouple an abstraction from its implementation.", "D": "restrict a class to have only one instance.", "E": "defer instantiation of a class to its subclasses"}, "ans": ["C"], "hook": "Bridge pattern → decouple abstraction from implementation", "why": "Bridge tách biệt phần trừu tượng và hiện thực để chúng có thể thay đổi độc lập.", "trap": "A sai vì mô tả chức năng của Facade pattern."}, {"slide": 272, "q": "Suppose you have a list of students with their study hours and attendance. You are using this list to create a decision tree that predicts whether a student will Pass or Fail based on how many hours they have studied and their attendance. Now, if you use the following dataset to train a decision tree to classify \"Pass\" or \"Fail\" based on study hours and attendance:\n\nStudy Hours | Attendance | Result\ngreater than 8 | greater than 90% | Pass\ngreater than 4 | greater than 70% | Pass\n\nAll other paths should result in a Fail. The decision tree predicts the result for a new student who studied for 6 hours and attended 80% of the classes. What is the most likely output if study hours is evaluated first followed by attendance?", "opts": {"A": "Pass", "B": "The decision tree becomes stuck and cannot proceed to a leaf node because there is insufficient data to complete the decision flow.", "C": "Fail", "D": "Cannot determine"}, "ans": ["A"], "hook": "6 hours, 80% attendance → Pass", "why": "Vì 6 giờ lớn hơn 4 và 80% lớn hơn 70%, thoả mãn điều kiện nhánh thứ hai của cây quyết định.", "trap": "C sai vì dữ liệu đầu vào đã thoả mãn điều kiện của nhánh thứ hai nên kết quả là Pass."}, {"slide": 273, "q": "System analysis and design deals with the implementation environment by", "opts": {"A": "incorporating it into application classes.", "B": "ignoring it (i.e., not taking it into account).", "C": "re-engineering it to fit the design.", "D": "delaying consideration of it until implementation.", "E": "encapsulating it so as to isolate it from application classes."}, "ans": ["E"], "hook": "System analysis → Encapsulating implementation details", "why": "Trong giai đoạn phân tích, ta cần cách ly các chi tiết môi trường thực thi để thiết kế tập trung vào logic nghiệp vụ.", "trap": "A sai vì đưa chi tiết thực thi vào class ứng dụng sẽ làm mất tính độc lập của thiết kế."}, {"slide": 274, "q": "System analysis and design distributes the functionality of a use case into boundary, entity and control classes because", "opts": {"A": "these are the only kinds of classes available to us.", "B": "these classes are easier to test.", "C": "we want to isolate specific types of changes to specific types of classes.", "D": "state machine diagrams use these classes.", "E": "object interaction is more easily described using these classes."}, "ans": ["C"], "hook": "use case class distribution → isolate changes to specific classes", "why": "Việc phân tách chức năng thành ba loại class giúp giới hạn phạm vi ảnh hưởng khi yêu cầu hệ thống thay đổi.", "trap": "E sai vì mục đích chính của mô hình hóa là quản lý sự thay đổi chứ không chỉ để mô tả tương tác dễ hơn."}, {"slide": 275, "q": "You are working on a Java project where you need to quickly set up boilerplate code for a RESTful API. You decide to use Amazon Q Developer for this task. How can Amazon Q Developer assist in generating the boilerplate code?", "opts": {"A": "By analyzing your project structure and generating controller, service, and repository templates.", "B": "By auto-generating entire applications without review.", "C": "By only providing syntax but no context.", "D": "By guessing what the user might need without input."}, "ans": ["A"], "hook": "Amazon Q Developer boilerplate → analyzing project structure", "why": "Công cụ này hiểu ngữ cảnh dự án hiện tại để tạo ra các thành phần Controller, Service và Repository phù hợp với kiến trúc có sẵn.", "trap": "B sai vì Amazon Q Developer không tự động tạo toàn bộ ứng dụng mà không cần con người kiểm tra lại."}];
const KEY = 'swe202c_quiz_v2';
const BUILD = '23:00 11/08';
// localStorage ném SecurityError ở một số origin (file://, khung sandbox, cửa sổ ẩn danh).
// Không được để nó làm chết cả script — hỏng chỗ lưu tiến độ thì vẫn phải làm bài được.
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){ /* chạy không lưu */ } }
};
let saveWorks = true;
const def = () => ({i:0, order:DATA.map((_,i)=>i), res:{}, repeat:true});
let st = def();
try { st = Object.assign(def(), JSON.parse(store.get(KEY) || '{}')); }
catch(e){ st = def(); }
try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); }
catch(e){ saveWorks = false; }
let picked = new Set(), revealed = false, peek = false;

const save = () => store.set(KEY, JSON.stringify(st));
const cur = () => DATA[st.order[st.i]];
const same = (a,b) => a.length===b.length && a.every(x=>b.includes(x));
const esc = s => (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// Nạp trạng thái của câu hiện tại. CHỈ gọi khi đổi câu — không gọi trong render(),
// nếu không mỗi lần vẽ lại sẽ xoá mất lựa chọn người dùng vừa bấm.
function sync(){
  const prev = st.res[st.order[st.i]];
  revealed = !!prev;
  picked = new Set(revealed ? prev.picked : []);
  peek = false;
}

function render(){
  const q = cur(), keys = Object.keys(q.opts).sort(), multi = q.ans.length>1;
  const done = Object.keys(st.res).length, right = Object.values(st.res).filter(r=>r.ok).length;
  document.getElementById('sub').textContent =
    DATA.length + ' câu · đã làm ' + done + ' · đúng ' + right +
    (done ? ' (' + Math.round(right/done*100) + '%)' : '') +
    ' · bản ' + BUILD + (saveWorks ? '' : ' · ⚠️ không lưu được tiến độ ở chế độ xem này');
  document.getElementById('pbar').style.width = (done/DATA.length*100) + '%';
  document.getElementById('stat').textContent = 'Câu ' + (st.i+1) + '/' + st.order.length;

  let h = '<div class="meta"><span>Câu ' + (st.i+1) + ' / ' + st.order.length + '</span>' +
          '<span>slide ' + q.slide + ' · ' + (multi ? 'chọn ' + q.ans.length + ' đáp án' : 'chọn 1 đáp án') +
          '</span></div><div class="q">' + esc(q.q) + '</div>';
  keys.forEach(k => {
    let cls = 'opt' + (revealed ? ' done' : '');
    if(revealed){ if(q.ans.includes(k)) cls += ' ok'; else if(picked.has(k)) cls += ' no'; }
    else if(picked.has(k)) cls += ' sel';
    const mark = (revealed && q.ans.includes(k)) ? '✓'
               : (revealed && picked.has(k)) ? '✕'
               : (picked.has(k) ? (multi ? '✓' : '●') : '');
    h += '<div class="' + cls + '" data-k="' + k + '">' +
         '<span class="box ' + (multi ? 'sq' : 'ci') + '">' + mark + '</span>' +
         '<span class="k">' + k + '.</span><span>' + esc(q.opts[k]) + '</span></div>';
  });
  if(revealed){
    const ok = same([...picked].sort(), [...q.ans].sort());
    h += '<div class="fb ' + (ok ? 'ok' : 'no') + '">' +
         (ok ? '✅ Chính xác!' : '❌ Sai — đáp án đúng: ' + q.ans.join(', ')) + '</div>';
  }
  if((revealed || peek) && (q.hook || q.why || q.trap)){
    h += '<div class="tip"><h4>💡 Mẹo nhớ</h4>';
    if(q.hook) h += '<div class="hook">' + esc(q.hook) + '</div>';
    if(revealed && q.why)  h += '<p>' + esc(q.why) + '</p>';
    if(revealed && q.trap) h += '<p class="trap">⚠️ ' + esc(q.trap) + '</p>';
    if(!revealed) h += '<p style="color:var(--muted)">Trả lời xong sẽ hiện đầy đủ lý do và bẫy.</p>';
    h += '</div>';
  }
  document.getElementById('card').innerHTML = h;
  document.getElementById('check').disabled = revealed || picked.size === 0;
  document.getElementById('tipBtn').disabled = revealed || !(q.hook||q.why||q.trap);
  document.getElementById('prev').disabled = st.i === 0;
  document.getElementById('next').disabled = st.i >= st.order.length - 1;
  document.getElementById('repeat').classList.toggle('on', st.repeat);
  document.getElementById('repeat').textContent = 'Lặp câu sai: ' + (st.repeat ? 'BẬT' : 'TẮT');
}

function toggle(k){
  if(revealed) return;
  const q = cur();
  if(q.ans.length > 1){ picked.has(k) ? picked.delete(k) : picked.add(k); }
  else { picked.clear(); picked.add(k); }
  render();
}

// Một listener duy nhất, uỷ quyền từ thẻ cha — click một lần là một lần.
document.getElementById('card').addEventListener('click', e => {
  const el = e.target.closest('.opt');
  if(el && el.dataset.k) toggle(el.dataset.k);
});

function check(){
  if(revealed || !picked.size) return;
  const q = cur(), idx = st.order[st.i];
  const ok = same([...picked].sort(), [...q.ans].sort());
  st.res[idx] = {picked:[...picked], ok};
  if(!ok && st.repeat && !st.order.slice(st.i+1).includes(idx))
    st.order.splice(Math.min(st.i + 5, st.order.length), 0, idx);
  save(); sync(); render();
}
function go(d){
  const n = st.i + d;
  if(n < 0 || n >= st.order.length) return;
  st.i = n; save(); sync(); render();
}

document.getElementById('check').onclick = check;
document.getElementById('next').onclick = () => go(1);
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('tipBtn').onclick = () => { peek = true; render(); };
document.getElementById('repeat').onclick = () => { st.repeat = !st.repeat; save(); render(); };
document.getElementById('shuffle').onclick = () => {
  for(let i=st.order.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0;
    [st.order[i],st.order[j]]=[st.order[j],st.order[i]]; }
  st.i = 0; save(); sync(); render();
};
document.getElementById('wrongOnly').onclick = () => {
  const w = Object.keys(st.res).filter(k => !st.res[k].ok).map(Number);
  if(!w.length){ alert('Chưa có câu nào sai. Cứ làm tiếp đã!'); return; }
  w.forEach(k => delete st.res[k]);
  st.order = w; st.i = 0; save(); sync(); render();
};
document.getElementById('reset').onclick = () => {
  if(!confirm('Xoá toàn bộ tiến độ và làm lại từ đầu?')) return;
  st = def(); save(); sync(); render();
};
document.addEventListener('keydown', e => {
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toUpperCase();
  if(/^[A-H]$/.test(k) && cur().opts[k]){ e.preventDefault(); toggle(k); return; }
  if(e.key === 'Enter'){ e.preventDefault(); revealed ? go(1) : check(); }
  if(e.key === 'ArrowRight') go(1);
  if(e.key === 'ArrowLeft') go(-1);
  if(k === 'H' && !revealed){ peek = true; render(); }
});
if(st.i >= st.order.length) st.i = 0;
sync();
render();
</script></body></html>
